name: ech-0292_meta

on:
  # Regenerate artifacts whenever source inputs for ech-0292 change.
  push:
    paths:
      - 'ech-0292_meta/input/**'
  workflow_dispatch:

# Zwei gleichzeitige Laeufe erzeugen dieselben Dateien und kollidieren beim
# Push. Bei mehreren Pushes kurz hintereinander zaehlt ohnehin nur der letzte,
# da er den neusten Input verarbeitet -- laufende Laeufe werden abgebrochen.
concurrency:
  group: ech-0292_meta
  cancel-in-progress: true

# Vorerst wird nur die deutsche Fassung erzeugt. Fuer fr/en genuegt es, die
# Kapitel unter input/fr und input/en anzulegen und LANGS zu erweitern.
env:
  LANGS: de

jobs:

  ech-0292_meta:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare output directory
        run: |
          # Start from a clean output tree to avoid stale generated files.
          rm -rf ech-0292_meta/output
          mkdir -p ech-0292_meta/output/docs

      - name: Generate LinkML artefacts
        # Nur die Schema-Exporte: die data_*.yaml sind noch Arbeitsstaende und
        # validieren nicht gegen schema.yaml, eine Konvertierung wuerde abbrechen.
        # Ebenso entfaellt vorerst extract_examples.py (keine Beispieldaten).
        # schema_common.yaml bekommt bewusst keine eigene Doku -- seine Elemente
        # erscheinen in den Dokumenten der importierenden Standards.
        run: |
          cd ech-0292_meta/input
          gen-owl --no-use-native-uris schema.yaml > ../output/schema.ttl
          gen-json-schema schema.yaml > ../output/schema.json

      - name: Generate localized LinkML documentation
        run: |
          # Localized schema files are temporary helpers for docs only.
          TMP_SCHEMA_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_SCHEMA_DIR"' EXIT

          for lang in $LANGS; do
            if [ "$lang" = "en" ]; then
              DOC_SCHEMA="ech-0292_meta/input/schema.yaml"
            else
              DOC_SCHEMA="$TMP_SCHEMA_DIR/schema_gen_${lang}.yaml"
              python .github/workflows/scripts/localize_schema.py \
                ech-0292_meta/input/schema.yaml \
                "$lang" \
                "$DOC_SCHEMA"
            fi

            gen-doc "$DOC_SCHEMA" \
              --directory "ech-0292_meta/output/docs/${lang}" \
              --template-directory "ech-0292_meta/input/docgen/${lang}"
          done

      - name: Install Pandoc
        # Fixed Pandoc version for deterministic conversion output.
        run: |
          curl -fsSL https://github.com/jgm/pandoc/releases/download/3.5/pandoc-3.5-1-amd64.deb -o /tmp/pandoc.deb
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      - name: Install LibreOffice (for direct DOCX -> PDF)
        # LibreOffice converts the finished Word document directly to PDF;
        # fonts-liberation substitutes Arial with matching metrics.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
          soffice --version | head -1

      - name: Download Pandoc pagebreak Lua filter
        run: |
          curl -L https://raw.githubusercontent.com/pandoc-ext/pagebreak/refs/heads/main/pagebreak.lua \
          -o pagebreak.lua

      - name: Merge, convert to Word and PDF per language
        run: |
          for lang in $LANGS; do
            python .github/workflows/scripts/merge_documentation.py ech-0292_meta "$lang" --demote-includes
            footer="$(python .github/workflows/scripts/pdf_footer_info.py "ech-0292_meta/input/${lang}/01_head.md")"
            pandoc "ech-0292_meta/output/documentation_merged_${lang}.md" \
              -o "ech-0292_meta/output/ech-0292_meta_${lang}.docx" \
              --reference-doc=ech-0292_meta/input/template.docx \
              --lua-filter=pagebreak.lua \
              --lua-filter=.github/workflows/scripts/table_captions.lua \
              --lua-filter=.github/workflows/scripts/unnumbered_headings.lua
            python .github/workflows/scripts/set_docx_updatefields.py "ech-0292_meta/output/ech-0292_meta_${lang}.docx"
            python .github/workflows/scripts/shade_alternate_rows.py "ech-0292_meta/output/ech-0292_meta_${lang}.docx"
            python .github/workflows/scripts/set_docx_footer.py "ech-0292_meta/output/ech-0292_meta_${lang}.docx" "$footer"
            python .github/workflows/scripts/set_docx_page_label.py "ech-0292_meta/output/ech-0292_meta_${lang}.docx" "$lang"
            bash .github/workflows/scripts/docx_to_pdf.sh \
              "ech-0292_meta/output/ech-0292_meta_${lang}.docx" \
              "ech-0292_meta/output/ech-0292_meta_${lang}.pdf"
          done

      - name: Commit and push changes
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            # Commit only when generated output has changed.
            git config --global user.name "github-actions"
            git config --global user.email "github-actions@github.com"
            git add ech-0292_meta/output/
            git diff --quiet && git diff --staged --quiet || git commit -m "Auto-generated ech-0292_meta files"
            REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
            # Retry on rejection. docx and pdf are binary and cannot be rebased;
            # move onto the new upstream tip and re-apply our output/ on top.
            for attempt in 1 2 3 4 5; do
              git push "$REMOTE" HEAD:${{ github.ref }} && exit 0
              echo "Push rejected (attempt $attempt) — re-applying output/ onto ${{ github.ref_name }}"
              git fetch "$REMOTE" ${{ github.ref_name }} || exit 1
              git reset --soft FETCH_HEAD || exit 1
              git reset || exit 1
              git add ech-0292_meta/output/
              git diff --staged --quiet && echo "Nothing left to commit" && exit 0
              git commit -m "Auto-generated ech-0292_meta files" || exit 1
              sleep $((RANDOM % 5 + 2))
            done
            echo "::error::Auto-generated push failed after 5 attempts" && exit 1
