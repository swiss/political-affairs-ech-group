id: https://ch.paf.link/schema/meta
name: meta
description: |
  This schema models meta topics for the eCH standards 0293-0297. In a first step, FRBR entities are modelled in order to manage documents and their translations.
annotations:
  description_de: |
    Dieses Schema modelliert Meta-Themen für die eCH Standards 0293-0297. In einem ersten Schritt werden FRBR-Entitäten modelliert, um die Verwaltung von Dokumenten und deren Übersetzungen zu ermöglichen.
  description_fr: |
    Ce schéma modélise les thèmes transversaux des normes eCH 0293-0297. Dans un premier temps, des entités FRBR sont modélisées afin de permettre la gestion des documents et de leurs traductions.
prefixes:
  xsd: http://www.w3.org/2001/XMLSchema#
  prov: http://www.w3.org/ns/prov#
  dcterms: http://purl.org/dc/terms/
  linkml: https://w3id.org/linkml/
  meta: https://ch.paf.link/schema/meta/
imports:
  - linkml:types
  - ../../ech-0292_meta/input/schema_common
default_prefix: meta
default_range: string
  
classes:
  
  Work: # only used if there are still documents, where ever possible the data should directly be structured in the data model
    description: |
      FRBR Work: the abstract document as such, independent of a concrete language version or file format.
    annotations:
      description_de: |
        FRBR Work: das abstrakte Dokument als solches, unabhängig von einer konkreten Sprachfassung oder einem Dateiformat.
      description_fr: |
        FRBR Work : le document abstrait en tant que tel, indépendamment d'une version linguistique ou d'un format de fichier concrets.
    mixins:
      - HasIdentification
    slots:
      - document_category
      - expressions
    
  Expression:
    description: |
      FRBR Expression: a concrete language version of a Work.
    annotations:
      description_de: |
        FRBR Expression: eine konkrete Sprachfassung eines Works.
      description_fr: |
        FRBR Expression : une version linguistique concrète d'un Work.
    mixins:
      - HasIdentification
      - HasCreationModificationDates
    slots:
      - expression_language
      - expression_title
      - expression_description
      - manifestations
    slot_usage:
      date_created:
        description: |
          Date of first publication of the language version.
        annotations:
          description_de: |
            Datum der Erstpublikation der Sprachfassung.
          description_fr: |
            Date de la première publication de la version linguistique.
      datetime_created:
        description: |
          Date and time of first publication of the language version.
        annotations:
          description_de: |
            Datum und Uhrzeit der Erstpublikation der Sprachfassung.
          description_fr: |
            Date et heure de la première publication de la version linguistique.
      date_modified:
        description: |
          Date of the last revision of the language version.
        annotations:
          description_de: |
            Datum der letzten Revision der Sprachfassung.
          description_fr: |
            Date de la dernière révision de la version linguistique.
      datetime_modified:
        description: |
          Date and time of the last revision of the language version.
        annotations:
          description_de: |
            Datum und Uhrzeit der letzten Revision der Sprachfassung.
          description_fr: |
            Date et heure de la dernière révision de la version linguistique.

  Manifestation:
    description: |
      FRBR Manifestation: a concrete file format of an Expression, addressable via a URL.
    annotations:
      description_de: |
        FRBR Manifestation: eine konkrete Dateiform einer Expression, über eine URL adressierbar.
      description_fr: |
        FRBR Manifestation : une forme de fichier concrète d'une Expression, adressable au moyen d'une URL.
    mixins:
      - HasIdentification
      - HasCreationModificationDates
    slots:
      - format
      - manifestation_url
    slot_usage:
      date_created:
        description: |
          Date of first publication of the file form.
        annotations:
          description_de: |
            Datum der Erstpublikation der Dateiform.
          description_fr: |
            Date de la première publication de la forme de fichier.
      datetime_created:
        description: |
          Date and time of first publication of the file form.
        annotations:
          description_de: |
            Datum und Uhrzeit der Erstpublikation der Dateiform.
          description_fr: |
            Date et heure de la première publication de la forme de fichier.
      date_modified:
        description: |
          Date of the last revision of the file form.
        annotations:
          description_de: |
            Datum der letzten Revision der Dateiform.
          description_fr: |
            Date de la dernière révision de la forme de fichier.
      datetime_modified:
        description: |
          Date and time of the last revision of the file form.
        annotations:
          description_de: |
            Datum und Uhrzeit der letzten Revision der Dateiform.
          description_fr: |
            Date et heure de la dernière révision de la forme de fichier.

  # Renamed from the generic `Container` so it does not collide with the
  # `Container` tree_root that every consuming schema defines (e.g. ech-0293
  # imports this schema for the `documents` slot). Newer LinkML treats two
  # equally-named classes from different schemas as a hard error.
  # Not a `tree_root`: this schema is imported by consumers (ech-0293) that
  # define their own tree_root Container, and LinkML allows only one root in
  # the merged schema. Convert meta's own example data with
  # `--target-class WorkContainer`.
  WorkContainer:
    description: |
      Container for the documents (FRBR Works) of this schema. Deliberately not a tree_root, because the consuming schemas define their own Container.
    annotations:
      description_de: |
        Container für die Dokumente (FRBR Works) dieses Schemas. Bewusst kein tree_root, weil die konsumierenden Schemata ihren eigenen Container definieren.
      description_fr: |
        Conteneur pour les documents (FRBR Works) de ce schéma. Volontairement pas un tree_root, car les schémas consommateurs définissent leur propre Container.
    mixins:
      - HasIdentification
    slots:
      - works

slots:
  
  works:
    slot_uri: meta:works
    description: |
      The documents (FRBR Works) contained in the container.
    annotations:
      description_de: |
        Die im Container enthaltenen Dokumente (FRBR Works).
      description_fr: |
        Les documents (FRBR Works) contenus dans le conteneur.
    range: Work
    multivalued: true
    inlined_as_list: true

  expressions:
    slot_uri: meta:expressions
    description: |
      The language versions (Expressions) of a Work.
    annotations:
      description_de: |
        Die Sprachfassungen (Expressions) eines Works.
      description_fr: |
        Les versions linguistiques (Expressions) d'un Work.
    range: Expression
    multivalued: true
    inlined_as_list: true

  manifestations:
    slot_uri: meta:manifestations
    description: |
      The file forms (Manifestations) of an Expression.
    annotations:
      description_de: |
        Die Dateiformen (Manifestations) einer Expression.
      description_fr: |
        Les formes de fichier (Manifestations) d'une Expression.
    range: Manifestation
    multivalued: true
    inlined_as_list: true
  

  # Renamed from the generic `language`/`title`/`description` so they do not
  # collide with same-named slots that consumer schemas (e.g. ech-0293) or
  # schema_common define; newer LinkML treats import-shadowing of a slot name
  # as a hard error.
  expression_language:
    slot_uri: dcterms:language
    range: string
    required: true
    pattern: ^[a-z]{2}$
    description: |
      Language code in ISO 639-1 format.
    annotations:
      description_de: |
        Sprachcode im ISO 639-1-Format.
      description_fr: |
        Code de langue au format ISO 639-1.

  expression_title:
    slot_uri: meta:title
    description: |
      Title of the language version.
    annotations:
      description_de: |
        Titel der Sprachfassung.
      description_fr: |
        Titre de la version linguistique.
    range: string
    required: true

  expression_description:
    slot_uri: schema:description
    description: |
      Descriptive text of the language version.
    annotations:
      description_de: |
        Beschreibender Text zur Sprachfassung.
      description_fr: |
        Texte descriptif de la version linguistique.
    range: string

  format: #probably from http://publications.europa.eu/resource/authority/file-type
    slot_uri: meta:format
    range: string
    description: |
      The file format of the manifestation (e.g., pdf, html).
    annotations:
      description_de: |
        Das Dateiformat der Manifestation (z.B. pdf, html).
      description_fr: |
        Le format de fichier de la manifestation (p. ex. pdf, html).

  # Renamed from the generic `url` to avoid colliding with consumer schemas
  # that define their own `url` slot (ech-0293's is multilingual).
  manifestation_url:
    slot_uri: meta:url
    description: |
      URL under which the file form can be retrieved.
    annotations:
      description_de: |
        URL, unter der die Dateiform abgerufen werden kann.
      description_fr: |
        URL sous laquelle la forme de fichier peut être consultée.
    range: uri

  document_category:
    slot_uri: meta:documentCategory
    description: |
      Category of the document. If not set, 'other' is automatically used.
    annotations:
      description_de: |
        Kategorie des Dokuments. Wenn nicht gesetzt, wird automatisch 'other' verwendet.
      description_fr: |
        Catégorie du document. Si elle n'est pas renseignée, la valeur 'other' est utilisée automatiquement.
    range: DocumentCategoryEnum
    ifabsent: string(other)

  documents:
    slot_uri: meta:documents
    description: |
      List of documents (FRBR Works) linked to the entity.
    annotations:
      description_de: |
        Liste von Dokumenten (FRBR Works), die mit der Entität verknüpft sind.
      description_fr: |
        Liste des documents (FRBR Works) liés à l'entité.
    range: Work
    multivalued: true
    inlined_as_list: true

enums:

  DocumentCategoryEnum:
    description: |
      Categories for classifying documents referenced in eCH standards 0292-0297. Multilingual labels (DE/FR/IT/RM/EN) are encoded via `annotations` (convention `label_xx`); first proposals for FR/IT/RM are pending plenum review.
    annotations:
      description_de: |
        Kategorien zur Klassifikation von Dokumenten, die in den eCH Standards 0292-0297 referenziert werden. Mehrsprachige Labels (DE/FR/IT/RM/EN) sind über `annotations` (Konvention `label_xx`) abgebildet; Erstvorschläge für FR/IT/RM stehen unter Plenum-Review.
      description_fr: |
        Catégories de classification des documents référencés dans les normes eCH 0292-0297. Les libellés multilingues (DE/FR/IT/RM/EN) sont représentés au moyen d'`annotations` (convention `label_xx`) ; les premières propositions pour FR/IT/RM sont en cours de revue par le plénum.
    permissible_values:

      meeting_planning:
        title: Meeting planning
        description: |
          Planning of meetings and sessions. Examples: invitation, seating plan, time budget, deadlines for motions.
        meaning: meta:vocabulary/document_category/MeetingPlanning
        annotations:
          description_de: |
            Planung von Sitzungen und Sessionen. Beispiele: Einladung, Sitzplan, Zeitbudget, Fristen für Einzelanträge.
          description_fr: |
            Planification des séances et des sessions. Exemples : convocation, plan de salle, budget-temps, délais pour les propositions individuelles.
          label_de: Sitzungsplanung
          label_fr: Planification de séance
          label_it: Pianificazione della seduta
          label_rm: Planisaziun da sesida
          label_en: Meeting planning

      meeting_documents:
        title: Meeting documents
        description: |
          Documents on the affairs of a meeting. Examples: agenda, session programme, list of parliamentary interventions.
        meaning: meta:vocabulary/document_category/MeetingDocuments
        annotations:
          description_de: |
            Unterlagen zu den Geschäften einer Sitzung. Beispiele: Traktandenliste, Sessionsprogramm, Vorstossliste.
          description_fr: |
            Documents relatifs aux affaires d'une séance. Exemples : ordre du jour, programme de session, liste des interventions.
          label_de: Sitzungsunterlagen
          label_fr: Documents de séance
          label_it: Documenti di seduta
          label_rm: Documents da sesida
          label_en: Meeting documents

      protocol:
        title: Protocol
        description: |
          Record of the proceedings of a meeting. Examples: verbatim record, decision minutes, speaker list, video recording.
        meaning: meta:vocabulary/document_category/Protocol
        annotations:
          description_de: |
            Aufzeichnung des Verlaufs einer Sitzung. Beispiele: Wortprotokoll, Beschlussprotokoll, Rednerliste, Videoaufzeichnung.
          description_fr: |
            Enregistrement du déroulement d'une séance. Exemples : procès-verbal in extenso, procès-verbal des décisions, liste des orateurs, enregistrement vidéo.
          label_de: Protokoll
          label_fr: Procès-verbal
          label_it: Verbale
          label_rm: Protocol
          label_en: Minutes

      voting_result:
        title: Voting result
        description: |
          Results of votes and elections. Examples: voting record, election record.
        meaning: meta:vocabulary/document_category/VotingResult
        annotations:
          description_de: |
            Ergebnisse von Abstimmungen und Wahlen. Beispiele: Abstimmungsprotokoll, Wahlprotokoll.
          description_fr: |
            Résultats des votes et des élections. Exemples : procès-verbal de vote, procès-verbal d'élection.
          label_de: Abstimmungsergebnis
          label_fr: Résultat du vote
          label_it: Risultato della votazione
          label_rm: Resultat da votaziun
          label_en: Voting result

      legislative_documents:
        title: Legislative documents
        description: |
          Documents of the legislative process. Examples: draft act, explanatory report, adopted act, consolidated version.
        meaning: meta:vocabulary/document_category/LegislativeDocuments
        annotations:
          description_de: |
            Dokumente des Gesetzgebungsverfahrens. Beispiele: Erlassentwurf, erläuternder Bericht, beschlossener Erlass, konsolidierte Fassung.
          description_fr: |
            Documents de la procédure législative. Exemples : projet d'acte, rapport explicatif, acte adopté, version consolidée.
          label_de: Gesetzgebungsdokumente
          label_fr: Documents législatifs
          label_it: Documenti legislativi
          label_rm: Documents legislativs
          label_en: Legislative documents

      consultation_documents:
        title: Consultation documents
        description: |
          Documents opening a consultation. Examples: invitation, list of addressees, questionnaire, synoptic table.
        meaning: meta:vocabulary/document_category/ConsultationDocuments
        annotations:
          description_de: |
            Unterlagen zur Eröffnung einer Vernehmlassung. Beispiele: Einladung, Adressatenliste, Fragebogen, synoptische Darstellung (Fahne).
          description_fr: |
            Documents d'ouverture d'une consultation. Exemples : invitation, liste des destinataires, questionnaire, tableau synoptique.
          label_de: Vernehmlassungsdokumente
          label_fr: Documents de consultation
          label_it: Documenti di consultazione
          label_rm: Documents da consultaziun
          label_en: Consultation documents

      consultation_results:
        title: Consultation results
        description: |
          Results of a consultation. Examples: statement of an organisation or person, report on the results.
        meaning: meta:vocabulary/document_category/ConsultationResults
        annotations:
          description_de: |
            Ergebnisse einer Vernehmlassung. Beispiele: Stellungnahme einer Organisation oder Person, Ergebnisbericht.
          description_fr: |
            Résultats d'une consultation. Exemples : prise de position d'une organisation ou d'une personne, rapport sur les résultats.
          label_de: Vernehmlassungsresultate
          label_fr: Résultats de la consultation
          label_it: Risultati della consultazione
          label_rm: Resultats da la consultaziun
          label_en: Consultation results

      media_release:
        title: Media release
        description: |
          Press releases.
        meaning: meta:vocabulary/document_category/MediaRelease
        annotations:
          description_de: |
            Medienmitteilungen.
          description_fr: |
            Communiqués de presse.
          label_de: Medienmitteilung
          label_fr: Communiqué de presse
          label_it: Comunicato stampa
          label_rm: Communicaziun da medias
          label_en: Media release

      group_documents:
        title: Group documents
        description: |
          Documents of a group such as a committee or party. Examples: statutes, annual report, committee allocation.
        meaning: meta:vocabulary/document_category/GroupDocuments
        annotations:
          description_de: |
            Unterlagen einer Gruppe wie Kommission oder Partei. Beispiele: Statuten, Jahresbericht, Kommissionszuteilung.
          description_fr: |
            Documents d'un groupe tel qu'une commission ou un parti. Exemples : statuts, rapport annuel, répartition dans les commissions.
          label_de: Gruppenunterlagen
          label_fr: Documents de groupe
          label_it: Documenti di gruppo
          label_rm: Documents da gruppa
          label_en: Group documents

      member_directory:
        title: Member directory
        description: |
          Lists of members. Examples: members of the councils, committee members, members of friendship groups.
        meaning: meta:vocabulary/document_category/MemberDirectory
        annotations:
          description_de: |
            Mitgliederlisten. Beispiele: Mitglieder der Räte, Kommissionsmitglieder, Mitglieder von Freundschaftsgruppen.
          description_fr: |
            Listes des membres. Exemples : membres des conseils, membres des commissions, membres des groupes d'amitié.
          label_de: Mitgliederverzeichnis
          label_fr: Liste des membres
          label_it: Elenco dei membri
          label_rm: Glista dals commembers
          label_en: Member directory

      person_documents:
        title: Person documents
        description: |
          Documents on individual persons. Examples: portrait of a council member, list of personal staff.
        meaning: meta:vocabulary/document_category/PersonDocuments
        annotations:
          description_de: |
            Unterlagen zu einzelnen Personen. Beispiele: Porträt eines Ratsmitglieds, Liste der persönlichen Mitarbeitenden.
          description_fr: |
            Documents relatifs à des personnes. Exemples : portrait d'un membre du conseil, liste des collaboratrices et collaborateurs personnels.
          label_de: Personenunterlagen
          label_fr: Documents personnels
          label_it: Documenti personali
          label_rm: Documents da persuna
          label_en: Person documents

      interest_disclosure:
        title: Interest disclosure
        description: |
          Registers of the interests of council members. Example: register of interests of the National Council.
        meaning: meta:vocabulary/document_category/InterestDisclosure
        annotations:
          description_de: |
            Register der Interessenbindungen von Ratsmitgliedern. Beispiel: Register der Interessenbindungen des Nationalrats.
          description_fr: |
            Registres des liens d'intérêts des membres des conseils. Exemple : registre des liens d'intérêts du Conseil national.
          label_de: Interessenbindungen
          label_fr: Liens d'intérêts
          label_it: Relazioni d'interesse
          label_rm: Colliaziuns d'interess
          label_en: Interest disclosures

      other:
        title: Other
        description: |
          Document that fits none of the categories, or whose category is unknown. Default if `document_category` is not set.
        meaning: meta:vocabulary/document_category/Other
        annotations:
          description_de: |
            Dokument, das keiner Kategorie zugeordnet werden kann oder dessen Kategorie unbekannt ist. Default, wenn `document_category` nicht gesetzt ist.
          description_fr: |
            Document ne relevant d'aucune catégorie ou dont la catégorie est inconnue. Valeur par défaut si `document_category` n'est pas renseigné.
          label_de: Andere
          label_fr: Autre
          label_it: Altro
          label_rm: Auter
          label_en: Other
