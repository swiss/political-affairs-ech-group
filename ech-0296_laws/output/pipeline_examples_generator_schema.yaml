id: https://ld.ech.ch/schema/0296/laws
name: ech-0296-laws-schema
title: eCH-0296 Erlasse und Gesetzestexte
description: 'LinkML schema for the Fedlex-specific subset of AkomaNtoso 3.0 covering Swiss federal law texts (eCH-0296).
  Models the full document structure (act, FRBR metadata, preface, body, legislative hierarchy, article content) and encodes
  all Fedlex Schematron constraints (AKN-fedlex-1.sch) as annotations. Intended for documentation generation and as the basis
  for a Fedlex-conformant XSD.

  '
license: CC-BY
prefixes:
  linkml: https://w3id.org/linkml/
  laws: https://ld.ech.ch/schema/0296/laws/
  akn: http://docs.oasis-open.org/legaldocml/ns/akn/3.0/
  fedlex: http://fedlex.admin.ch/
  xsd: http://www.w3.org/2001/XMLSchema#
  eli: http://data.europa.eu/eli/ontology#
  jolux: http://data.legilux.public.lu/resource/ontology/jolux#
default_prefix: laws
default_range: string
imports:
- linkml:types
types:
  ELI_URI:
    uri: xsd:anyURI
    base: str
    description: 'A European Legislation Identifier (ELI) URI used by Fedlex. Example: https://fedlex.data.admin.ch/eli/cc/1999/404/20290101/main-text

      '
    annotations:
      description_de: Ein European Legislation Identifier (ELI) URI, wie von Fedlex verwendet.
  EIdType:
    uri: xsd:string
    base: str
    description: 'A unique element identifier within an AkomaNtoso document (@eId). Follows the AKN eId naming convention,
      e.g. ''ti_1'', ''ch_1'', ''art_1'', ''art_1-para_1''. Required by Fedlex Schematron on all hierarchical elements, articles,
      subdivisions, and paragraphs.

      '
    annotations:
      description_de: 'Eindeutiger Element-Identifier innerhalb eines AkomaNtoso-Dokuments (@eId). Folgt der AKN-eId-Konvention,
        z.B. ''ti_1'', ''ch_1'', ''art_1'', ''art_1-para_1''. Gemäss Fedlex Schematron Pflicht bei allen Hierarchieelementen,
        Artikeln, Unterabschnitten und Absätzen.

        '
  AnchorRef:
    uri: xsd:string
    base: str
    description: >-
      An intra-document reference formatted as '#id', pointing to an eId or TLC element.
    annotations:
      description_de: >-
        Eine Dokument-interne Referenz im Format '#id', die auf ein eId oder TLC-Element zeigt.
  XmlContent:
    uri: xsd:string
    base: str
    description: 'XML mixed content: text with optional inline markup. Allowed inline elements: akn:ref, akn:span, akn:b,
      akn:i, akn:sup, akn:authorialNote, akn:mod, akn:ins, akn:del, akn:mmod, akn:rmod, akn:rref. Note: akn:br is restricted
      to heading-type elements only (FLX-TXT-001).

      '
    annotations:
      description_de: 'Gemischter XML-Inhalt: Text mit optionalem Inline-Markup. Erlaubte Inline-Elemente: akn:ref, akn:span,
        akn:b, akn:i, akn:sup, akn:authorialNote, akn:mod, akn:ins, akn:del. Hinweis: akn:br ist nur in Überschriften-Elementen
        erlaubt (FLX-TXT-001).

        '
enums:
  ActTypeEnum:
    description: Type of legislative act expressed in the akn:act/@name attribute.
    permissible_values:
      publicLaw:
        description: A public law act
        annotations:
          description_de: Ein Erlass des öffentlichen Rechts
      privateAct:
        description: A private law act
        annotations:
          description_de: Ein Erlass des Privatrechts
      amendment:
        description: An amending act
        annotations:
          description_de: Eine Änderung
      constitution:
        description: A constitutional act
        annotations:
          description_de: Eine Verfassung
    annotations:
      description_de: Art des Erlasses, ausgedrückt im @name-Attribut von akn:act.
  DocumentLanguageEnum:
    description: Language codes used for Swiss federal documents.
    permissible_values:
      de:
        description: German
        annotations:
          description_de: Deutsch
      fr:
        description: French
        annotations:
          description_de: Französisch
      it:
        description: Italian
        annotations:
          description_de: Italienisch
      rm:
        description: Romansh
        annotations:
          description_de: Rätoromanisch
      en:
        description: English
        annotations:
          description_de: Englisch
      ger:
        description: >-
          Deutsch in ISO 639-2/B, as cantonal collections write it; Fedlex uses 'de' (ISO 639-1).
        annotations:
          description_de: 'Deutsch nach ISO 639-2/B, wie es kantonale Sammlungen schreiben; Fedlex verwendet „de“ (ISO 639-1).

            '
      fre:
        description: 'Französisch in ISO 639-2/B, as cantonal collections write it; Fedlex uses ''fr'' (ISO 639-1).

          '
        annotations:
          description_de: 'Französisch nach ISO 639-2/B, wie es kantonale Sammlungen schreiben; Fedlex verwendet „fr“ (ISO
            639-1).

            '
      ita:
        description: 'Italienisch in ISO 639-2/B, as cantonal collections write it; Fedlex uses ''it'' (ISO 639-1).

          '
        annotations:
          description_de: 'Italienisch nach ISO 639-2/B, wie es kantonale Sammlungen schreiben; Fedlex verwendet „it“ (ISO
            639-1).

            '
      roh:
        description: 'Rätoromanisch in ISO 639-2/B, as cantonal collections write it; Fedlex uses ''rm'' (ISO 639-1).

          '
        annotations:
          description_de: 'Rätoromanisch nach ISO 639-2/B, wie es kantonale Sammlungen schreiben; Fedlex verwendet „rm“ (ISO
            639-1).

            '
      eng:
        description: >-
          Englisch in ISO 639-2/B, as cantonal collections write it; Fedlex uses 'en' (ISO 639-1).
        annotations:
          description_de: 'Englisch nach ISO 639-2/B, wie es kantonale Sammlungen schreiben; Fedlex verwendet „en“ (ISO 639-1).

            '
    annotations:
      description_de: Sprachcodes für schweizerische Bundesdokumente.
  FedlexRoleEnum:
    description: 'Allowed values for the fedlex:role extension attribute (FLX-XF-003). ''marginal'' is only permitted on akn:level
      elements (FLX-XF-004). ''reference'' is only permitted on akn:subheading elements (FLX-XF-005).

      '
    permissible_values:
      marginal:
        description: Marks a level as a marginal note. Only allowed on akn:level (FLX-XF-004).
        annotations:
          description_de: Kennzeichnet ein level als Randnote. Nur bei akn:level erlaubt (FLX-XF-004).
      reference:
        description: >-
          Marks a subheading as a reference heading. Only allowed on akn:subheading (FLX-XF-005).
        annotations:
          description_de: 'Kennzeichnet eine Unterüberschrift als Referenzüberschrift. Nur bei akn:subheading erlaubt (FLX-XF-005).

            '
      heading:
        description: 'Marks a paragraph as a heading; found on akn:p in the preamble of the Federal Constitution. Outside
          the reach of FLX-XF-003, which governs akn:level and akn:subheading.

          '
        annotations:
          description_de: 'Kennzeichnet einen Absatz als Überschrift; kommt an akn:p in der Präambel der Bundesverfassung
            vor. Ausserhalb der Reichweite von FLX-XF-003, die akn:level und akn:subheading regelt.

            '
    annotations:
      description_de: 'Erlaubte Werte für das Fedlex-Erweiterungsattribut fedlex:role (FLX-XF-003). ''marginal'' nur bei akn:level-Elementen
        (FLX-XF-004). ''reference'' nur bei akn:subheading-Elementen (FLX-XF-005).

        '
  DocNameEnum:
    description: Kinds of embedded document Fedlex uses in akn:doc/@name.
    annotations:
      description_de: Arten beiliegender Dokumente, die Fedlex in akn:doc/@name verwendet.
    permissible_values:
      annex:
        description: An annex to the act.
        annotations:
          description_de: Ein Anhang zum Erlass.
  ContainerNameEnum:
    description: Container purposes Fedlex uses in akn:container/@name.
    annotations:
      description_de: Zwecke, die Fedlex in akn:container/@name verwendet.
    permissible_values:
      headerOfAnnex:
        description: Heading area of an annex.
        annotations:
          description_de: Kopfbereich eines Anhangs.
  BlockNameEnum:
    description: Block purposes Fedlex uses in akn:block/@name.
    annotations:
      description_de: Zwecke, die Fedlex in akn:block/@name verwendet.
    permissible_values:
      heading:
        description: The heading of the enclosing container.
        annotations:
          description_de: Die Überschrift des umgebenden Behälters.
      num:
        description: The number of the enclosing container.
        annotations:
          description_de: Die Nummer des umgebenden Behälters.
  FrbrDateNameEnum:
    description: 'Date types Fedlex uses in akn:FRBRdate/@name, taken from the JoLux vocabulary. Cantonal publishers use their
      own designations; the slot therefore also admits a free string.

      '
    annotations:
      description_de: 'Datumsarten, die Fedlex in akn:FRBRdate/@name verwendet, aus dem JoLux-Vokabular. Kantonale Publikationsstellen
        führen eigene Bezeichnungen, weshalb der Slot auch eine freie Zeichenkette zulässt.

        '
    permissible_values:
      jolux:dateDocument:
        description: Date of adoption or signature of the act.
        annotations:
          description_de: Datum der Verabschiedung oder Unterzeichnung des Erlasses.
        exact_mappings:
        - eli:date_document
        meaning: jolux:dateDocument
      jolux:dateEntryInForce:
        description: Date on which the act, or its first part, came into force.
        annotations:
          description_de: Datum, an dem der Erlass oder sein erster Teil in Kraft trat.
        exact_mappings:
        - eli:first_date_entry_in_force
        meaning: jolux:dateEntryInForce
      jolux:dateApplicability:
        description: 'Date up to which the consolidated version reflects the law -- the ''Stand am'' of the Fedlex delivery.

          '
        annotations:
          description_de: 'Datum, auf das die konsolidierte Fassung nachgeführt ist — der „Stand am“ der Fedlex-Auslieferung.

            '
        exact_mappings:
        - eli:date_applicability
        meaning: jolux:dateApplicability
  ModTypeEnum:
    description: 'Kinds of modification defined by Akoma Ntoso: the textual ones from the TextualMods list, those of legal
      force from ForceMods.

      '
    annotations:
      description_de: 'Änderungsarten, die Akoma Ntoso definiert: die textlichen aus der Liste TextualMods, die der Rechtskraft
        aus ForceMods.

        '
    permissible_values:
      repeal:
        description: Wording is repealed.
        annotations:
          description_de: Wortlaut wird aufgehoben.
      substitution:
        description: Wording is replaced by other wording.
        annotations:
          description_de: Wortlaut wird durch anderen ersetzt.
      insertion:
        description: Wording is inserted.
        annotations:
          description_de: Wortlaut wird eingefügt.
      replacement:
        description: An element is replaced as a whole.
        annotations:
          description_de: Ein Element wird als Ganzes ersetzt.
      renumbering:
        description: An element is renumbered.
        annotations:
          description_de: Ein Element wird neu nummeriert.
      split:
        description: An element is split into several.
        annotations:
          description_de: Ein Element wird in mehrere geteilt.
      join:
        description: Several elements are joined into one.
        annotations:
          description_de: Mehrere Elemente werden zu einem zusammengeführt.
      entryIntoForce:
        description: Comes into force.
        annotations:
          description_de: Tritt in Kraft.
      endOfEnactment:
        description: Ceases to be in force.
        annotations:
          description_de: Tritt ausser Kraft.
      postponementOfEntryIntoForce:
        description: Entry into force is postponed.
        annotations:
          description_de: Das Inkrafttreten wird aufgeschoben.
      prorogationOfForce:
        description: Force is extended.
        annotations:
          description_de: Die Geltung wird verlängert.
      reEnactment:
        description: Is enacted anew.
        annotations:
          description_de: Wird neu erlassen.
      unconstitutionality:
        description: Is declared unconstitutional.
        annotations:
          description_de: Wird für verfassungswidrig erklärt.
classes:
  FedlexDocument:
    tree_root: true
    description: 'Root element of a Fedlex AkomaNtoso document (akn:akomaNtoso). Must contain exactly one akn:act element
      and no other children (FLX-RT-001). Carries the AkomaNtoso namespace declaration and the Fedlex extension namespace.

      '
    annotations:
      description_de: 'Wurzelelement eines Fedlex AkomaNtoso-Dokuments (akn:akomaNtoso). Muss genau ein akn:act-Element enthalten,
        keine weiteren Kinder (FLX-RT-001). Trägt die AkomaNtoso-Namespace-Deklaration und den Fedlex-Erweiterungs-Namespace.

        '
      xml_element: akn:akomaNtoso
      xml_namespace: http://docs.oasis-open.org/legaldocml/ns/akn/3.0
      xml_namespace_fedlex: http://fedlex.admin.ch/
      schematron_rule: 'FLX-RT-001: The document root should only contain an act'
    slots:
    - act_ref
    exact_mappings:
    - akn:akomaNtoso
  Act:
    description: 'The legislative act element (akn:act). Main content container of an AkomaNtoso document. The @name attribute
      specifies the type of act (e.g. ''publicLaw'').

      '
    annotations:
      description_de: 'Das Erlasselement (akn:act). Hauptinhaltselement eines AkomaNtoso-Dokuments. Das @name-Attribut gibt
        den Erlasstyp an (z.B. ''publicLaw'').

        '
      xml_element: akn:act
    slots:
    - act_name
    - meta
    - preface_ref
    - preamble_ref
    - body
    - components_ref
    - conclusions_ref
    - attachments_ref
    exact_mappings:
    - akn:act
  ActMeta:
    description: 'Metadata section of the act (akn:meta). Contains FRBR identification (Work, Expression, Manifestation levels)
      and named reference definitions.

      '
    annotations:
      description_de: 'Metadaten-Abschnitt des Erlasses (akn:meta). Enthält die FRBR-Identifikation (Work-, Expression-, Manifestations-Ebene)
        sowie benannte Referenz-Definitionen.

        '
      xml_element: akn:meta
    slots:
    - identification_ref
    - analysis_ref
    - temporal_data_ref
    - references_ref
    - notes_ref
    exact_mappings:
    - akn:meta
  Identification:
    description: 'FRBR identification block (akn:identification) grouping Work, Expression, and Manifestation descriptions.
      The @source attribute references the responsible organization as an intra-document anchor (e.g. ''#ch.bk'').

      '
    annotations:
      description_de: 'FRBR-Identifikationsblock (akn:identification) mit Work-, Expression- und Manifestations-Beschreibungen.
        Das @source-Attribut referenziert die verantwortliche Organisation als Dokument-internen Anker (z.B. ''#ch.bk'').

        '
      xml_element: akn:identification
    slots:
    - source
    - frbr_work
    - frbr_expression
    - frbr_manifestation
    exact_mappings:
    - akn:identification
  FRBRWork:
    description: 'FRBR Work level (akn:FRBRWork): the abstract legislative text independent of language or version. Contains
      ELI URIs, Fedlex/JoLux dates, authors, country code (CH), SR number, and multilingual names with short forms.

      '
    annotations:
      description_de: 'FRBR-Work-Ebene (akn:FRBRWork): der abstrakte Erlass unabhängig von Sprache und Version. Enthält ELI-URIs,
        Fedlex/JoLux-Daten, Autoren, Ländercode (CH), SR-Nummer und mehrsprachige Namen mit Kurzformen.

        '
      xml_element: akn:FRBRWork
    slots:
    - frbr_this
    - frbr_uri
    - frbr_dates
    - frbr_authors
    - frbr_country
    - frbr_subtype
    - frbr_number
    - frbr_names
    - frbr_authoritative
    exact_mappings:
    - akn:FRBRWork
    class_uri: eli:LegalResource
  FRBRExpression:
    description: 'FRBR Expression level (akn:FRBRExpression): a specific language version of the legislative text. Identified
      by an ELI URI that includes the language code.

      '
    annotations:
      description_de: 'FRBR-Expression-Ebene (akn:FRBRExpression): eine sprachspezifische Version des Erlasses. Identifiziert
        durch einen ELI-URI mit Sprachcode.

        '
      xml_element: akn:FRBRExpression
    slots:
    - frbr_this
    - frbr_uri
    - frbr_dates
    - frbr_authors
    - frbr_language
    exact_mappings:
    - akn:FRBRExpression
    class_uri: eli:LegalExpression
  FRBRManifestation:
    description: 'FRBR Manifestation level (akn:FRBRManifestation): a specific file format of the expression. For Fedlex XML
      files the format value is ''xml''. The optional fedlex:generator attribute is only permitted here (FLX-XF-002).

      '
    annotations:
      description_de: 'FRBR-Manifestations-Ebene (akn:FRBRManifestation): ein spezifisches Dateiformat der Expression. Für
        Fedlex XML-Dateien ist der Formatwert ''xml''. Das optionale Attribut fedlex:generator ist nur hier erlaubt (FLX-XF-002).

        '
      xml_element: akn:FRBRManifestation
      schematron_note: 'FLX-XF-002: fedlex:generator only allowed on FRBRformat[@value=''xml'']'
    slots:
    - frbr_this
    - frbr_uri
    - frbr_dates
    - frbr_authors
    - frbr_format
    exact_mappings:
    - akn:FRBRManifestation
    class_uri: eli:Format
  FRBRDate:
    description: 'A date entry for an FRBR entity (akn:FRBRdate). The @name attribute uses Fedlex/JoLux vocabulary: jolux:dateEntryInForce,
      jolux:dateDocument, jolux:dateApplicability.

      '
    annotations:
      description_de: 'Ein Datumseintrag einer FRBR-Entität (akn:FRBRdate). Das @name-Attribut verwendet Fedlex/JoLux-Vokabular:
        jolux:dateEntryInForce, jolux:dateDocument, jolux:dateApplicability.

        '
      xml_element: akn:FRBRdate
    slots:
    - date_value
    - frbr_date_name
    exact_mappings:
    - akn:FRBRdate
  FRBRAuthor:
    description: 'An author or rights-holder entry for an FRBR entity (akn:FRBRauthor). @href references the organization;
      @as references the role (both as intra-document anchors).

      '
    annotations:
      description_de: 'Ein Autoren- oder Rechteinhaber-Eintrag einer FRBR-Entität (akn:FRBRauthor). @href referenziert die
        Organisation; @as referenziert die Rolle (beide als Dokument-interne Anker).

        '
      xml_element: akn:FRBRauthor
    slots:
    - href
    - as_role
    exact_mappings:
    - akn:FRBRauthor
  FRBRName:
    description: 'A multilingual name entry for the FRBR Work (akn:FRBRname). Carries the full official name and an optional
      abbreviation. One entry per language.

      '
    annotations:
      description_de: 'Ein mehrsprachiger Namenseintrag des FRBR-Works (akn:FRBRname). Enthält den offiziellen Langtitel und
        eine optionale Abkürzung. Ein Eintrag pro Sprache.

        '
      xml_element: akn:FRBRname
    slots:
    - xml_lang
    - value
    - short_form
    exact_mappings:
    - akn:FRBRname
    close_mappings:
    - eli:title
  ValueType:
    description: 'A simple holder carrying a single @value attribute (AKN valueType). Reused for FRBRcountry, FRBRnumber,
      FRBRauthoritative, etc.

      '
    slots:
    - value
    - show_as
    annotations:
      description_de: 'Einfacher Halter mit einem einzelnen @value-Attribut (AKN valueType). Wiederverwendet für FRBRcountry,
        FRBRnumber, FRBRauthoritative usw.

        '
  UriValueType:
    description: 'A holder carrying a single @value attribute typed as an ELI URI (AKN valueType). Reused for FRBRthis and
      FRBRuri.

      '
    slots:
    - value_uri
    - show_as
    annotations:
      description_de: 'Halter mit einem @value-Attribut vom Typ ELI-URI (AKN valueType). Wiederverwendet für FRBRthis und
        FRBRuri.

        '
  LanguageType:
    description: A holder carrying a single @language attribute (akn:FRBRlanguage).
    slots:
    - language_value
    - show_as
    annotations:
      description_de: Halter mit einem einzelnen @language-Attribut (akn:FRBRlanguage).
  FormatType:
    description: 'A holder for akn:FRBRformat: a @value (typically ''xml'') plus the optional fedlex:generator extension attribute
      (FLX-XF-002).

      '
    slots:
    - value
    - fedlex_generator
    - show_as
    annotations:
      description_de: 'Halter für akn:FRBRformat: ein @value (typischerweise ''xml'') plus das optionale Erweiterungsattribut
        fedlex:generator (FLX-XF-002).

        '
  References:
    description: 'Named reference definitions used across the document (akn:references). Defines organizations, roles, and
      other entities that are referenced by anchor (@href=''#eId'') elsewhere in the document.

      '
    annotations:
      description_de: 'Benannte Referenz-Definitionen für das gesamte Dokument (akn:references). Definiert Organisationen,
        Rollen und andere Entitäten, die über Anker (@href=''#eId'') referenziert werden.

        '
      xml_element: akn:references
    slots:
    - source
    - original_ref
    - active_refs
    - tlc_organizations
    - tlc_roles
    - tlc_references
    - tlc_concepts
    exact_mappings:
    - akn:references
  TLCOrganization:
    description: 'A named organization used as a reference throughout the document (akn:TLCOrganization). Example: the Federal
      Chancellery (ch.bk).

      '
    annotations:
      description_de: 'Eine benannte Organisation als Referenz im Dokument (akn:TLCOrganization). Beispiel: die Bundeskanzlei
        (ch.bk).

        '
      xml_element: akn:TLCOrganization
    slots:
    - eId
    - href
    - show_as
    exact_mappings:
    - akn:TLCOrganization
  TLCRole:
    description: 'A named role used as a reference throughout the document (akn:TLCRole). Examples: publisher, rightsHolder.

      '
    annotations:
      description_de: 'Eine benannte Rolle als Referenz im Dokument (akn:TLCRole). Beispiele: publisher, rightsHolder.

        '
      xml_element: akn:TLCRole
    slots:
    - eId
    - href
    - show_as
    exact_mappings:
    - akn:TLCRole
  TLCReference:
    description: 'A generic named reference in the document (akn:TLCReference). Used for references that do not fit the TLCOrganization
      or TLCRole categories.

      '
    annotations:
      description_de: 'Eine generische benannte Referenz im Dokument (akn:TLCReference). Für Referenzen, die nicht TLCOrganization
        oder TLCRole entsprechen.

        '
      xml_element: akn:TLCReference
    slots:
    - eId
    - name_attr
    - href
    - show_as
    exact_mappings:
    - akn:TLCReference
  Preface:
    description: 'The preface of the act (akn:preface), containing the document number and title. Fedlex Schematron requires
      both akn:docNumber (FLX-PF-001) and akn:docTitle (FLX-PF-002) to be present inside a akn:p element.

      '
    annotations:
      description_de: 'Der Vorspann des Erlasses (akn:preface) mit Dokumentnummer und -titel. Fedlex Schematron verlangt akn:docNumber
        (FLX-PF-001) und akn:docTitle (FLX-PF-002) innerhalb eines akn:p-Elements.

        '
      xml_element: akn:preface
      schematron_rules: 'FLX-PF-001: Missing docNumber; FLX-PF-002: Missing docTitle'
    slots:
    - preface_paragraphs
    - containers
    exact_mappings:
    - akn:preface
  PrefaceP:
    description: 'A preface paragraph (akn:p). Fedlex requires akn:docNumber and akn:docTitle somewhere in the preface (FLX-PF-001/002);
      cantonal collections additionally mark up the systematic number, the short title, the abbreviation and the date.

      '
    annotations:
      description_de: 'Ein Vorspann-Absatz (akn:p). Fedlex verlangt akn:docNumber und akn:docTitle irgendwo im Vorspann (FLX-PF-001/002);
        kantonale Sammlungen zeichnen zusätzlich Ordnungsnummer, Kurztitel, Abkürzung und Datum aus.

        '
      xml_element: akn:p
      xsd_mixed: 'true'
    slots:
    - fedlex_role
    - inline_content
    exact_mappings:
    - akn:p
  Preamble:
    description: 'The preamble of the act (akn:preamble), containing introductory prose paragraphs preceding the operative
      body.

      '
    annotations:
      description_de: 'Die Präambel des Erlasses (akn:preamble) mit einleitenden Fliesstext-Absätzen vor dem Hauptteil.

        '
      xml_element: akn:preamble
    slots:
    - content_blocks
    exact_mappings:
    - akn:preamble
  ActBody:
    description: 'The main body of the act (akn:body), containing the legislative hierarchy. Allowed direct children are restricted
      to: book, title, part, chapter, subchapter, section, subsection, level, article, transitional, proviso. No other elements
      are permitted (FLX-BD-001).

      '
    annotations:
      description_de: 'Der Hauptteil des Erlasses (akn:body) mit der Gesetzeshierarchie. Erlaubte direkte Kinder: book, title,
        part, chapter, subchapter, section, subsection, level, article, transitional, proviso. Keine anderen Elemente erlaubt
        (FLX-BD-001).

        '
      xml_element: akn:body
      xsd_content_model: choice
      schematron_rule: >-
        FLX-BD-001: Illegal element in body — only the listed hierarchy elements are permitted
    slots:
    - eId
    - period
    - status
    - books
    - titles
    - parts
    - chapters
    - subchapters
    - sections
    - subsections
    - levels
    - articles
    - transitionals
    - provisos
    - component_refs
    exact_mappings:
    - akn:body
  Book:
    description: 'Book-level division of an act (akn:book). Allowed children: title, part, chapter, subchapter, section, subsection,
      level (FLX-HR-001-bk). Requires unique @eId (FLX-HR-002-bk).

      '
    annotations:
      description_de: 'Buch-Ebene eines Erlasses (akn:book). Erlaubte Kinder: title, part, chapter, subchapter, section, subsection,
        level (FLX-HR-001-bk). Benötigt eindeutiges @eId (FLX-HR-002-bk).

        '
      xml_element: akn:book
      xsd_content_model: choice
      schematron_rules: FLX-HR-001-bk, FLX-HR-002-bk
    slots:
    - eId
    - num
    - heading
    - subheading
    - titles
    - parts
    - chapters
    - subchapters
    - sections
    - subsections
    - levels
    - articles
    slot_usage:
      eId:
        required: true
    exact_mappings:
    - akn:book
  Title:
    description: 'Title-level division of an act (akn:title). Allowed children: book, part, chapter, subchapter, section,
      subsection, level (FLX-HR-001-ti). Requires unique @eId (FLX-HR-002-ti).

      '
    annotations:
      description_de: 'Titel-Ebene eines Erlasses (akn:title). Erlaubte Kinder: book, part, chapter, subchapter, section,
        subsection, level (FLX-HR-001-ti). Benötigt eindeutiges @eId (FLX-HR-002-ti).

        '
      xml_element: akn:title
      xsd_content_model: choice
      schematron_rules: FLX-HR-001-ti, FLX-HR-002-ti
    slots:
    - eId
    - num
    - heading
    - subheading
    - books
    - parts
    - chapters
    - subchapters
    - sections
    - subsections
    - levels
    - articles
    slot_usage:
      eId:
        required: true
    exact_mappings:
    - akn:title
  Part:
    description: 'Part-level division of an act (akn:part). Allowed children: chapter, subchapter, section, subsection, level
      (FLX-HR-001-pt). Requires unique @eId (FLX-HR-002-pt).

      '
    annotations:
      description_de: 'Teil-Ebene eines Erlasses (akn:part). Erlaubte Kinder: chapter, subchapter, section, subsection, level
        (FLX-HR-001-pt). Benötigt eindeutiges @eId (FLX-HR-002-pt).

        '
      xml_element: akn:part
      xsd_content_model: choice
      schematron_rules: FLX-HR-001-pt, FLX-HR-002-pt
    slots:
    - eId
    - num
    - heading
    - subheading
    - chapters
    - subchapters
    - sections
    - subsections
    - levels
    - articles
    slot_usage:
      eId:
        required: true
    exact_mappings:
    - akn:part
  Chapter:
    description: 'Chapter-level division of an act (akn:chapter). Allowed children: subchapter, section, subsection, level,
      and directly article (FLX-HR-001-ch). Requires unique @eId (FLX-HR-002-ch).

      '
    annotations:
      description_de: 'Kapitel-Ebene eines Erlasses (akn:chapter). Erlaubte Kinder: subchapter, section, subsection, level,
        sowie direkt article (FLX-HR-001-ch). Benötigt eindeutiges @eId (FLX-HR-002-ch).

        '
      xml_element: akn:chapter
      xsd_content_model: choice
      schematron_rules: FLX-HR-001-ch, FLX-HR-002-ch
    slots:
    - eId
    - num
    - heading
    - subheading
    - subchapters
    - sections
    - subsections
    - levels
    - articles
    slot_usage:
      eId:
        required: true
    exact_mappings:
    - akn:chapter
  Subchapter:
    description: 'Subchapter-level division (akn:subchapter). Allowed children: section, subsection, level, and directly article
      (FLX-HR-001-sh). Requires unique @eId (FLX-HR-002-sh).

      '
    annotations:
      description_de: 'Unterkapitel-Ebene (akn:subchapter). Erlaubte Kinder: section, subsection, level, sowie direkt article
        (FLX-HR-001-sh). Benötigt eindeutiges @eId (FLX-HR-002-sh).

        '
      xml_element: akn:subchapter
      xsd_content_model: choice
      schematron_rules: FLX-HR-001-sh, FLX-HR-002-sh
    slots:
    - eId
    - num
    - heading
    - subheading
    - sections
    - subsections
    - levels
    - articles
    slot_usage:
      eId:
        required: true
    exact_mappings:
    - akn:subchapter
  Section:
    description: 'Section-level division (akn:section). Allowed children: subsection, level, and directly article (FLX-HR-001-sc).
      Requires unique @eId (FLX-HR-002-sc).

      '
    annotations:
      description_de: 'Abschnitt-Ebene (akn:section). Erlaubte Kinder: subsection, level, sowie direkt article (FLX-HR-001-sc).
        Benötigt eindeutiges @eId (FLX-HR-002-sc).

        '
      xml_element: akn:section
      xsd_content_model: choice
      schematron_rules: FLX-HR-001-sc, FLX-HR-002-sc
    slots:
    - eId
    - num
    - heading
    - subheading
    - subsections
    - levels
    - articles
    slot_usage:
      eId:
        required: true
    exact_mappings:
    - akn:section
  Subsection:
    description: 'Subsection-level division (akn:subsection). Allowed children: level, and directly article (FLX-HR-001-ss).
      Requires unique @eId (FLX-HR-002-ss).

      '
    annotations:
      description_de: 'Unterabschnitt-Ebene (akn:subsection). Erlaubte Kinder: level, sowie direkt article (FLX-HR-001-ss).
        Benötigt eindeutiges @eId (FLX-HR-002-ss).

        '
      xml_element: akn:subsection
      xsd_content_model: choice
      schematron_rules: FLX-HR-001-ss, FLX-HR-002-ss
    slots:
    - eId
    - num
    - heading
    - subheading
    - levels
    - articles
    slot_usage:
      eId:
        required: true
    exact_mappings:
    - akn:subsection
  Level:
    description: 'Transparent structural division (akn:level). A level is ''transparent'': its allowed children are the same
      as those of its nearest non-level ancestor (FLX-HR-001-lv). A level containing akn:content is only permitted when the
      content includes a modification element (akn:mod) — used for amending acts (FLX-HR-003). The fedlex:role=''marginal''
      attribute marks it as a marginal note (FLX-XF-004). Requires unique @eId (FLX-HR-002-lv, FLX-HR-004).

      '
    annotations:
      description_de: 'Transparente Strukturebene (akn:level). Ein level ist ''transparent'': erlaubte Kinder entsprechen
        denen des nächsten nicht-level-Vorfahren (FLX-HR-001-lv). Ein level mit akn:content ist nur erlaubt, wenn der Inhalt
        ein Änderungselement (akn:mod) enthält (FLX-HR-003). fedlex:role=''marginal'' kennzeichnet es als Randnote (FLX-XF-004).
        Benötigt eindeutiges @eId (FLX-HR-002-lv, FLX-HR-004).

        '
      xml_element: akn:level
      xsd_content_model: choice
      schematron_rules: FLX-HR-001-lv, FLX-HR-002-lv, FLX-HR-003, FLX-HR-004, FLX-XF-004
      transparency_note: '[en] ''level'' is transparent: XPath context for child validation uses the nearest non-level ancestor.
        This cannot be expressed in XSD; enforced by Schematron FLX-HR-001-lv. [de] ''level'' ist transparent: der XPath-Kontext
        für die Kindvalidierung nutzt den nächsten nicht-level-Vorfahren. Nicht in XSD ausdrückbar; durch Schematron FLX-HR-001-lv
        erzwungen.

        '
    slots:
    - eId
    - num
    - heading
    - subheading
    - fedlex_role
    - content_ref
    - books
    - titles
    - parts
    - chapters
    - subchapters
    - sections
    - subsections
    - articles
    slot_usage:
      eId:
        required: true
      fedlex_role:
        description: 'When set, must be ''marginal'' (FLX-XF-004). The value ''reference'' is not allowed on level; it is
          reserved for subheading (FLX-XF-005).

          '
        annotations:
          description_de: 'Wenn gesetzt, muss der Wert ''marginal'' sein (FLX-XF-004). Der Wert ''reference'' ist bei level
            nicht erlaubt; er ist für subheading reserviert (FLX-XF-005).

            '
    exact_mappings:
    - akn:level
  Article:
    description: 'An article, the primary legislative unit (akn:article). Constraints (FLX-ART-*): - akn:num is mandatory
      (FLX-ART-001) - only heading elements (num, heading, subheading) plus akn:paragraph and akn:subdivision are allowed
      as children (FLX-ART-002) - requires unique @eId (FLX-ART-003)

      '
    annotations:
      description_de: 'Ein Artikel, die primäre legislative Einheit (akn:article). Constraints (FLX-ART-*): - akn:num ist
        obligatorisch (FLX-ART-001) - nur Überschriften-Elemente (num, heading, subheading) sowie akn:paragraph und akn:subdivision
        sind als Kinder erlaubt (FLX-ART-002) - benötigt eindeutiges @eId (FLX-ART-003)

        '
      xml_element: akn:article
      xsd_content_model: choice
      schematron_rules: 'FLX-ART-001: num mandatory; FLX-ART-002: content restricted to heading+paragraph+subdivision; FLX-ART-003:
        eId required

        '
    slots:
    - eId
    - num
    - heading
    - subheading
    - paragraphs
    - subdivisions
    slot_usage:
      eId:
        required: false
        description: 'Element identifier. Required on every article by the Fedlex Schematron (FLX-EID-001); cantonal collections
          do not always carry it.

          '
        annotations:
          description_de: 'Element-Identifikator. Vom Fedlex-Schematron an jedem Artikel verlangt (FLX-EID-001); kantonale
            Sammlungen führen ihn nicht durchgehend.

            '
      num:
        required: true
        description: The article number (e.g. 'Art. 1'). Mandatory in every article (FLX-ART-001).
        annotations:
          description_de: Die Artikelnummer (z.B. 'Art. 1'). In jedem Artikel obligatorisch (FLX-ART-001).
    exact_mappings:
    - akn:article
  Subdivision:
    description: 'A subdivision within an article grouping related paragraphs (akn:subdivision). Constraints (FLX-SD-*): -
      only heading elements and akn:paragraph are allowed as children (FLX-SD-001) - only permitted as a direct child of akn:article,
      not nested (FLX-SD-002) - requires unique @eId (FLX-SD-003)

      '
    annotations:
      description_de: 'Ein Unterabschnitt in einem Artikel, der zusammengehörige Absätze gruppiert (akn:subdivision). Constraints
        (FLX-SD-*): - nur Überschriften-Elemente und akn:paragraph als Kinder erlaubt (FLX-SD-001) - nur als direktes Kind
        von akn:article erlaubt, keine Verschachtelung (FLX-SD-002) - benötigt eindeutiges @eId (FLX-SD-003)

        '
      xml_element: akn:subdivision
      xsd_content_model: choice
      schematron_rules: >-
        FLX-SD-001: content restricted; FLX-SD-002: only in article; FLX-SD-003: eId required
    slots:
    - eId
    - num
    - heading
    - subheading
    - paragraphs
    slot_usage:
      eId:
        required: true
    exact_mappings:
    - akn:subdivision
  Paragraph:
    description: 'A paragraph within an article or subdivision (akn:paragraph). Constraints (FLX-PR-*): - only heading elements
      and akn:content are allowed as children (FLX-PR-001) - only permitted as a direct child of akn:article or akn:subdivision
      (FLX-PR-002) - requires unique @eId (FLX-PR-003)

      '
    annotations:
      description_de: 'Ein Absatz innerhalb eines Artikels oder Unterabschnitts (akn:paragraph). Constraints (FLX-PR-*): -
        nur Überschriften-Elemente und akn:content als Kinder erlaubt (FLX-PR-001) - nur als direktes Kind von akn:article
        oder akn:subdivision erlaubt (FLX-PR-002) - benötigt eindeutiges @eId (FLX-PR-003)

        '
      xml_element: akn:paragraph
      schematron_rules: 'FLX-PR-001: content restricted; FLX-PR-002: only in article/subdivision; FLX-PR-003: eId required

        '
    slots:
    - eId
    - num
    - heading
    - content_ref
    slot_usage:
      eId:
        required: true
    exact_mappings:
    - akn:paragraph
  Transitional:
    description: 'A transitional provision in the body of an act (akn:transitional). Permitted as a top-level body element
      (FLX-BD-001). Structure follows article conventions.

      '
    annotations:
      description_de: 'Eine Übergangsbestimmung im Hauptteil eines Erlasses (akn:transitional). Als Hauptteil-Element auf
        oberster Ebene erlaubt (FLX-BD-001). Struktur wie Artikel.

        '
      xml_element: akn:transitional
      xsd_content_model: choice
    slots:
    - eId
    - num
    - heading
    - levels
    - articles
    - paragraphs
    slot_usage:
      eId:
        required: true
    exact_mappings:
    - akn:transitional
  Proviso:
    description: 'A proviso in the body of an act (akn:proviso). Permitted as a top-level body element (FLX-BD-001). Typically
      appears after the main articles.

      '
    annotations:
      description_de: 'Ein Vorbehalt im Hauptteil eines Erlasses (akn:proviso). Als Hauptteil-Element auf oberster Ebene erlaubt
        (FLX-BD-001). Erscheint typischerweise nach den Hauptartikeln.

        '
      xml_element: akn:proviso
      xsd_content_model: choice
    slots:
    - eId
    - num
    - heading
    - paragraphs
    - levels
    - articles
    slot_usage:
      eId:
        required: true
    exact_mappings:
    - akn:proviso
  Content:
    description: 'The content of a paragraph (akn:content). Contains block-level elements: akn:p (prose), akn:blockList (numbered/lettered
      lists), akn:table. When used inside a akn:level, must contain an akn:mod element (FLX-HR-003).

      '
    annotations:
      description_de: 'Der Inhalt eines Absatzes (akn:content). Enthält Block-Elemente: akn:p (Fliesstext), akn:blockList
        (Aufzählungen), akn:table. Wenn in einem akn:level, muss ein akn:mod-Element enthalten sein (FLX-HR-003).

        '
      xml_element: akn:content
      xsd_content_model: choice
      schematron_note: >-
        FLX-HR-003: content in level only allowed for modifications (must contain akn:mod)
    slots:
    - eId
    - content_blocks
    exact_mappings:
    - akn:content
  BlockParagraph:
    description: 'A prose paragraph within content (akn:p). May contain mixed content with inline markup (XmlContent type).
      Note: akn:br is not allowed here, only in heading elements (FLX-TXT-001).

      '
    annotations:
      description_de: 'Ein Fliesstext-Absatz in Content (akn:p). Kann gemischten Inhalt mit Inline-Markup enthalten (XmlContent-Typ).
        Hinweis: akn:br ist hier nicht erlaubt, nur in Überschriften (FLX-TXT-001).

        '
      xml_element: akn:p
      schematron_note: 'FLX-TXT-001: br not allowed in p — only in heading/subheading/docTitle'
    slots:
    - fedlex_role
    - inline_content
    exact_mappings:
    - akn:p
    is_a: BlockElement
  BlockList:
    description: 'A block list of enumerated or lettered items (akn:blockList), optionally introduced by an akn:listIntroduction
      element.

      '
    annotations:
      description_de: 'Eine Auflistung von nummerierten oder buchstabierten Punkten (akn:blockList), optional eingeleitet
        durch ein akn:listIntroduction-Element.

        '
      xml_element: akn:blockList
    slots:
    - style
    - eId
    - list_introduction
    - items
    exact_mappings:
    - akn:blockList
    is_a: BlockElement
  BlockListItem:
    description: 'A single item in a block list (akn:item). Carries a num label and block content directly: prose paragraphs
      (akn:p) and optionally nested block lists.

      '
    annotations:
      description_de: 'Ein einzelner Punkt in einer Auflistung (akn:item). Trägt ein num-Label und Block-Inhalt direkt: Fliesstext-Absätze
        (akn:p) und optional verschachtelte Listen.

        '
      xml_element: akn:item
      xsd_content_model: choice
    slots:
    - eId
    - num
    - heading
    - content_blocks
    exact_mappings:
    - akn:item
  Table:
    description: 'A table element within content (akn:table). Contains rows (akn:tr) with cells (akn:td). Corresponds to the
      HTML table model.

      '
    annotations:
      description_de: 'Ein Tabellen-Element innerhalb von Content (akn:table). Enthält Zeilen (akn:tr) mit Zellen (akn:td).
        Entspricht dem HTML-Tabellenmodell.

        '
      xml_element: akn:table
    slots:
    - border
    - table_rows
    exact_mappings:
    - akn:table
    is_a: BlockElement
  TableRow:
    description: A row in an AkomaNtoso table (akn:tr).
    annotations:
      description_de: Eine Zeile in einer AkomaNtoso-Tabelle (akn:tr).
      xml_element: akn:tr
    slots:
    - table_cells
    exact_mappings:
    - akn:tr
  TableCell:
    description: 'A cell in a table row (akn:td). Contains block content: prose paragraphs (akn:p) and block lists (akn:blockList).

      '
    annotations:
      description_de: 'Eine Zelle in einer Tabellenzeile (akn:td). Enthält Block-Inhalt: Fliesstext-Absätze (akn:p) und Auflistungen
        (akn:blockList).

        '
      xml_element: akn:td
      xsd_content_model: choice
    slots:
    - colspan
    - content_blocks
    exact_mappings:
    - akn:td
  InlineElement:
    abstract: true
    description: Abstract base for a modeled inline-markup element inside mixed content.
    slots:
    - element_type
    annotations:
      description_de: Abstrakte Basis für ein modelliertes Inline-Markup-Element in gemischtem Inhalt.
  MixedText:
    description: 'Reusable mixed-content holder: an ordered run of text and inline markup. Used as the range for num, heading,
      subheading, listIntroduction, docTitle, so the wrapping element name comes from the referring slot''s xml_element.

      '
    slots:
    - eId
    - inline_content
    annotations:
      description_de: 'Wiederverwendbarer Halter für gemischten Inhalt: eine geordnete Folge aus Text und Inline-Markup. Range
        für num, heading, subheading, listIntroduction, docTitle; der umschliessende Elementname kommt vom referenzierenden
        Slot.

        '
  TextRun:
    is_a: InlineElement
    description: 'A plain run of character data within mixed content. Emitted as the text node of a mixed complexType, not
      as an element.

      '
    slots:
    - text
    annotations:
      description_de: 'Ein einfacher Textabschnitt in gemischtem Inhalt. Wird als Textknoten eines mixed-complexType ausgegeben,
        nicht als Element.

        '
  Ref:
    is_a: InlineElement
    description: 'An inline reference (akn:ref). Carries @href, and for internal SR cross-references the Fedlex extension
      attributes fedlex:rs and fedlex:rs-uri.

      '
    annotations:
      description_de: 'Eine Inline-Referenz (akn:ref). Trägt @href, und bei internen SR-Querverweisen die Fedlex-Erweiterungsattribute
        fedlex:rs und fedlex:rs-uri.

        '
      xml_element: akn:ref
    slots:
    - eId
    - href
    - fedlex_rs
    - fedlex_rs_uri
    - inline_content
    exact_mappings:
    - akn:ref
  B:
    is_a: InlineElement
    description: Bold inline markup (akn:b).
    annotations:
      description_de: Fett-Inline-Markup (akn:b).
      xml_element: akn:b
    slots:
    - inline_content
    exact_mappings:
    - akn:b
  I:
    is_a: InlineElement
    description: Italic inline markup (akn:i).
    annotations:
      description_de: Kursiv-Inline-Markup (akn:i).
      xml_element: akn:i
    slots:
    - inline_content
    exact_mappings:
    - akn:i
  Sup:
    is_a: InlineElement
    description: Superscript inline markup (akn:sup).
    annotations:
      description_de: Hochgestelltes Inline-Markup (akn:sup).
      xml_element: akn:sup
    slots:
    - inline_content
    exact_mappings:
    - akn:sup
  Span:
    is_a: InlineElement
    description: Generic inline span (akn:span).
    annotations:
      description_de: Generischer Inline-Bereich (akn:span).
      xml_element: akn:span
    slots:
    - inline_content
    exact_mappings:
    - akn:span
  Br:
    is_a: InlineElement
    description: 'A line break (akn:br). In the (currently disabled) FLX-TXT-001 rule, br is restricted to heading-type elements.

      '
    annotations:
      description_de: 'Ein Zeilenumbruch (akn:br). In der (derzeit deaktivierten) Regel FLX-TXT-001 ist br auf Überschriften-Elemente
        beschränkt.

        '
      xml_element: akn:br
    exact_mappings:
    - akn:br
  Inline:
    is_a: InlineElement
    description: A named presentational inline (akn:inline), e.g. name='man-font-style-normal'.
    annotations:
      description_de: 'Ein benanntes präsentationsbezogenes Inline (akn:inline), z.B. name=''man-font-style-normal''.

        '
      xml_element: akn:inline
    slots:
    - name_attr
    - inline_content
    exact_mappings:
    - akn:inline
  Placeholder:
    is_a: InlineElement
    description: 'A placeholder for stripped content (akn:placeholder), carrying the fedlex:message extension attribute (e.g.
      ''E40S10-TAB'').

      '
    annotations:
      description_de: 'Ein Platzhalter für entfernten Inhalt (akn:placeholder) mit dem Erweiterungsattribut fedlex:message
        (z.B. ''E40S10-TAB'').

        '
      xml_element: akn:placeholder
    slots:
    - fedlex_message
    - inline_content
    exact_mappings:
    - akn:placeholder
  AuthorialNote:
    is_a: InlineElement
    description: 'An authorial footnote (akn:authorialNote). Recurses into block content: it contains one or more akn:p paragraphs,
      which themselves carry inline content.

      '
    annotations:
      description_de: 'Eine Fussnote des Autors (akn:authorialNote). Rekursiv in Block-Inhalt: enthält ein oder mehrere akn:p-Absätze,
        die selbst Inline-Inhalt tragen.

        '
      xml_element: akn:authorialNote
    slots:
    - marker
    - eId
    - content_blocks
    exact_mappings:
    - akn:authorialNote
  Components:
    description: >-
      Container for the documents embedded in an act (akn:components), such as its annex.
    annotations:
      description_de: 'Behälter für die Dokumente, die einem Erlass beiliegen (akn:components) — etwa seinen Anhang.

        '
      xml_element: akn:components
    slots:
    - component_list
    exact_mappings:
    - akn:components
  Component:
    description: A single embedded document (akn:component).
    annotations:
      description_de: Ein einzelnes beiliegendes Dokument (akn:component).
      xml_element: akn:component
    slots:
    - doc_ref
    exact_mappings:
    - akn:component
  Doc:
    description: 'An embedded document (akn:doc). Its @name states the kind; Fedlex uses ''annex''. It carries its own identification,
      which in the Fedlex files repeats the URIs of the act it belongs to.

      '
    annotations:
      description_de: 'Ein beiliegendes Dokument (akn:doc). Das @name-Attribut nennt die Art; Fedlex verwendet ''annex''.
        Es führt einen eigenen Identifikationsblock, der in den Fedlex-Dateien die URIs des zugehörigen Erlasses wiederholt.

        '
      xml_element: akn:doc
    slots:
    - doc_name
    - meta
    - preface_ref
    - main_body
    exact_mappings:
    - akn:doc
  MainBody:
    description: 'Body of an embedded document (akn:mainBody). Unlike the act body it holds paragraphs and levels directly,
      without the legislative hierarchy.

      '
    annotations:
      description_de: 'Hauptteil eines beiliegenden Dokuments (akn:mainBody). Anders als der Erlasskörper nimmt er Absätze
        und Ebenen unmittelbar auf, ohne die Gesetzeshierarchie.

        '
      xml_element: akn:mainBody
    slots:
    - content_blocks
    - levels
    - content_ref
    exact_mappings:
    - akn:mainBody
  Container:
    description: A generic container (akn:container) whose @name states its purpose.
    annotations:
      description_de: Ein generischer Behälter (akn:container), dessen @name den Zweck nennt.
      xml_element: akn:container
    slots:
    - container_name
    - blocks
    exact_mappings:
    - akn:container
  Block:
    description: >-
      A generic block (akn:block) whose @name states its purpose; carries mixed content.
    annotations:
      description_de: >-
        Ein generischer Block (akn:block), dessen @name den Zweck nennt; trägt gemischten Inhalt.
      xml_element: akn:block
    slots:
    - block_name
    - inline_content
    exact_mappings:
    - akn:block
  BlockElement:
    abstract: true
    description: 'Abstract base for a block-level element: the paragraphs, lists and tables of the content, and the formula
      and citations of the preamble.

      '
    annotations:
      description_de: 'Abstrakte Basis für ein Element auf Blockebene: die Absätze, Aufzählungen und Tabellen des Inhalts
        sowie Formel und Erwägungen des Vorspruchs.

        '
    slots:
    - element_type
  DocNumber:
    description: The document number in the preface.
    annotations:
      description_de: Die Dokumentnummer im Vorspann.
      xml_element: akn:docNumber
    slots:
    - eId
    - title_attr
    - inline_content
    exact_mappings:
    - akn:docNumber
    is_a: InlineElement
  DocTitle:
    description: The document title in the preface.
    annotations:
      description_de: Der Dokumenttitel im Vorspann.
      xml_element: akn:docTitle
    slots:
    - eId
    - title_attr
    - inline_content
    exact_mappings:
    - akn:docTitle
    is_a: InlineElement
  DocketNumber:
    description: The systematic number of the act, as cantonal collections carry it.
    annotations:
      description_de: Die Ordnungsnummer des Erlasses, wie sie kantonale Sammlungen führen.
      xml_element: akn:docketNumber
    slots:
    - eId
    - title_attr
    - inline_content
    exact_mappings:
    - akn:docketNumber
    is_a: InlineElement
  ShortTitle:
    description: The short title of the act.
    annotations:
      description_de: Der Kurztitel des Erlasses.
      xml_element: akn:shortTitle
    slots:
    - eId
    - title_attr
    - inline_content
    exact_mappings:
    - akn:shortTitle
    is_a: InlineElement
  Abbr:
    description: The abbreviation of the act.
    annotations:
      description_de: Die Abkürzung des Erlasses.
      xml_element: akn:abbr
    slots:
    - eId
    - title_attr
    - inline_content
    exact_mappings:
    - akn:abbr
    is_a: InlineElement
  DocDate:
    description: A date in the preface, with the machine-readable value in @date.
    annotations:
      description_de: Ein Datum im Vorspann, mit dem maschinenlesbaren Wert in @date.
      xml_element: akn:docDate
    slots:
    - eId
    - date_attr
    - title_attr
    - inline_content
    exact_mappings:
    - akn:docDate
    is_a: InlineElement
  DateInline:
    description: A date in running text, with the machine-readable value in @date.
    annotations:
      description_de: Ein Datum im Fliesstext, mit dem maschinenlesbaren Wert in @date.
      xml_element: akn:date
    slots:
    - eId
    - date_attr
    - refers_to
    - inline_content
    exact_mappings:
    - akn:date
    is_a: InlineElement
  Signature:
    description: A signature line.
    annotations:
      description_de: Eine Unterschriftszeile.
      xml_element: akn:signature
    slots:
    - eId
    - inline_content
    exact_mappings:
    - akn:signature
    is_a: InlineElement
  Eol:
    description: An end of line within a paragraph.
    annotations:
      description_de: Ein Zeilenende innerhalb eines Absatzes.
      xml_element: akn:eol
    slots: []
    exact_mappings:
    - akn:eol
    is_a: InlineElement
  Conclusions:
    description: 'The concluding formula of an act: place, date and signatures.'
    annotations:
      description_de: 'Die Schlussformel eines Erlasses: Ort, Datum und Unterschriften.'
      xml_element: akn:conclusions
    slots:
    - eId
    - content_blocks
    exact_mappings:
    - akn:conclusions
  Attachments:
    description: Documents attached to the act.
    annotations:
      description_de: Dem Erlass beigefügte Dokumente.
      xml_element: akn:attachments
    slots:
    - attachment_list
    exact_mappings:
    - akn:attachments
  Attachment:
    description: A single attached document.
    annotations:
      description_de: Ein einzelnes beigefügtes Dokument.
      xml_element: akn:attachment
    slots:
    - act_ref
    exact_mappings:
    - akn:attachment
  Notes:
    description: Notes block of the metadata, holding the notes an act refers to.
    annotations:
      description_de: Anmerkungsblock der Metadaten mit den Anmerkungen, auf die ein Erlass verweist.
      xml_element: akn:notes
    slots:
    - source
    - note_list
    exact_mappings:
    - akn:notes
  Note:
    description: A single note.
    annotations:
      description_de: Eine einzelne Anmerkung.
      xml_element: akn:note
    slots:
    - eId
    - content_blocks
    exact_mappings:
    - akn:note
  TLCConcept:
    description: >-
      A concept referred to by the document (akn:TLCConcept), such as a temporal status.
    annotations:
      description_de: >-
        Ein Begriff, auf den das Dokument verweist (akn:TLCConcept), etwa ein zeitlicher Status.
      xml_element: akn:TLCConcept
    slots:
    - eId
    - href
    - show_as
    exact_mappings:
    - akn:TLCConcept
  OriginalRef:
    description: Reference to the original version of the act (akn:original).
    annotations:
      description_de: Verweis auf die ursprüngliche Fassung des Erlasses (akn:original).
      xml_element: akn:original
    slots:
    - eId
    - href
    - show_as
    exact_mappings:
    - akn:original
  ComponentRef:
    description: Pointer to a document component held elsewhere (akn:componentRef).
    annotations:
      description_de: Verweis auf einen anderswo gehaltenen Dokumentbestandteil (akn:componentRef).
      xml_element: akn:componentRef
    slots:
    - eId
    - src
    - show_as
    exact_mappings:
    - akn:componentRef
  Def:
    description: A term being defined in the text.
    annotations:
      description_de: Ein im Text definierter Begriff.
      xml_element: akn:def
    slots:
    - eId
    - inline_content
    exact_mappings:
    - akn:def
    is_a: InlineElement
  NoteRef:
    description: Reference to a note held in the metadata.
    annotations:
      description_de: Verweis auf eine in den Metadaten gehaltene Anmerkung.
      xml_element: akn:noteRef
    slots:
    - eId
    - href
    - marker
    exact_mappings:
    - akn:noteRef
    is_a: InlineElement
  Role:
    description: A role a person holds, pointing at its declaration.
    annotations:
      description_de: Eine Rolle, die eine Person innehat, mit Verweis auf ihre Deklaration.
      xml_element: akn:role
    slots:
    - eId
    - refers_to
    - inline_content
    exact_mappings:
    - akn:role
    is_a: InlineElement
  Person:
    description: A person, pointing at its declaration and the role held.
    annotations:
      description_de: Eine Person, mit Verweis auf ihre Deklaration und die innegehabte Rolle.
      xml_element: akn:person
    slots:
    - eId
    - refers_to
    - as_attr
    - inline_content
    exact_mappings:
    - akn:person
    is_a: InlineElement
  ActiveRef:
    description: Reference to an act this document modifies.
    annotations:
      description_de: Verweis auf einen Erlass, den dieses Dokument ändert.
      xml_element: akn:activeRef
    slots:
    - eId
    - href
    - show_as
    exact_mappings:
    - akn:activeRef
    is_a: InlineElement
  Formula:
    description: An opening or closing formula of the preamble (akn:formula).
    annotations:
      description_de: Eine Eingangs- oder Schlussformel des Vorspruchs (akn:formula).
      xml_element: akn:formula
    slots:
    - eId
    - name_attr2
    - content_blocks
    exact_mappings:
    - akn:formula
    is_a: BlockElement
  Citations:
    description: The citations of the preamble -- what the act invokes.
    annotations:
      description_de: Die Erwägungen des Vorspruchs — worauf sich der Erlass beruft.
      xml_element: akn:citations
    slots:
    - eId
    - citation_list
    exact_mappings:
    - akn:citations
    is_a: BlockElement
  Citation:
    description: A single citation.
    annotations:
      description_de: Eine einzelne Erwägung.
      xml_element: akn:citation
    slots:
    - eId
    - refers_to
    - content_blocks
    exact_mappings:
    - akn:citation
  ModSource:
    description: The passage that causes the modification.
    annotations:
      description_de: Die Stelle, welche die Änderung bewirkt.
      xml_element: akn:source
    slots:
    - eId
    - href
    - pos
    - up_to
    exact_mappings:
    - akn:source
  ModDestination:
    description: The passage that is modified.
    annotations:
      description_de: Die Stelle, die geändert wird.
      xml_element: akn:destination
    slots:
    - eId
    - href
    - pos
    - up_to
    exact_mappings:
    - akn:destination
  ModOld:
    description: The text as it stood before the modification.
    annotations:
      description_de: Der Text, wie er vor der Änderung lautete.
      xml_element: akn:old
    slots:
    - eId
    - href
    - pos
    - up_to
    exact_mappings:
    - akn:old
  ModNew:
    description: The text as it stands after the modification.
    annotations:
      description_de: Der Text, wie er nach der Änderung lautet.
      xml_element: akn:new
    slots:
    - eId
    - href
    - pos
    - up_to
    exact_mappings:
    - akn:new
  Modification:
    description: Abstract base for a modification recorded in the analysis.
    annotations:
      description_de: Abstrakte Basis für eine im Analyseblock vermerkte Änderung.
      xml_element: akn:mod
    slots:
    - element_type
    exact_mappings:
    - akn:mod
    abstract: true
  TextualMod:
    description: 'A textual modification: the wording of another act is inserted, substituted, repealed, renumbered, split
      or joined.

      '
    annotations:
      description_de: 'Eine Textänderung: der Wortlaut eines anderen Erlasses wird eingefügt, ersetzt, aufgehoben, neu nummeriert,
        geteilt oder zusammengeführt.

        '
      xml_element: akn:textualMod
    slots:
    - eId
    - mod_type
    - period
    - mod_sources
    - mod_destinations
    - mod_old
    - mod_new
    exact_mappings:
    - akn:textualMod
    is_a: Modification
  ForceMod:
    description: 'A modification of legal force: an act, or a part of it, enters into force, ceases, is postponed, prorogued,
      re-enacted or declared unconstitutional.

      '
    annotations:
      description_de: 'Eine Änderung der Rechtskraft: ein Erlass oder ein Teil davon tritt in Kraft, ausser Kraft, wird aufgeschoben,
        verlängert, neu erlassen oder für verfassungswidrig erklärt.

        '
      xml_element: akn:forceMod
    slots:
    - eId
    - mod_type
    - period
    - mod_sources
    - mod_destinations
    exact_mappings:
    - akn:forceMod
    is_a: Modification
  ActiveModifications:
    description: The modifications this act makes to others.
    annotations:
      description_de: Die Änderungen, die dieser Erlass an anderen vornimmt.
      xml_element: akn:activeModifications
    slots:
    - source
    - modifications
    exact_mappings:
    - akn:activeModifications
  PassiveModifications:
    description: The modifications other acts make to this one.
    annotations:
      description_de: Die Änderungen, die andere Erlasse an diesem vornehmen.
      xml_element: akn:passiveModifications
    slots:
    - source
    - modifications
    exact_mappings:
    - akn:passiveModifications
  Analysis:
    description: 'The analysis block: which modifications this act makes and receives. Fedlex does not use it; cantonal collections
      record their amendments here.

      '
    annotations:
      description_de: 'Der Analyseblock: welche Änderungen dieser Erlass vornimmt und erfährt. Fedlex verwendet ihn nicht;
        kantonale Sammlungen halten hier ihre Änderungen fest.

        '
      xml_element: akn:analysis
    slots:
    - source
    - active_modifications
    - passive_modifications
    exact_mappings:
    - akn:analysis
  TemporalData:
    description: 'The temporal groups a modification refers to. Each group holds the interval during which it applies.

      '
    annotations:
      description_de: 'Die Zeitgruppen, auf die sich eine Änderung bezieht. Jede Gruppe hält das Intervall, in dem sie gilt.

        '
      xml_element: akn:temporalData
    slots:
    - source
    - temporal_groups
    exact_mappings:
    - akn:temporalData
  TemporalGroup:
    description: A named period, referred to by a modification through @period.
    annotations:
      description_de: Ein benannter Zeitraum, auf den sich eine Änderung über @period bezieht.
      xml_element: akn:temporalGroup
    slots:
    - eId
    - time_intervals
    exact_mappings:
    - akn:temporalGroup
  TimeInterval:
    description: 'An interval between two dates. Start and end name date elements in the document by anchor rather than carrying
      the date themselves; an empty end means the interval is still open.

      '
    annotations:
      description_de: 'Ein Intervall zwischen zwei Daten. Anfang und Ende benennen Datumselemente im Dokument über einen Anker,
        statt das Datum selbst zu tragen; ein leeres Ende heisst, dass das Intervall offen ist.

        '
      xml_element: akn:timeInterval
    slots:
    - eId
    - refers_to
    - start_ref
    - end_ref
    exact_mappings:
    - akn:timeInterval
slots:
  act_ref:
    description: >-
      The legislative act (akn:act). Must be the only child of akn:akomaNtoso (FLX-RT-001).
    range: Act
    required: true
    annotations:
      description_de: >-
        Der Erlass (akn:act). Muss das einzige Kind von akn:akomaNtoso sein (FLX-RT-001).
      xml_element: akn:act
  act_name:
    description: 'Type of the act (akn:act/@name). The permissible values of ActTypeEnum are those Fedlex uses; cantonal collections
      name their own types, which is why a free string remains admissible.

      '
    annotations:
      description_de: 'Typ des Erlasses (akn:act/@name). Die zulässigen Werte von ActTypeEnum sind die von Fedlex verwendeten;
        kantonale Sammlungen benennen eigene Typen, weshalb eine freie Zeichenkette zulässig bleibt.

        '
      xml_attribute: 'true'
      xml_name: name
    any_of:
    - range: ActTypeEnum
    - range: string
    examples:
    - value: ''
    - value: Grunderlass
    - value: publicLaw
  meta:
    description: Metadata section of the act (akn:meta).
    range: ActMeta
    annotations:
      description_de: Metadaten-Abschnitt des Erlasses (akn:meta).
  preface_ref:
    description: Preface of the act (akn:preface).
    range: Preface
    annotations:
      description_de: Vorspann des Erlasses (akn:preface).
      xml_element: akn:preface
  preface_paragraphs:
    description: The akn:p paragraphs of the preface, wrapping docNumber/docTitle.
    range: PrefaceP
    multivalued: true
    annotations:
      description_de: Die akn:p-Absätze des Vorspanns, die docNumber/docTitle umschliessen.
      xml_element: akn:p
    exact_mappings:
    - akn:p
  preamble_ref:
    description: Preamble of the act (akn:preamble).
    range: Preamble
    annotations:
      description_de: Präambel des Erlasses (akn:preamble).
      xml_element: akn:preamble
  body:
    description: Main body of the act (akn:body).
    range: ActBody
    annotations:
      description_de: Hauptteil des Erlasses (akn:body).
  identification_ref:
    description: FRBR identification block (akn:identification).
    range: Identification
    annotations:
      description_de: FRBR-Identifikationsblock (akn:identification).
      xml_element: akn:identification
  source:
    description: Anchor reference to the responsible organization (@source), e.g. '#ch.bk'.
    range: AnchorRef
    annotations:
      description_de: Anker-Referenz auf die verantwortliche Organisation (@source), z.B. '#ch.bk'.
      xml_attribute: 'true'
  references_ref:
    description: References section of the meta (akn:references).
    range: References
    annotations:
      description_de: Referenzen-Abschnitt der Metadaten (akn:references).
      xml_element: akn:references
  frbr_work:
    description: FRBR Work level description (akn:FRBRWork).
    range: FRBRWork
    annotations:
      description_de: FRBR-Work-Ebenen-Beschreibung (akn:FRBRWork).
  frbr_expression:
    description: FRBR Expression level description (akn:FRBRExpression).
    range: FRBRExpression
    annotations:
      description_de: FRBR-Expression-Ebenen-Beschreibung (akn:FRBRExpression).
  frbr_manifestation:
    description: FRBR Manifestation level description (akn:FRBRManifestation).
    range: FRBRManifestation
    annotations:
      description_de: FRBR-Manifestations-Ebenen-Beschreibung (akn:FRBRManifestation).
  frbr_this:
    description: Canonical ELI URI of this FRBR entity (akn:FRBRthis/@value).
    range: UriValueType
    annotations:
      description_de: Kanonische ELI-URI dieser FRBR-Entität (akn:FRBRthis/@value).
      xml_element: akn:FRBRthis
    exact_mappings:
    - akn:FRBRthis
  frbr_uri:
    description: Base ELI URI of this FRBR entity (akn:FRBRuri/@value).
    range: UriValueType
    annotations:
      description_de: Basis-ELI-URI dieser FRBR-Entität (akn:FRBRuri/@value).
      xml_element: akn:FRBRuri
    exact_mappings:
    - akn:FRBRuri
  frbr_dates:
    description: 'Date entries for this FRBR entity (akn:FRBRdate). Multiple entries for different event types (dateEntryInForce,
      dateDocument, dateApplicability).

      '
    range: FRBRDate
    multivalued: true
    annotations:
      description_de: 'Datumseinträge dieser FRBR-Entität (akn:FRBRdate). Mehrere Einträge für verschiedene Ereignistypen.

        '
  frbr_authors:
    description: Author/rights-holder entries for this FRBR entity (akn:FRBRauthor).
    range: FRBRAuthor
    multivalued: true
    annotations:
      description_de: Autoren-/Rechteinhaber-Einträge dieser FRBR-Entität (akn:FRBRauthor).
    close_mappings:
    - eli:passed_by
  frbr_country:
    description: Country code for this legislative text (akn:FRBRcountry/@value), e.g. 'CH'.
    range: ValueType
    annotations:
      description_de: Ländercode für diesen Erlass (akn:FRBRcountry/@value), z.B. 'CH'.
      xml_element: akn:FRBRcountry
    exact_mappings:
    - akn:FRBRcountry
    close_mappings:
    - eli:jurisdiction
  frbr_number:
    description: SR (Systematische Rechtssammlung) number (akn:FRBRnumber/@value), e.g. '101'.
    range: ValueType
    annotations:
      description_de: SR-Nummer (akn:FRBRnumber/@value), z.B. '101'.
      xml_element: akn:FRBRnumber
    exact_mappings:
    - akn:FRBRnumber
    slot_uri: eli:number
  frbr_names:
    description: >-
      Multilingual name entries for the FRBR Work (akn:FRBRname). One entry per language.
    range: FRBRName
    multivalued: true
    annotations:
      description_de: >-
        Mehrsprachige Namenseinträge des FRBR-Works (akn:FRBRname). Ein Eintrag pro Sprache.
  frbr_authoritative:
    description: Whether this is the authoritative version (akn:FRBRauthoritative/@value).
    range: ValueType
    annotations:
      description_de: Ob dies die massgebliche Version ist (akn:FRBRauthoritative/@value).
      xml_element: akn:FRBRauthoritative
    exact_mappings:
    - akn:FRBRauthoritative
    close_mappings:
    - eli:legal_value
  frbr_language:
    description: Language code of this expression (akn:FRBRlanguage/@language).
    range: LanguageType
    annotations:
      description_de: Sprachcode dieser Expression (akn:FRBRlanguage/@language).
      xml_element: akn:FRBRlanguage
    exact_mappings:
    - akn:FRBRlanguage
    slot_uri: eli:language
  frbr_format:
    description: File format of this manifestation (akn:FRBRformat/@value), typically 'xml'.
    range: FormatType
    annotations:
      description_de: Dateiformat dieser Manifestation (akn:FRBRformat/@value), typischerweise 'xml'.
      xml_element: akn:FRBRformat
    exact_mappings:
    - akn:FRBRformat
    slot_uri: eli:format
  frbr_date_name:
    description: 'Type of this date (akn:FRBRdate/@name). Fedlex uses the JoLux vocabulary; the permissible values of FrbrDateNameEnum
      carry the corresponding ELI property. Cantonal publishers use their own designations, which is why a free string remains
      admissible.

      '
    annotations:
      description_de: 'Art dieses Datums (akn:FRBRdate/@name). Fedlex verwendet das JoLux-Vokabular; die zulässigen Werte
        von FrbrDateNameEnum tragen die entsprechende ELI-Eigenschaft. Kantonale Publikationsstellen führen eigene Bezeichnungen,
        weshalb eine freie Zeichenkette zulässig bleibt.

        '
      xml_attribute: 'true'
      xml_name: name
    any_of:
    - range: FrbrDateNameEnum
    - range: string
    examples:
    - value: ''
    - value: jolux:dateApplicability
    - value: jolux:dateDocument
  fedlex_generator:
    description: 'Fedlex extension attribute fedlex:generator on akn:FRBRformat[@value=''xml'']. Identifies the tool that
      generated the XML file. Only allowed on FRBRformat (FLX-XF-002).

      '
    range: string
    annotations:
      description_de: 'Fedlex-Erweiterungsattribut fedlex:generator bei akn:FRBRformat[@value=''xml'']. Identifiziert das
        Werkzeug, das die XML-Datei erzeugt hat. Nur bei FRBRformat erlaubt (FLX-XF-002).

        '
      xml_attribute: 'true'
      xml_name: fedlex:generator
      xml_namespace: http://fedlex.admin.ch/
      schematron_rule: 'FLX-XF-002: generator only allowed on FRBRformat[@value=''xml'']'
  date_value:
    description: An ISO 8601 date value (akn:FRBRdate/@date).
    range: date
    annotations:
