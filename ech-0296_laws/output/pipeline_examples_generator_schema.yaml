      description_de: 'Fedlex-Erweiterungsattribut fedlex:role. FLX-XF-003 lässt ''marginal'' (nur an akn:level, FLX-XF-004)
        und ''reference'' (nur an akn:subheading, FLX-XF-005) zu; die publizierte Bundesverfassung führt zusätzlich ''heading''
        an einem Präambel-Absatz.

        '
      xml_attribute: 'true'
      xml_name: fedlex:role
      xml_namespace: http://fedlex.admin.ch/
      schematron_rules: FLX-XF-003, FLX-XF-004, FLX-XF-005
