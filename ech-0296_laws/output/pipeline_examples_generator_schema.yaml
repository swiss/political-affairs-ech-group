  num:
    description: 'Number element for a hierarchical structure or article (akn:num). In articles, num is mandatory (FLX-ART-001).
      The num element must precede heading and subheading (FLX-HD-001, FLX-HD-002, FLX-HD-003).

      '
    range: MixedText
    annotations:
      description_de: 'Nummerierungselement für ein Strukturelement oder einen Artikel (akn:num). Bei Artikeln obligatorisch
        (FLX-ART-001). num muss vor heading und subheading stehen (FLX-HD-001, FLX-HD-002, FLX-HD-003).

        '
      xml_element: akn:num
      schematron_rules: >-
        FLX-HD-001: max one num; FLX-HD-002: num before heading; FLX-HD-003: num before subheading
    exact_mappings:
    - akn:num
  heading:
    description: 'Heading element for a hierarchical structure (akn:heading). May contain inline markup including akn:br (FLX-TXT-001:
      br permitted in heading context). Must precede subheading (FLX-HD-004, FLX-HD-005).

      '
    range: MixedText
    annotations:
      description_de: 'Überschrift für ein Strukturelement (akn:heading). Kann Inline-Markup einschliesslich akn:br enthalten
        (FLX-TXT-001: br in Überschriften erlaubt). Muss vor subheading stehen (FLX-HD-004, FLX-HD-005).

        '
      xml_element: akn:heading
      schematron_rules: 'FLX-HD-004: max one heading; FLX-HD-005: heading before subheading; FLX-TXT-001: br permitted here

        '
    exact_mappings:
    - akn:heading
  subheading:
    description: 'Subheading element for a hierarchical structure (akn:subheading). The fedlex:role=''reference'' attribute
      marks it as a reference heading (FLX-XF-005). Max one subheading per element (FLX-HD-006).

      '
    range: MixedText
    annotations:
      description_de: 'Unterüberschrift für ein Strukturelement (akn:subheading). fedlex:role=''reference'' kennzeichnet es
        als Referenzüberschrift (FLX-XF-005). Maximal eine subheading pro Element (FLX-HD-006).

        '
      xml_element: akn:subheading
      schematron_rules: 'FLX-HD-006: max one subheading; FLX-XF-005: fedlex:role=''reference'' only allowed on subheading

        '
    exact_mappings:
    - akn:subheading
  fedlex_role:
    description: 'Fedlex extension attribute fedlex:role. FLX-XF-003 permits ''marginal'' (only on akn:level, FLX-XF-004)
      and ''reference'' (only on akn:subheading, FLX-XF-005); the published Federal Constitution additionally carries ''heading''
      on a preamble paragraph.

      '
