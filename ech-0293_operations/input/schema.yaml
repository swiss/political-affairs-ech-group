enums:

  StateEnum:
    description: |
      State of the meeting.
    annotations:
      description_de: |
        Status der Sitzung.
      description_fr: |
        État de la séance.
    permissible_values:
      "planned":
        meaning: ops:enum/state/planned
        description: |
          The meeting is planned and will take place as scheduled.
        annotations:
          description_de: |
            Die Sitzung ist geplant und findet wie vorgesehen statt.
          description_fr: |
            La séance est planifiée et se tiendra comme prévu.
      "canceled":
        meaning: ops:enum/state/canceled
        description: |
          The meeting has been cancelled.
        annotations:
          description_de: |
            Die Sitzung wurde abgesagt.
          description_fr: |
            La séance a été annulée.
      "postponed":
        meaning: ops:enum/state/postponed
        description: |
          The meeting has been postponed.
        annotations:
          description_de: |
            Die Sitzung wurde verschoben.
          description_fr: |
            La séance a été reportée.


  MajorityTypeEnum:
    description: |
      Type of majority required for the vote.
    annotations:
      description_de: |
        Art der für die Abstimmung erforderlichen Mehrheit.
      description_fr: |
        Type de majorité requise pour le vote.
    permissible_values:
      "absolute":
        meaning: ops:enum/majority_type/absolute
        description: |
          Absolute majority: more than half of the reference base (members or votes cast, depending on the applicable rules), e.g. at least 101 of 200. Standard case for elections of persons such as the election of the Federal Council or of committee chairs, and required for constitutional amendments in some cantons. If nobody reaches it in the first ballot of an election, a second ballot usually follows in which the relative majority suffices.
        annotations:
          description_de: |
            Absolutes Mehr: mehr als die Hälfte der Bezugsgrösse (Mitglieder oder abgegebene Stimmen, je nach massgebender Regelung), z.B. mindestens 101 von 200. Standardfall bei Personenwahlen wie der Wahl des Bundesrats oder der Kommissionspräsidien und in einigen Kantonen für Verfassungsänderungen erforderlich. Erreicht bei einer Wahl im ersten Wahlgang niemand das absolute Mehr, folgt meist ein zweiter Wahlgang, in dem das relative Mehr genügt.
          description_fr: |
            Majorité absolue : plus de la moitié de la base de référence (membres ou voix exprimées, selon la réglementation applicable), p. ex. au moins 101 sur 200. Cas standard pour les élections de personnes telles que l'élection du Conseil fédéral ou des présidences de commission, et requise dans certains cantons pour les modifications constitutionnelles. Si personne ne l'atteint au premier tour d'une élection, un second tour suit généralement, où la majorité relative suffit.
      "two_thirds":
        meaning: ops:enum/majority_type/two_thirds
        description: |
          Two-thirds majority, e.g. at least 134 of 200; required in some cantons for constitutional amendments.
        annotations:
          description_de: |
            Zweidrittelmehrheit, z.B. mindestens 134 von 200; in einigen Kantonen für Verfassungsänderungen erforderlich.
          description_fr: |
            Majorité des deux tiers, p. ex. au moins 134 sur 200 ; requise dans certains cantons pour les modifications constitutionnelles.
      "other":
        meaning: ops:enum/majority_type/other
        description: |
          Other majority threshold not covered by the standard categories, e.g. the relative majority among several options in a multiple-choice voting.
        annotations:
          description_de: |
            Anderes Mehrheitserfordernis, das nicht von den Standardkategorien abgedeckt ist, z.B. das relative Mehr unter mehreren Optionen einer Auswahlabstimmung.
          description_fr: |
            Autre seuil de majorité non couvert par les catégories standard, p. ex. la majorité relative entre plusieurs options d'un vote à choix multiple.

  ResolutionTypeEnum:
    description: |
      Type of resolution taken on an agenda item.
    annotations:
      description_de: |
        Art der Resolution zu einem Traktandum.
      description_fr: |
        Type de décision prise sur un point de l'ordre du jour.
    permissible_values:
      "accepted":
        meaning: ops:enum/resolution_type/accepted
        description: |
          Accepted (Annahme): e.g. a bill adopted, a motion approved, a decision taken.
        annotations:
          description_de: |
            Annahme: z.B. eine Gesetzesvorlage angenommen, ein Antrag gutgeheissen, ein Beschluss gefasst.
          description_fr: |
            Adoption : p. ex. un projet de loi adopté, une proposition approuvée, une décision prise.
      "rejected":
        meaning: ops:enum/resolution_type/rejected
        description: |
          Rejected (Ablehnung): e.g. a bill rejected, a motion dismissed.
        annotations:
          description_de: |
            Ablehnung: z.B. eine Gesetzesvorlage abgelehnt, ein Antrag abgewiesen.
          description_fr: |
            Rejet : p. ex. un projet de loi rejeté, une proposition repoussée.
      "noted":
        meaning: ops:enum/resolution_type/noted
        description: |
          Noted (Kenntnisnahme): e.g. reports without a vote, communications, informative agenda items.
        annotations:
          description_de: |
            Kenntnisnahme: z.B. Berichte ohne Abstimmung, Mitteilungen, informative Traktanden.
          description_fr: |
            Prise d'acte : p. ex. rapports sans vote, communications, points informatifs.
      "accepted_point_by_point":
        meaning: ops:enum/resolution_type/accepted_point_by_point
        description: |
          Accepted point by point (Punktweise Annahme)
        annotations:
          description_de: |
            Punktweise Annahme
          description_fr: |
            Acceptation point par point
      "accepted_with_postulate":
        meaning: ops:enum/resolution_type/accepted_with_postulate
        description: |
          Accepted with postulate (Annahme mit Postulat)
        annotations:
          description_de: |
            Annahme mit Postulat
          description_fr: |
            Acceptation avec postulat
      "orally_settled":
        meaning: ops:enum/resolution_type/orally_settled
        description: |
          Orally settled (Mündlich erledigt)
        annotations:
          description_de: |
            Mündlich erledigt
          description_fr: |
            Liquidé oralement
      "nearly_unanimous":
        meaning: ops:enum/resolution_type/nearly_unanimous
        description: |
          Nearly unanimous (Beinahe einstimmig)
        annotations:
          description_de: |
            Beinahe einstimmig
          description_fr: |
            Quasi unanime
      "other":
        meaning: ops:enum/resolution_type/other
        description: |
          Other resolution type not covered by standard categories
        annotations:
          description_de: |
            Andere Resolution, nicht durch Standardkategorien abgedeckt
          description_fr: |
            Autre type de décision, non couvert par les catégories standard

  VotingTypeEnum:
    description: |
      Type of voting procedure.
    annotations:
      description_de: |
        Art des Abstimmungsverfahrens.
      description_fr: |
        Type de procédure de vote.
    permissible_values:
      "preliminary_vote":
        meaning: ops:enum/voting_type/preliminary_vote
        description: |
          Preliminary vote (Zwischenabstimmung) during the deliberation, e.g. on entering into an affair, on a motion, opposing two motions that exclude each other or refer to the same passage, a contingent vote (Eventualabstimmung) when more than two motions exist on one subject, on a single article of a law, or the overall vote after the first reading of an act deliberated in two readings.
        annotations:
          description_de: |
            Zwischenabstimmung während der Beratung, z.B. über Eintreten auf ein Geschäft, über einen Antrag, Gegenüberstellung zweier Anträge, die sich gegenseitig ausschliessen oder sich auf denselben Textabschnitt beziehen, Eventualabstimmung, wenn zu einem Abstimmungsgegenstand mehr als zwei Anträge vorliegen, über einen einzelnen Artikel eines Gesetzes oder Gesamtabstimmung nach der ersten Lesung eines Erlasses, der in zwei Lesungen beraten wird.
          description_fr: |
            Vote intermédiaire au cours de la délibération, p. ex. sur l'entrée en matière, sur une proposition, opposition de deux propositions qui s'excluent mutuellement ou portent sur le même passage, vote éventuel lorsque plus de deux propositions portent sur un même objet, sur un article isolé d'une loi, ou vote sur l'ensemble après la première lecture d'un acte délibéré en deux lectures.
      "final_vote":
        meaning: ops:enum/voting_type/final_vote
        description: |
          Final vote (Schlussabstimmung) on the proposal as a whole, e.g. after the last reading of an act, the overall vote on a decree, the adoption or rejection of a proposal in its entirety, or the point-by-point vote on a parliamentary proposal.
        annotations:
          description_de: |
            Schlussabstimmung über die Vorlage als Ganzes, z.B. nach der letzten Lesung eines Erlasses, Gesamtabstimmung über einen Beschluss, Annahme oder Ablehnung einer Vorlage in ihrer Gesamtheit oder punktweise Abstimmung über einen Vorstoss.
          description_fr: |
            Vote final sur l'objet dans son ensemble, p. ex. après la dernière lecture d'un acte, vote sur l'ensemble d'un arrêté, adoption ou rejet d'un objet dans sa totalité, ou vote point par point sur une intervention parlementaire.
      "tie_breaker_president":
        meaning: ops:enum/voting_type/tie_breaker_president
        description: |
          Casting vote of the presiding member in case of a tie (Stichentscheid Präsidium). The presiding member does not take part in votings but decides in case of a tie. In a secret vote ending in a tie, the proposal of the preparatory body is deemed accepted instead.
        annotations:
          description_de: |
            Stichentscheid der Präsidentin oder des Präsidenten bei Stimmengleichheit. Die Präsidentin oder der Präsident nimmt an Abstimmungen nicht teil, entscheidet aber bei Stimmengleichheit. Endet eine geheime Abstimmung mit Stimmengleichheit, gilt stattdessen der Antrag des vorberatenden Ratsorgans als angenommen.
          description_fr: |
            Voix prépondérante de la présidente ou du président en cas d'égalité des voix. La présidente ou le président ne participe pas aux votes, mais tranche en cas d'égalité. Si un vote secret aboutit à une égalité, c'est la proposition de l'organe préparatoire qui est réputée adoptée.
      "secret_vote":
        meaning: ops:enum/voting_type/secret_vote
        description: |
          Secret ballot (Geheime Abstimmung), e.g. on particularly sensitive matters such as a request for pardon or the lifting of immunity, after a secret deliberation, or on request. Only the overall result is published.
        annotations:
          description_de: |
            Geheime Abstimmung, z.B. über besonders heikle Sachgeschäfte wie ein Gnadengesuch oder die Aufhebung der Immunität, nach geheimer Beratung oder auf Antrag. Publiziert wird nur das Gesamtergebnis.
          description_fr: |
            Vote secret, p. ex. sur des objets particulièrement sensibles tels qu'un recours en grâce ou la levée de l'immunité, après une délibération secrète ou sur demande. Seul le résultat global est publié.
      "other":
        meaning: ops:enum/voting_type/other
        description: |
          Other voting type, specified in type_label — e.g. a multiple-choice voting on several proposals pointing in the same direction (see TotalOther).
        annotations:
          description_de: |
            Anderer Abstimmungstyp, näher bezeichnet in type_label — z.B. eine Auswahlabstimmung über mehrere gleichgerichtete Anträge (siehe TotalOther).
          description_fr: |
            Autre type de vote, précisé dans type_label — p. ex. un vote à choix multiple sur plusieurs propositions de même sens (voir TotalOther).

  IndividualVoteTypeEnum:
    description: |
      Type of individual vote cast by a member.
    annotations:
      description_de: |
        Art der Einzelstimme eines Mitglieds.
      description_fr: |
        Type de voix individuelle exprimée par un membre.
    permissible_values:
      "yes":
        meaning: ops:enum/individual_vote_type/yes
        description: |
          Yes vote: the member approves the proposal or motion.
        annotations:
          description_de: |
            Ja-Stimme: Das Mitglied stimmt der Vorlage oder dem Antrag zu.
          description_fr: |
            Oui : le membre approuve l'objet ou la proposition.
      "no":
        meaning: ops:enum/individual_vote_type/no
        description: |
          No vote: the member rejects the proposal or motion.
        annotations:
          description_de: |
            Nein-Stimme: Das Mitglied lehnt die Vorlage oder den Antrag ab.
          description_fr: |
            Non : le membre rejette l'objet ou la proposition.
      "abstention":
        meaning: ops:enum/individual_vote_type/abstention
        description: |
          Abstention: the member takes part in the voting but abstains; with electronic voting, by pressing the "abstention" button.
        annotations:
          description_de: |
            Enthaltung: Das Mitglied nimmt an der Abstimmung teil, enthält sich aber der Stimme; bei elektronischer Stimmabgabe drückt es den Knopf „Enthaltung“.
          description_fr: |
            Abstention : le membre participe au vote mais s'abstient ; en cas de vote électronique, il presse le bouton « abstention ».
      "not_voted":
        meaning: ops:enum/individual_vote_type/not_voted
        description: |
          Not voted: the member did not cast a vote, for instance because they were present but did not vote or were absent.
        annotations:
          description_de: |
            Nicht gestimmt: Das Mitglied hat keine Stimme abgegeben, etwa weil es anwesend war, aber nicht gestimmt hat, oder abwesend war.
          description_fr: |
            N'a pas voté : le membre n'a pas exprimé de voix, par exemple parce qu'il était présent sans voter ou absent.
      "tie_breaker":
        meaning: ops:enum/individual_vote_type/tie_breaker
        description: |
          Tie-breaking vote, cast by the presiding member in case of a tie (see voting_type tie_breaker_president).
        annotations:
          description_de: |
            Stichentscheid, den die Präsidentin oder der Präsident bei Stimmengleichheit fällt (siehe voting_type tie_breaker_president).
          description_fr: |
            Voix prépondérante, exprimée par la présidente ou le président en cas d'égalité des voix (voir voting_type tie_breaker_president).
      "other":
        meaning: ops:enum/individual_vote_type/other
        description: |
          Vote that cannot be placed on the yes/no axis — for instance in a multiple-choice voting, where the member voted but neither yes nor no; the chosen option is held in type_label (e.g. "Auswahl A"). Counterpart of total_other on the voting, which keeps the individual vote evaluable without a separate enumeration value for every cantonal selection mechanism.
        annotations:
          description_de: |
            Stimme, die sich nicht auf die Ja/Nein-Achse bringen lässt — etwa bei einer Auswahlabstimmung, bei der das Mitglied gestimmt hat, aber weder Ja noch Nein; welche Option es gewählt hat, hält type_label fest (z.B. „Auswahl A“). Gegenstück zu total_other auf der Abstimmung; so bleibt die Einzelstimme auswertbar, ohne dass jede kantonale Auswahlmechanik einen eigenen Enum-Wert braucht.
          description_fr: |
            Voix qui ne peut être placée sur l'axe oui/non — par exemple lors d'un vote à choix multiple, où le membre a voté, mais ni oui ni non ; l'option choisie est retenue dans type_label (p. ex. « Choix A »). Pendant de total_other sur le vote ; la voix individuelle reste ainsi exploitable sans qu'il faille une valeur d'énumération propre pour chaque mécanisme de choix cantonal.

  AgendaItemTypeEnum:
    description: |
      Type of agenda item, distinguishing individual items from grouped items.
    annotations:
      description_de: |
        Art des Traktandums, unterscheidet einzelne von gruppierten Traktanden.
      description_fr: |
        Type de point de l'ordre du jour, distinguant les points isolés des points regroupés.
    permissible_values:
      "item":
        meaning: ops:enum/agenda_item_type/item
        description: |
          Individual agenda item (Traktandum) with deliberation and, where applicable, a vote.
        annotations:
          description_de: |
            Einzelnes Traktandum mit Beratung und gegebenenfalls Abstimmung.
          description_fr: |
            Point individuel de l'ordre du jour, avec délibération et, le cas échéant, vote.
      "group":
        meaning: ops:enum/agenda_item_type/group
        description: |
          Group of agenda items (Traktandengruppe) under which sub-items are arranged via parent_agenda_item, e.g. "Gesetzesberatungen".
        annotations:
          description_de: |
            Gruppe von Traktanden (Traktandengruppe), unter der Untertraktanden über parent_agenda_item eingeordnet werden, z.B. „Gesetzesberatungen“.
          description_fr: |
            Groupe de points (groupe de points de l'ordre du jour) sous lequel des sous-points sont rangés au moyen de parent_agenda_item, p. ex. « Délibérations législatives ».

  ElectionTypeEnum:
    description: |
      Type of election procedure.
    annotations:
      description_de: |
        Art des Wahlverfahrens.
      description_fr: |
        Type de procédure d'élection.
    permissible_values:
      "secret":
        meaning: ops:enum/election_type/secret
        description: |
          Secret election (Geheime Wahl): votes are cast anonymously, by ballot paper or an electronic secret system, so it cannot be traced who elected whom. Standard for elections of persons and often required by law — at federal level e.g. the Federal Council (elected by the United Federal Assembly with an absolute majority in the first ballots), federal judges and committee chairs; at cantonal level e.g. the president of parliament, the president of the government, the presidents of the highest courts, judges, the state chancellor and committee chairs. Only the overall result is published, no individual votes.
        annotations:
          description_de: |
            Geheime Wahl: Die Stimmen werden anonym abgegeben, mit Wahlzettel oder elektronischem Geheimwahlsystem, sodass nicht nachvollziehbar ist, wer wen gewählt hat. Standard bei Personenwahlen und oft gesetzlich vorgeschrieben — auf Bundesebene z.B. Bundesrat (durch die Vereinigte Bundesversammlung, in den ersten Wahlgängen mit absolutem Mehr), Bundesrichterinnen und Bundesrichter sowie Kommissionspräsidien; auf Kantonsebene z.B. Parlamentspräsidentin oder Parlamentspräsident, Regierungspräsidentin oder Regierungspräsident, Präsidentinnen und Präsidenten der obersten Gerichte, Richterinnen und Richter, Staatsschreiberin oder Staatsschreiber sowie Kommissionspräsidien. Publiziert wird nur das Gesamtergebnis, keine Einzelstimmen.
          description_fr: |
            Élection secrète : les voix sont exprimées anonymement, au moyen d'un bulletin ou d'un système électronique de vote secret, de sorte qu'on ne peut savoir qui a élu qui. Standard pour les élections de personnes et souvent prescrite par la loi — au niveau fédéral p. ex. le Conseil fédéral (par l'Assemblée fédérale Chambres réunies, à la majorité absolue lors des premiers tours), les juges fédérales et juges fédéraux et les présidences de commission ; au niveau cantonal p. ex. la présidence du parlement, la présidence du gouvernement, les présidences des tribunaux suprêmes, les juges, la chancelière ou le chancelier d'État et les présidences de commission. Seul le résultat global est publié, sans voix individuelles.
      "open":
        meaning: ops:enum/election_type/open
        description: |
          Open election (Offene Wahl): votes are cast openly and it is traceable who elected whom, so individual votes can be recorded. Used where transparency is desired, for uncontested elections or in smaller bodies.
        annotations:
          description_de: |
            Offene Wahl: Die Stimmen werden offen abgegeben, und es ist nachvollziehbar, wer wen gewählt hat; Einzelstimmen können daher erfasst werden. Üblich, wo Transparenz gewünscht ist, bei unumstrittenen Wahlen oder in kleineren Gremien.
          description_fr: |
            Élection ouverte : les voix sont exprimées ouvertement et l'on peut savoir qui a élu qui ; les voix individuelles peuvent donc être saisies. Usuelle lorsque la transparence est souhaitée, pour les élections non disputées ou dans les organes de petite taille.
      "silent":
        meaning: ops:enum/election_type/silent
        description: |
          Silent election (Stille Wahl) without formal vote, by acclamation or consensus; possible only when no objection is raised, e.g. the re-election of a committee chair without a rival candidate.
        annotations:
          description_de: |
            Stille Wahl ohne formale Abstimmung, durch Akklamation oder Konsens; nur möglich, wenn keine Gegenstimmen erhoben werden, z.B. die Wiederwahl einer Kommissionspräsidentin oder eines Kommissionspräsidenten ohne Gegenkandidatur.
          description_fr: |
            Élection tacite sans vote formel, par acclamation ou consensus ; possible uniquement si aucune opposition n'est formulée, p. ex. la réélection d'une présidente ou d'un président de commission sans candidature concurrente.

