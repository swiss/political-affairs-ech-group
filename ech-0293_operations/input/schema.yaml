#
# Syntaktisch korrekte Version
# bitte in schema_working.yaml arbeiten!
#
# Mehrsprachigkeit: Englisch in `description:`, Deutsch in
# `annotations.description_de:`, Franzoesisch in `annotations.description_fr:`.
# Alle drei Sprachen sind synchron zu halten -- localize_schema.py erzeugt
# daraus die sprachspezifischen Schemata fuer gen-doc.
#

id: https://ch.paf.link/schema/operations
name: operations
description: |
  Meeting Schema for various legislative bodies
annotations:
  description_de: |
    Sitzungs-Schema für verschiedene gesetzgebende Körperschaften
  description_fr: |
    Schéma des séances pour différents corps législatifs
prefixes:
  linkml: https://w3id.org/linkml/
  ops: https://ch.paf.link/schema/operations/
  dcterms: http://purl.org/dc/terms/
  # Cross-references to instance data of the sibling eCH standards.
  actors: https://ld.ech.ch/schema/0294/actors/
  affairs: https://ld.ech.ch/schema/0295/affairs/
  parl: https://ld.ech.ch/schema/0293/operations/
imports:
  - linkml:types
  - ../../ech-0292_meta/input/schema_common
  - ../../ech-0292_meta/input/schema
default_prefix: ops
default_range: string

classes:

  Container:
    tree_root: true
    description: |
      Container for the records of public council operations: legislatures, sessions, meetings, agenda items, protocols, votings, elections, attendances, speeches and resolutions.
    annotations:
      description_de: |
        Container für die Daten des öffentlichen Ratsbetriebs: Legislaturperioden, Sessionen, Sitzungen, Traktanden, Protokolle, Abstimmungen, Wahlen, Anwesenheiten, Wortmeldungen und Resolutionen.
      description_fr: |
        Conteneur pour les données de l'activité publique des conseils : législatures, sessions, séances, points de l'ordre du jour, procès-verbaux, votes, élections, présences, interventions et décisions.
    mixins:
      - HasIdentification
    slots:
      - legislatures
      - sessions
        # ist_schon_erfasst
      - meetings
      - agenda_items
      - protocols
      - votings
      - elections
      - individual_votes
      - attendances
      - individual_attendances
      - speeches
      - resolutions

  Legislature:
    description: |
      Term of office of a parliament as a legislative assembly. Usually lasts four years.
    annotations:
      description_de: |
        Amtsdauer eines Parlaments als gesetzgebender Versammlung. Dauert in der Regel vier Jahre.
      description_fr: |
        Durée du mandat d'un parlement en tant qu'assemblée législative. Elle est en règle générale de quatre ans.
    mixins:
      - HasIdentification
      - IsEventWithDuration
      - HasCreationModificationDates
    slots:
      - administrative_id
      - name
      - description
      - landing_page
      - actor_id
      - documents
    slot_usage:
      actor_id:
        range: GroupReference
        inlined: true
        description: |
          Reference to the acting body/organ (lightweight snapshot at time of linking).
        annotations:
          description_de: |
            Referenz auf das handelnde Organ/Gremium (leichtgewichtiger Snapshot zum Zeitpunkt der Verknüpfung).
          description_fr: |
            Référence à l'organe agissant (instantané allégé au moment de la mise en relation).

  Session:
    description: |
      A parliamentary session that groups multiple meetings and spans a specific time period.
    annotations:
      description_de: |
        Eine Parlamentssession, die mehrere Sitzungen gruppiert und sich über einen bestimmten Zeitraum erstreckt.
      description_fr: |
        Une session parlementaire qui regroupe plusieurs séances et s'étend sur une période déterminée.
    mixins:
      - HasIdentification
      - IsEventWithDuration
      - HasCreationModificationDates
    slots:
      - body_key
      - name
      - number
      - sequential_number
      - position
      - meeting_abbreviation
      - url
      - parent_legislature
      - meetings
      - documents

  Meeting:
    description: |
      A general meeting class used for Sessions, Comittee Meetings, individual session Sittings and other various Meetings.
    annotations:
      description_de: |
        Eine allgemeine Sitzungsklasse, die für Sessionen, Kommissionssitzungen, Sessionssitzung und andere verschiedene Versammlungen verwendet wird.
      description_fr: |
        Une classe générale de séance utilisée pour les sessions, les séances de commission, les séances individuelles d'une session et d'autres réunions diverses.
    mixins:
      - HasIdentification
      - IsEventWithDuration
      - HasCreationModificationDates
    slots:
      - body_key
      - meeting_type
      - administrative_id
      - name
      - url
      - group_name
      - group_id
      - number
      - landing_page
      - sequential_number
      - position
      - meeting_abbreviation
      - actor_name
      - actor_id
      - state
      - state_name
      - description
      - location
      - parent_meeting
      - parent_legislature
      - documents
      - protocol_ref
    slot_usage:
      actor_id:
        range: GroupReference
        inlined: true
        description: |
          Reference to the acting body/organ (lightweight snapshot at time of linking).
        annotations:
          description_de: |
            Referenz auf das handelnde Organ/Gremium (leichtgewichtiger Snapshot zum Zeitpunkt der Verknüpfung).
          description_fr: |
            Référence à l'organe agissant (instantané allégé au moment de la mise en relation).

  AgendaItem:
    description: |
      An agenda item of a meeting.
    annotations:
      description_de: |
        Ein Traktandum einer Sitzung.
      description_fr: |
        Un point de l'ordre du jour d'une séance.
    mixins:
      - HasIdentification
      - IsEventWithDuration
      - HasCreationModificationDates
    slots:
      - parent_meeting
      - agenda_item_type
      - agenda_item_number
      - agenda_item_position
      - leading_actor_id
      - speaking_actor_id
      - agenda_item_title
      - affair_id
      - agenda_item_description
      - state_id
      - state_name
      - landing_page
      - url
      - agenda_item_category
      - parent_agenda_item
      - has_resolution
      - documents

  Protocol:
    description: |
      The minutes of a meeting, recorded after the meeting. A wrapper container bundling the actually handled agenda items (protocol_items), votings, speeches, verbatim text segments and linked documents.
    annotations:
      description_de: |
        Das nach der Sitzung erstellte Protokoll. Ein Wrapper-Container, der die tatsächlich behandelten Traktanden (protocol_items), Abstimmungen, Wortmeldungen, Wortlaut-Textsegmente und verknüpfte Dokumente bündelt.
      description_fr: |
        Le procès-verbal établi après la séance. Un conteneur qui regroupe les points effectivement traités (protocol_items), les votes, les interventions, les segments de texte in extenso et les documents liés.
    mixins:
      - HasIdentification
      - HasCreationModificationDates
    slots:
      - parent_meeting
      - protocol_items
      - votings
      - speeches
      - text_segments
      - documents

  ProtocolItem:
    is_a: AgendaItem
    description: |
      An agenda item as actually recorded in the protocol.
    annotations:
      description_de: |
        Ein Traktandum, wie es im Protokoll tatsächlich festgehalten wurde.
      description_fr: |
        Un point de l'ordre du jour tel qu'il a effectivement été consigné au procès-verbal.

  JointDebate:
    description: |
      Agenda Items which are debated together.
    annotations:
      description_de: |
        Traktanden die gemeinsam behandelt werden.
      description_fr: |
        Points de l'ordre du jour traités conjointement.
    slots:
      - agenda_items

  Resolution:
    description: |
      A resolution or decision taken on an agenda item, including voting procedures.
    annotations:
      description_de: |
        Eine Resolution oder Entscheidung zu einem Traktandum, einschliesslich Abstimmungsverfahren.
      description_fr: |
        Une décision prise sur un point de l'ordre du jour, y compris les procédures de vote.
    slots:
      - resolution_type
      - type_label
      - vote_procedures
      - documents

  Voting: # Abstimmung
    description: |
      A voting procedure with individual votes and results.
    annotations:
      description_de: |
        Ein Abstimmungsverfahren mit Einzelstimmen und Ergebnissen.
      description_fr: |
        Une procédure de vote avec les voix individuelles et les résultats.
    mixins:
      - HasIdentification
      - HasCreationModificationDates
    slots:
      - datetime_begin
      - datetime_end
      - voting_type
      - type_label
      - voting_title
      - optional
      - landing_page
      - label_yes
      - label_no
      - label_abstention
      - tie_breaker
      - total_count_yes
      - total_count_no
      - total_count_abstention
      - total_other
      - total_absent
      - total
      - majority_type
      - majority_count
      - result_text
      - parent_meeting
      - parent_agenda_item
      - affair_id
      - actor_id
      - documents
    slot_usage:
      actor_id:
        range: GroupReference
        inlined: true
        description: |
          Reference to the acting body/organ (lightweight snapshot at time of linking).
        annotations:
          description_de: |
            Referenz auf das handelnde Organ/Gremium (leichtgewichtiger Snapshot zum Zeitpunkt der Verknüpfung).
          description_fr: |
            Référence à l'organe agissant (instantané allégé au moment de la mise en relation).

# Handling Präsidiums-Votum wird als eigenes voting aufgenommen


  IndividualVote: # Einzelstimme  / vote individuel
    description: |
      An individual vote cast by a member during a voting procedure.
    annotations:
      description_de: |
        Eine Einzelstimme eines Mitglieds während eines Abstimmungsverfahrens.
      description_fr: |
        Une voix individuelle exprimée par un membre lors d'une procédure de vote.
    mixins:
      - HasIdentification
      - HasCreationModificationDates
    slots:
      - parent_voting
      - actor_id
      - seat_nr
      - weight
      - individual_vote_type
      - type_label

  Election: # Wahl
    description: |
      An election procedure for selecting persons to positions.
    annotations:
      description_de: |
        Ein Wahlverfahren zur Wahl von Personen in Positionen.
      description_fr: |
        Une procédure d'élection visant à pourvoir des fonctions par des personnes.
    mixins:
      - HasIdentification
      - HasCreationModificationDates
    slots:
      - datetime_begin
      - datetime_end
      - election_type
      - type_label
      - title
      - landing_page
      - total_absent
      - total
      - majority_type
      - majority_count
      - result_text
      - parent_meeting
      - parent_agenda_item
      - affair_id
      - actor_id
      - documents
    slot_usage:
      actor_id:
        range: GroupReference
        inlined: true
        description: |
          Reference to the acting body/organ (lightweight snapshot at time of linking).
        annotations:
          description_de: |
            Referenz auf das handelnde Organ/Gremium (leichtgewichtiger Snapshot zum Zeitpunkt der Verknüpfung).
          description_fr: |
            Référence à l'organe agissant (instantané allégé au moment de la mise en relation).

  Attendance:
    description: |
      Aggregated attendance record for a meeting (number of members present, absent, excused).
    annotations:
      description_de: |
        Aggregierte Anwesenheitsliste für eine Sitzung (Anzahl Anwesende, Abwesende, Entschuldigte).
      description_fr: |
        Liste de présence agrégée pour une séance (nombre de membres présents, absents, excusés).
    mixins:
      - HasIdentification
      - HasCreationModificationDates
    slots:
      - parent_meeting
      - datetime_begin
      - actor_id
      - total_count
      - total_present
      - total_absent
      - total_excused
    slot_usage:
      actor_id:
        range: GroupReference
        inlined: true
        description: |
          Reference to the acting body/organ (lightweight snapshot at time of linking).
        annotations:
          description_de: |
            Referenz auf das handelnde Organ/Gremium (leichtgewichtiger Snapshot zum Zeitpunkt der Verknüpfung).
          description_fr: |
            Référence à l'organe agissant (instantané allégé au moment de la mise en relation).

  IndividualAttendance:
    description: |
      Individual attendance record for a specific person at a meeting (linked via the parent Attendance aggregate).
    annotations:
      description_de: |
        Einzelne Anwesenheitsfeststellung einer Person an einer Sitzung (verknüpft über das übergeordnete Attendance-Aggregat).
      description_fr: |
        Constatation individuelle de la présence d'une personne à une séance (rattachée à l'agrégat Attendance parent).
    mixins:
      - HasIdentification
      - HasCreationModificationDates
    slots:
      - parent_attendance
      - actor_id
      - attendance_type
      - reason

  Speech:
    description: |
      A speech or statement made during a meeting (also called Votum or speaker segment).
    annotations:
      description_de: |
        Eine Wortmeldung während einer Sitzung (auch Votum oder Redebeitrag genannt).
      description_fr: |
        Une intervention prononcée au cours d'une séance (également appelée prise de parole).
    mixins:
      - HasIdentification
      - HasCreationModificationDates
    slots:
      - language
      - start
      - datetime_begin
      - datetime_end
      - actor_fullname
      - actor_id
      - role
      - text
      - text_format
      - text_type
      - landing_page
      - media_url
      - media_type
      - media_format
      - documents

  TextSegment:
    description: |
      A text segment such as cross-references or subtitles in meeting protocols.
    annotations:
      description_de: |
        Ein Textsegment wie Querverweise oder Zwischentitel in Sitzungsprotokollen.
      description_fr: |
        Un segment de texte tel qu'un renvoi ou un intertitre dans un procès-verbal de séance.
    mixins:
      - HasIdentification
    slots:
      - text

  Motion:
    description: |
      A formal proposal or motion submitted during proceedings.
    annotations:
      description_de: |
        Ein formeller Antrag, der während der Verhandlungen eingereicht wird.
      description_fr: |
        Une proposition formelle déposée au cours des délibérations.
    mixins:
      - HasIdentification
    slots:
      - title
      - description
      - documents

  Media:
    description: |
      Media files or documents (including protocols in PDF/HTML/WORD or links to audio/video).
    annotations:
      description_de: |
        Mediendateien oder Dokumente (einschliesslich Protokolle in PDF/HTML/WORD oder Links zu Audio/Video).
      description_fr: |
        Fichiers médias ou documents (y compris les procès-verbaux en PDF/HTML/WORD ou les liens vers des contenus audio/vidéo).
    mixins:
      - HasIdentification
    slots:
      - title
      - media_type
      - url
      - version
      - parent_type

  TotalOther:
    description: |
      Additional vote counts when multiple options are presented (e.g., Zurich uses 5 buttons).
    annotations:
      description_de: |
        Zusätzliche Stimmzahlen, wenn mehrere Optionen zur Abstimmung gestellt werden (z.B. Zürich verwendet 5 Knöpfe).
      description_fr: |
        Décomptes de voix supplémentaires lorsque plusieurs options sont soumises au vote (p. ex. Zurich utilise 5 boutons).
    slots:
      - count
      - label

  MultilingualString:
    description: |
      A string that can contain text in multiple languages.
    annotations:
      description_de: |
        Ein String, der Text in mehreren Sprachen enthalten kann.
      description_fr: |
        Une chaîne de caractères pouvant contenir du texte en plusieurs langues.
    slots:
      - text
      - language
    slot_usage:
      language:
        required: true

slots:

  administrative_id:
    description: |
      Administrative ID of the legislative body, such as a municipality, canton, or country.
    annotations:
      description_de: |
        Verwaltungs-ID des gesetzgebenden Körpers, wie z.B. Gemeinde, Kanton oder Land.
      description_fr: |
        Identifiant administratif du corps législatif, p. ex. commune, canton ou pays.

  actor_id:
    description: |
      Reference to the acting person (lightweight snapshot at time of linking).
    annotations:
      description_de: |
        Referenz auf die handelnde Person (leichtgewichtiger Snapshot zum Zeitpunkt der Verknüpfung).
      description_fr: |
        Référence à la personne agissante (instantané allégé au moment de la mise en relation).
    range: PersonReference
    inlined: true

  body_key:
    description: |
      Key identifying the political body or jurisdiction (e.g., BE for Bern, CHE for Switzerland).
    annotations:
      description_de: |
        Schlüssel zur Identifizierung des politischen Organs oder der Gerichtsbarkeit (z.B. BE für Bern, CHE für Schweiz).
      description_fr: |
        Clé identifiant l'organe politique ou la collectivité (p. ex. BE pour Berne, CHE pour la Suisse).

  type_label:
    description: |
      Custom type label when standard type values don't apply.
    annotations:
      description_de: |
        Benutzerdefinierte Typbezeichnung, wenn Standardtypwerte nicht zutreffen.
      description_fr: |
        Libellé de type personnalisé lorsque les valeurs de type standard ne s'appliquent pas.

  voting_type:
    description: |
      Type of voting procedure (preliminary, final, secret, etc.).
    annotations:
      description_de: |
        Art des Abstimmungsverfahrens (Zwischen-, Schlussabstimmung, geheim, etc.).
      description_fr: |
        Type de procédure de vote (vote intermédiaire, vote final, vote secret, etc.).
    range: VotingTypeEnum

  voting_title:
    description: |
      Title or question being voted on. If no specific subject exists, do not use the business item title.
    annotations:
      description_de: |
        Abstimmungstitel bzw. Gegenstand oder Frage. Wenn kein Gegenstand vorhanden ist, sollte nicht der Geschäftstitel verwendet werden.
      description_fr: |
        Titre du vote, objet ou question soumise au vote. En l'absence d'objet propre, il ne faut pas reprendre le titre de l'affaire.
    range: MultilingualString
    multivalued: true
    inlined_as_list: true

  resolution_type:
    description: |
      Type of resolution taken on the agenda item.
    annotations:
      description_de: |
        Art der Resolution zum Traktandum.
      description_fr: |
        Type de décision prise sur le point de l'ordre du jour.
    range: ResolutionTypeEnum

  individual_vote_type:
    description: |
      Type of vote cast (yes, no, abstention, no vote, etc.).
    annotations:
      description_de: |
        Art der abgegebenen Stimme (Ja, Nein, Enthaltung, nicht abgestimmt, etc.).
      description_fr: |
        Type de voix exprimée (oui, non, abstention, n'a pas voté, etc.).
    range: IndividualVoteTypeEnum

  agenda_item_type:
    description: |
      Type of agenda item, distinguishing individual items from groups.
    annotations:
      description_de: |
        Art des Traktandums, unterscheidet Einzeltraktanden von Traktandengruppen.
      description_fr: |
        Type de point de l'ordre du jour, distinguant les points isolés des groupes de points.
    range: AgendaItemTypeEnum

  agenda_item_number:
    description: |
      Sequential number of the agenda item (string type to support roman numerals).
    annotations:
      description_de: |
        Laufnummer des Traktandums (String-Typ zur Unterstützung römischer Ziffern).
      description_fr: |
        Numéro d'ordre du point de l'ordre du jour (type chaîne, afin de permettre les chiffres romains).
    range: string

  agenda_item_position:
    description: |
      Integer position of the agenda item in the meeting sequence.
    annotations:
      description_de: |
        Ganzzahlige Position des Traktandums in der Sitzungsreihenfolge.
      description_fr: |
        Position (nombre entier) du point de l'ordre du jour dans le déroulement de la séance.
    range: integer

  agenda_item_title:
    description: |
      Title of the agenda item.
    annotations:
      description_de: |
        Titel des Traktandums.
      description_fr: |
        Titre du point de l'ordre du jour.
    range: MultilingualString
    multivalued: true
    inlined_as_list: true

  agenda_item_description:
    description: |
      Subtitle or detailed description of the agenda item.
    annotations:
      description_de: |
        Untertitel oder ausführliche Beschreibung des Traktandums.
      description_fr: |
        Sous-titre ou description détaillée du point de l'ordre du jour.
    range: MultilingualString
    multivalued: true
    inlined_as_list: true

  agenda_item_category:
    description: |
      Category for grouped agenda items (e.g., introduction, by department, technical agenda items).
    annotations:
      description_de: |
        Kategorie für gruppierte Traktanden (z.B. Einführung, nach Departement, technische Traktanden).
      description_fr: |
        Catégorie pour les points de l'ordre du jour regroupés (p. ex. introduction, par département, points techniques).
    range: string

  sequential_number:
    description: |
      Sequential number of the meeting, used for ordering.
    annotations:
      description_de: |
        Laufende Nummer der Sitzung, die zur Sortierung verwendet wird.
      description_fr: |
        Numéro séquentiel de la séance, utilisé pour le tri.
    range: integer

  actor_name:
    description: |
      Name of the political body (e.g., Nationalrat).
    annotations:
      description_de: |
        Name des politischen Organs (z.B. Nationalrat).
      description_fr: |
        Nom de l'organe politique (p. ex. Conseil national).
    range: string

  state_name:
    description: |
      Custom state description for the meeting.
    annotations:
      description_de: |
        Benutzerdefinierte Zustandsbeschreibung für die Sitzung.
      description_fr: |
        Description personnalisée de l'état de la séance.
    range: string

  parent_meeting:
    description: |
      The linked meeting ID that groups the current meeting.
    annotations:
      description_de: |
        Die verknüpfte Sitzungs-ID, die die aktuelle Sitzung gruppiert.
      description_fr: |
        Identifiant de la séance liée qui regroupe la séance courante.
    range: string

  parent_legislature:
    description: |
      The legislative body in which the meeting is based.
    annotations:
      description_de: |
        Der gesetzgebende Körper, auf dem die Sitzung basiert.
      description_fr: |
        La législature dans le cadre de laquelle la séance a lieu.

  leading_actor_id:
    description: |
      The leading department for the agenda item.
    annotations:
      description_de: |
        Das federführende Departement für das Traktandum.
      description_fr: |
        Le département responsable du point de l'ordre du jour.
    range: string

  speaking_actor_id:
    description: |
      The speaker or head of the department for the agenda item.
    annotations:
      description_de: |
        Der Sprecher oder die Sprecherin bzw. die Departementsvorsteherin oder der Departementsvorsteher für das Traktandum.
      description_fr: |
        La ou le porte-parole ou la cheffe ou le chef du département pour le point de l'ordre du jour.

  name:
    description: |
      Multilingual full designation.
    annotations:
      description_de: |
        Mehrsprachige vollständige Bezeichnung.
      description_fr: |
        Désignation complète multilingue.
    range: MultilingualString
    multivalued: true
    inlined_as_list: true

  vote_procedures:
    description: |
      Procedures for voting, such as secret ballot or open vote.
    annotations:
      description_de: |
        Verfahren für die Abstimmung, wie geheime Abstimmung oder offene Abstimmung.
      description_fr: |
        Modalités du vote, p. ex. vote secret ou vote ouvert.
    range: string
    multivalued: true
    inlined_as_list: true

  affair_id:
    description: |
      The connection to the affairs (business items) of the agenda item.
    annotations:
      description_de: |
        Die Verbindung zu den Geschäften des Traktandums.
      description_fr: |
        Le lien vers les affaires rattachées au point de l'ordre du jour.
    range: string

  state_id:
    description: |
      State identifier (reference to state enum or custom state).
    annotations:
      description_de: |
        Zustands-Identifikator (Verweis auf das Status-Enum oder auf einen eigenen Zustand).
      description_fr: |
        Identifiant d'état (renvoi à l'énumération des états ou à un état propre).
    range: string

  datetime_begin:
    range: datetime
    description: |
      The date and time when the meeting or voting begins.
    annotations:
      description_de: |
        Das Datum und die Uhrzeit, zu der die Sitzung oder Abstimmung beginnt.
      description_fr: |
        La date et l'heure auxquelles la séance ou le vote commence.

  datetime_end:
    range: datetime
    description: |
      The date and time when the meeting or voting ends.
    annotations:
      description_de: |
        Das Datum und die Uhrzeit, zu der die Sitzung oder Abstimmung endet.
      description_fr: |
        La date et l'heure auxquelles la séance ou le vote se termine.

  optional:
    range: boolean
    description: |
      Indicates if the meeting or voting is optional.
    annotations:
      description_de: |
        Gibt an, ob die Sitzung oder Abstimmung optional ist.
      description_fr: |
        Indique si la séance ou le vote est facultatif.

  agenda_item_ids:
    description: |
      The agenda items associated with the voting.
    annotations:
      description_de: |
        Die Traktanden, die mit der Abstimmung verbunden sind.
      description_fr: |
        Les points de l'ordre du jour associés au vote.
    range: string
    multivalued: true
    inlined_as_list: true

  seat_nr:
    description: |
      The seat number of the individual vote, if applicable.
    annotations:
      description_de: |
        Die Sitznummer der Einzelstimme, falls zutreffend.
      description_fr: |
        Le numéro de siège correspondant à la voix individuelle, le cas échéant.
    range: string

  weight:
    description: |
      The number of votes held by the individual, if applicable (e.g., in cases where a person has multiple votes).
    annotations:
      description_de: |
        Die Anzahl der Stimmen, die die Einzelperson hat, falls zutreffend (z.B. in Fällen, in denen eine Person mehrere Stimmen hat).
      description_fr: |
        Le nombre de voix dont dispose la personne, le cas échéant (p. ex. lorsqu'une personne détient plusieurs voix).
    range: integer

  count:
    description: |
      The count of votes for the total other category.
    annotations:
      description_de: |
        Die Anzahl der Stimmen für die Kategorie „Andere“.
      description_fr: |
        Le nombre de voix pour la catégorie « autres ».
    range: integer

  parent_voting:
    slot_uri: ops:parentVoting
    description: |
      The ID of the voting associated with the individual vote.
    annotations:
      description_de: |
        Die ID der Abstimmung, die mit der Einzelstimme verbunden ist.
      description_fr: |
        L'identifiant du vote auquel se rattache la voix individuelle.
    range: Voting

  parent_attendance:
    slot_uri: ops:parentAttendance
    description: |
      The Attendance aggregate this individual attendance record belongs to.
    annotations:
      description_de: |
        Das Attendance-Aggregat, zu dem dieser einzelne Anwesenheits-Eintrag gehört.
      description_fr: |
        L'agrégat Attendance auquel appartient cette constatation individuelle de présence.
    range: Attendance

  parent_agenda_item:
    description: |
      If needed, this slot builds a hierarchy of agenda items.
    annotations:
      description_de: |
        Wenn erforderlich, baut dieser Slot eine Hierarchie von Traktanden auf.
      description_fr: |
        Au besoin, ce slot permet de construire une hiérarchie de points de l'ordre du jour.
    range: string

  has_resolution:
    description: |
      The resolution or decision taken on this agenda item.
    annotations:
      description_de: |
        Die Resolution oder Entscheidung zu diesem Traktandum.
      description_fr: |
        La décision prise sur ce point de l'ordre du jour.
    range: Resolution

  url:
    description: |
      Landing page or further web address, multilingual.
    annotations:
      description_de: |
        Landing Page oder weiterführende Webadresse, mehrsprachig.
      description_fr: |
        Page d'accueil ou adresse web complémentaire, multilingue.
    range: MultilingualString
    multivalued: true
    inlined_as_list: true

  number:
    description: |
      Sequential number, e.g. within the legislature, the session or the year.
    annotations:
      description_de: |
        Laufende Nummer, z.B. innerhalb der Legislatur, der Session oder des Jahres.
      description_fr: |
        Numéro courant, p. ex. au sein de la législature, de la session ou de l'année.

  meeting_abbreviation:
    description: |
      Short designation of the session or meeting (e.g. "FS24" for the 2024 spring session).
    annotations:
      description_de: |
        Kurzbezeichnung der Session oder Sitzung (z.B. „FS24“ für die Frühjahrssession 2024).
      description_fr: |
        Désignation abrégée de la session ou de la séance (p. ex. « FS24 » pour la session de printemps 2024).

  group_name:
    description: |
      Name of the group or body.
    annotations:
      description_de: |
        Name der Gruppe oder des Gremiums.
      description_fr: |
        Nom du groupe ou de l'organe.
    range: string

  group_id:
    description: |
      Reference to the group or body (lightweight snapshot at time of linking).
    annotations:
      description_de: |
        Referenz auf die Gruppe oder das Gremium (leichtgewichtiger Snapshot zum Zeitpunkt der Verknüpfung).
      description_fr: |
        Référence au groupe ou à l'organe (instantané allégé au moment de la mise en relation).
    range: GroupReference
    inlined: true

  landing_page:
    slot_uri: ops:landingPage
    description: |
      URL providing further information.
    annotations:
      description_de: |
        URL mit weiteren Informationen.
      description_fr: |
        URL fournissant des informations complémentaires.

  tie_breaker:
    range: boolean
    description: |
      Indicates if a tie-breaker was used in the voting.
    annotations:
      description_de: |
        Gibt an, ob ein Stichentscheid bei der Abstimmung verwendet wurde.
      description_fr: |
        Indique si une voix prépondérante a été utilisée lors du vote.

  label_yes:
    range: string
    description: |
      Meaning of a 'yes' vote.
    annotations:
      description_de: |
        Bedeutung einer „Ja“-Stimme.
      description_fr: |
        Signification d'une voix « oui ».

  label_no:
    range: string
    description: |
      Meaning of a 'no' vote.
    annotations:
      description_de: |
        Bedeutung einer „Nein“-Stimme.
      description_fr: |
        Signification d'une voix « non ».

  label_abstention:
    range: string
    description: |
      Meaning of an 'abstention' vote.
    annotations:
      description_de: |
        Bedeutung einer Enthaltungsstimme.
      description_fr: |
        Signification d'une abstention.

  total_count_yes:
    range: integer
    description: |
      Total number of 'yes' votes.
    annotations:
      description_de: |
        Gesamtzahl der „Ja“-Stimmen.
      description_fr: |
        Nombre total de voix « oui ».

  total_count_no:
    range: integer
    description: |
      Total number of 'no' votes.
    annotations:
      description_de: |
        Gesamtzahl der „Nein“-Stimmen.
      description_fr: |
        Nombre total de voix « non ».

  total_count_abstention:
    range: integer
    description: |
      Total number of abstentions.
    annotations:
      description_de: |
        Gesamtzahl der Enthaltungen.
      description_fr: |
        Nombre total d'abstentions.

  total_other:
    range: TotalOther
    multivalued: true
    inlined_as_list: true
    description: |
      Used when multiple options are presented for voting (e.g., 5 buttons in Zurich).
    annotations:
      description_de: |
        Wird verwendet, wenn mehrere Optionen zur Abstimmung gestellt werden (z.B. 5 Knöpfe in Zürich).
      description_fr: |
        Utilisé lorsque plusieurs options sont soumises au vote (p. ex. 5 boutons à Zurich).

  total_absent:
    range: integer
    description: |
      Total number of absent members. Distinction between absent/excused absent - presence is tracked on attendance list.
    annotations:
      description_de: |
        Gesamtzahl abwesender Mitglieder. Unterscheidung zwischen abwesend/entschuldigt abwesend - Anwesenheit wird auf Anwesenheitsliste verfolgt.
      description_fr: |
        Nombre total de membres absents. La distinction entre absent et absent excusé se fait dans la liste de présence.

  total:
    range: integer
    description: |
      Total number of votes, excluding absent and president's vote.
    annotations:
      description_de: |
        Gesamtzahl der Stimmen, ohne abwesende und Präsidiumsstimmen.
      description_fr: |
        Nombre total de voix, sans les absents ni la voix de la présidence.

  majority_type:
    range: MajorityTypeEnum
    description: |
      Type of majority required for the vote (absolute, two-thirds, etc.).
    annotations:
      description_de: |
        Art der für die Abstimmung erforderlichen Mehrheit (absolut, Zweidrittel usw.).
      description_fr: |
        Type de majorité requise pour le vote (absolue, deux tiers, etc.).

  majority_count:
    range: integer
    description: |
      Number of votes required for the relevant majority threshold.
    annotations:
      description_de: |
        Anzahl der Stimmen, die für die relevante Mehrheitsschwelle erforderlich sind.
      description_fr: |
        Nombre de voix requis pour atteindre le seuil de majorité déterminant.

  result_text:
    range: string
    description: |
      Free text describing the outcome of the vote, e.g., "Accepted with 78 votes".
    annotations:
      description_de: |
        Freitext zur Beschreibung des Ergebnisses der Abstimmung, z.B. „Mit 78 Stimmen angenommen“.
      description_fr: |
        Texte libre décrivant le résultat du vote, p. ex. « Accepté par 78 voix ».

  meeting_type:
    slot_uri: ops:meetingType
    description: |
      Type of the meeting, e.g. session, committee, sitting, various.
    annotations:
      description_de: |
        Art der Sitzung, z.B. Session, Kommission, Sessionssitzung, Verschiedenes.
      description_fr: |
        Type de séance, p. ex. session, commission, séance de session, divers.
    range: MeetingTypeEnum

  state:
    description: |
      Current state of the meeting (planned, canceled, postponed).
    annotations:
      description_de: |
        Aktueller Status der Sitzung (geplant, abgesagt, verschoben).
      description_fr: |
        État actuel de la séance (planifiée, annulée, reportée).
    range: StateEnum

  status:
    description: |
      Free status designation, used where the state enumeration does not apply.
    annotations:
      description_de: |
        Freie Statusbezeichnung, dort verwendet, wo das Status-Enum nicht zutrifft.
      description_fr: |
        Désignation libre de l'état, utilisée là où l'énumération des états ne s'applique pas.

  type:
    description: |
      Generic type designation.
    annotations:
      description_de: |
        Generische Typbezeichnung.
      description_fr: |
        Désignation générique du type.

  description:
    description: |
      Descriptive text of the element.
    annotations:
      description_de: |
        Beschreibender Text zum Element.
      description_fr: |
        Texte descriptif de l'élément.

  location:
    description: |
      Place where the meeting is held (physical room, video conference or hybrid format).
    annotations:
      description_de: |
        Ort, an dem die Sitzung stattfindet (physischer Raum, Videokonferenz oder hybrides Format).
      description_fr: |
        Lieu où se tient la séance (salle physique, visioconférence ou format hybride).

  position:
    description: |
      Integer position within the superordinate sequence.
    annotations:
      description_de: |
        Ganzzahlige Position innerhalb der übergeordneten Reihenfolge.
      description_fr: |
        Position (nombre entier) au sein de la séquence supérieure.

  result:
    description: |
      Result of the procedure.
    annotations:
      description_de: |
        Ergebnis des Verfahrens.
      description_fr: |
        Résultat de la procédure.

  title:
    description: |
      Title of the element.
    annotations:
      description_de: |
        Titel des Elements.
      description_fr: |
        Titre de l'élément.

  category:
    description: |
      Category of the element.
    annotations:
      description_de: |
        Kategorie des Elements.
      description_fr: |
        Catégorie de l'élément.

  legislatures:
    slot_uri: ops:legislature
    description: |
      Collection of legislature records.
    annotations:
      description_de: |
        Sammlung der Legislaturperioden.
      description_fr: |
        Ensemble des législatures.
    range: Legislature
    multivalued: true
    inlined_as_list: true

  sessions:
    slot_uri: ops:session
    description: |
      Collection of session records.
    annotations:
      description_de: |
        Sammlung der Sessionen.
      description_fr: |
        Ensemble des sessions.
    range: Session
    multivalued: true
    inlined_as_list: true

  meetings:
    slot_uri: ops:meeting
    description: |
      Collection of meeting records.
    annotations:
      description_de: |
        Sammlung der Sitzungen.
      description_fr: |
        Ensemble des séances.
    range: Meeting
    multivalued: true
    inlined_as_list: true

  agenda_items:
    slot_uri: ops:agendaItem
    description: |
      Collection of agenda item records.
    annotations:
      description_de: |
        Sammlung der Traktanden.
      description_fr: |
        Ensemble des points de l'ordre du jour.
    range: AgendaItem
    multivalued: true
    inlined_as_list: true

  protocols:
    slot_uri: ops:protocol
    description: |
      Collection of protocol records.
    annotations:
      description_de: |
        Sammlung der Protokolle.
      description_fr: |
        Ensemble des procès-verbaux.
    range: Protocol
    multivalued: true
    inlined_as_list: true

  protocol_ref:
    slot_uri: ops:protocolRef
    description: |
      The protocol (minutes) of this meeting, recorded after the meeting.
    annotations:
      description_de: |
        Das nach der Sitzung erstellte Protokoll dieser Sitzung.
      description_fr: |
        Le procès-verbal de cette séance, établi après celle-ci.
    range: Protocol
    inlined: true

  protocol_items:
    slot_uri: ops:protocolItem
    description: |
      Agenda items as actually recorded in the protocol.
    annotations:
      description_de: |
        Traktanden, wie sie im Protokoll tatsächlich festgehalten wurden.
      description_fr: |
        Points de l'ordre du jour tels qu'ils ont effectivement été consignés au procès-verbal.
    range: ProtocolItem
    multivalued: true
    inlined_as_list: true

  text_segments:
    slot_uri: ops:textSegment
    description: |
      Collection of text segments (e.g. verbatim protocol).
    annotations:
      description_de: |
        Sammlung von Textsegmenten (z.B. Wortprotokoll).
      description_fr: |
        Ensemble de segments de texte (p. ex. procès-verbal in extenso).
    range: TextSegment
    multivalued: true
    inlined_as_list: true

  votings:
    slot_uri: ops:voting
    description: |
      Collection of voting records.
    annotations:
      description_de: |
        Sammlung der Abstimmungen.
      description_fr: |
        Ensemble des votes.
    range: Voting
    multivalued: true
    inlined_as_list: true

  elections:
    slot_uri: ops:election
    description: |
      Collection of election records.
    annotations:
      description_de: |
        Sammlung der Wahlen.
      description_fr: |
        Ensemble des élections.
    range: Election
    multivalued: true
    inlined_as_list: true

  individual_votes:
    slot_uri: ops:individualVote
    description: |
      Collection of individual vote records.
    annotations:
      description_de: |
        Sammlung der Einzelstimmen.
      description_fr: |
        Ensemble des voix individuelles.
    range: IndividualVote
    multivalued: true
    inlined_as_list: true

  attendances:
    slot_uri: ops:attendance
    description: |
      Collection of attendance records.
    annotations:
      description_de: |
        Sammlung der Anwesenheitslisten.
      description_fr: |
        Ensemble des listes de présence.
    range: Attendance
    multivalued: true
    inlined_as_list: true

  individual_attendances:
    slot_uri: ops:individualAttendance
    description: |
      Collection of individual attendance records.
    annotations:
      description_de: |
        Sammlung der einzelnen Anwesenheitsfeststellungen.
      description_fr: |
        Ensemble des constatations individuelles de présence.
    range: IndividualAttendance
    multivalued: true
    inlined_as_list: true

  speeches:
    slot_uri: ops:speech
    description: |
      Collection of speech records.
    annotations:
      description_de: |
        Sammlung der Wortmeldungen.
      description_fr: |
        Ensemble des interventions.
    range: Speech
    multivalued: true
    inlined_as_list: true

  resolutions:
    slot_uri: ops:resolution
    description: |
      Collection of resolution records.
    annotations:
      description_de: |
        Sammlung der Resolutionen.
      description_fr: |
        Ensemble des décisions.
    range: Resolution
    multivalued: true
    inlined_as_list: true

  election_type:
    description: |
      Type of election procedure.
    annotations:
      description_de: |
        Art des Wahlverfahrens.
      description_fr: |
        Type de procédure d'élection.
    range: ElectionTypeEnum

  attendance_type:
    description: |
      Type of individual attendance.
    annotations:
      description_de: |
        Art der individuellen Anwesenheit.
      description_fr: |
        Type de présence individuelle.
    range: AttendanceTypeEnum

  reason:
    description: |
      Reason for absence or lateness (free-text, multilingual).
    annotations:
      description_de: |
        Grund für Abwesenheit oder Verspätung (Freitext, mehrsprachig).
      description_fr: |
        Motif de l'absence ou du retard (texte libre, multilingue).
    range: MultilingualString
    multivalued: true
    inlined_as_list: true

  total_count:
    range: integer
    description: |
      Total number of members of the body (reference value for quorum calculations).
    annotations:
      description_de: |
        Gesamtzahl aller Mitglieder des Gremiums (Bezugsgrösse für Quorum-Berechnungen).
      description_fr: |
        Nombre total de membres de l'organe (valeur de référence pour le calcul du quorum).

  total_present:
    range: integer
    description: |
      Total number of members present.
    annotations:
      description_de: |
        Gesamtzahl der anwesenden Mitglieder.
      description_fr: |
        Nombre total de membres présents.

  total_excused:
    range: integer
    description: |
      Total number of excused absences.
    annotations:
      description_de: |
        Gesamtzahl der entschuldigten Abwesenheiten.
      description_fr: |
        Nombre total d'absences excusées.

  actor_fullname:
    description: |
      Full name of the actor/person.
    annotations:
      description_de: |
        Vollständiger Name der Akteurin oder des Akteurs bzw. der Person.
      description_fr: |
        Nom complet de l'actrice ou de l'acteur, respectivement de la personne.

  start:
    description: |
      Start indicator or position.
    annotations:
      description_de: |
        Startangabe oder Position.
      description_fr: |
        Indication de début ou position.

  role:
    description: |
      Role of the person (e.g., commission speaker).
    annotations:
      description_de: |
        Rolle der Person (z.B. Kommissionssprecherin oder Kommissionssprecher).
      description_fr: |
        Rôle de la personne (p. ex. rapporteuse ou rapporteur de commission).

  text_format:
    description: |
      Format of text (text, html, html_with_timestamps).
    annotations:
      description_de: |
        Format des Textes (text, html, html_with_timestamps).
      description_fr: |
        Format du texte (text, html, html_with_timestamps).

  text_type:
    description: |
      Type of text (raw draft, edited version).
    annotations:
      description_de: |
        Typ des Textes (Rohfassung, bearbeitete Fassung).
      description_fr: |
        Type de texte (version brute, version éditée).

  media_url:
    description: |
      URL to media file (audio/video).
    annotations:
      description_de: |
        URL zur Mediendatei (Audio/Video).
      description_fr: |
        URL du fichier média (audio/vidéo).

  media_type:
    description: |
      Type of media (audio, video, document).
    annotations:
      description_de: |
        Art des Mediums (Audio, Video, Dokument).
      description_fr: |
        Type de média (audio, vidéo, document).

  media_format:
    description: |
      MIME type of the media file.
    annotations:
      description_de: |
        MIME-Typ der Mediendatei.
      description_fr: |
        Type MIME du fichier média.

  parent_type:
    description: |
      Type of parent object (meeting, agenda, speech, affair).
    annotations:
      description_de: |
        Typ des übergeordneten Objekts (Sitzung, Traktandum, Wortmeldung, Geschäft).
      description_fr: |
        Type de l'objet parent (séance, point de l'ordre du jour, intervention, affaire).

  version:
    description: |
      Version number or identifier.
    annotations:
      description_de: |
        Versionsnummer oder Versionskennung.
      description_fr: |
        Numéro ou identifiant de version.

  text:
    description: |
      Text content of the element.
    annotations:
      description_de: |
        Textinhalt des Elements.
      description_fr: |
        Contenu textuel de l'élément.
    required: true

enums:

  StateEnum:
    description: |
      State of the meeting.
    annotations:
      description_de: |
        Status der Sitzung.
      description_fr: |
        État de la séance.
    permissible_values:
      "planned":
        meaning: ops:enum/state/planned
        description: |
          The meeting is planned and will take place as scheduled.
        annotations:
          description_de: |
            Die Sitzung ist geplant und findet wie vorgesehen statt.
          description_fr: |
            La séance est planifiée et se tiendra comme prévu.
      "canceled":
        meaning: ops:enum/state/canceled
        description: |
          The meeting has been cancelled.
        annotations:
          description_de: |
            Die Sitzung wurde abgesagt.
          description_fr: |
            La séance a été annulée.
      "postponed":
        meaning: ops:enum/state/postponed
        description: |
          The meeting has been postponed.
        annotations:
          description_de: |
            Die Sitzung wurde verschoben.
          description_fr: |
            La séance a été reportée.

  MeetingTypeEnum:
    description: |
      Type of the meeting.
    annotations:
      description_de: |
        Art der Sitzung.
      description_fr: |
        Type de séance.
    permissible_values:
      "session":
        meaning: ops:enum/meeting_type/session
        description: |
          Plenary sitting of the whole parliament or of one chamber.
        annotations:
          description_de: |
            Plenarsitzung des gesamten Parlaments oder einer Kammer.
          description_fr: |
            Séance plénière de l'ensemble du parlement ou d'une chambre.
      "committee":
        meaning: ops:enum/meeting_type/committee
        description: |
          Meeting of a parliamentary committee.
        annotations:
          description_de: |
            Sitzung einer parlamentarischen Kommission.
          description_fr: |
            Séance d'une commission parlementaire.
      "sitting":
        meaning: ops:enum/meeting_type/sitting
        description: |
          Special forms of assembly (e.g. Landsgemeinde, communal assembly).
        annotations:
          description_de: |
            Besondere Versammlungsformen (z.B. Landsgemeinde, Gemeindeversammlung).
          description_fr: |
            Formes particulières d'assemblée (p. ex. Landsgemeinde, assemblée communale).
      "various":
        meaning: ops:enum/meeting_type/various
        description: |
          Other forms of meeting not covered by the categories above.
        annotations:
          description_de: |
            Andere Sitzungsformen, die nicht in die obigen Kategorien fallen.
          description_fr: |
            Autres formes de séance non couvertes par les catégories ci-dessus.

  MajorityTypeEnum:
    description: |
      Type of majority required for the vote.
    annotations:
      description_de: |
        Art der für die Abstimmung erforderlichen Mehrheit.
      description_fr: |
        Type de majorité requise pour le vote.
    permissible_values:
      "absolute":
        meaning: ops:enum/majority_type/absolute
        description: |
          Absolute majority.
        annotations:
          description_de: |
            Absolutes Mehr.
          description_fr: |
            Majorité absolue.
      "two_thirds":
        meaning: ops:enum/majority_type/two_thirds
        description: |
          Two-thirds majority.
        annotations:
          description_de: |
            Zweidrittelmehr.
          description_fr: |
            Majorité des deux tiers.
      "other":
        meaning: ops:enum/majority_type/other
        description: |
          Other majority threshold not covered by the standard categories.
        annotations:
          description_de: |
            Andere Mehrheitsschwelle, nicht durch die Standardkategorien abgedeckt.
