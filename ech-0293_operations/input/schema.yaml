#
# Syntaktisch korrekte Version
# bitte in schema_working.yaml arbeiten!
#
# Mehrsprachigkeit: Englisch in `description:`, Deutsch in
# `annotations.description_de:`, Franzoesisch in `annotations.description_fr:`.
# Alle drei Sprachen sind synchron zu halten -- localize_schema.py erzeugt
# daraus die sprachspezifischen Schemata fuer gen-doc.
#

id: https://ch.paf.link/schema/operations
name: operations
description: |
  Meeting Schema for various legislative bodies
annotations:
  description_de: |
    Sitzungs-Schema für verschiedene gesetzgebende Körperschaften
  description_fr: |
    Schéma des séances pour différents corps législatifs
prefixes:
  linkml: https://w3id.org/linkml/
  ops: https://ch.paf.link/schema/operations/
  dcterms: http://purl.org/dc/terms/
  # Cross-references to instance data of the sibling eCH standards.
  actors: https://ld.ech.ch/schema/0294/actors/
  affairs: https://ld.ech.ch/schema/0295/affairs/
  parl: https://ld.ech.ch/schema/0293/operations/
imports:
  - linkml:types
  - ../../ech-0292_meta/input/schema_common
  - ../../ech-0292_meta/input/schema
default_prefix: ops
default_range: string

classes:

  Container:
    tree_root: true
    description: |
      Container for the records of public council operations: legislatures, sessions, meetings, protocols, votings, elections, attendances, speeches and resolutions.
    annotations:
      description_de: |
        Container für die Daten des öffentlichen Ratsbetriebs: Legislaturperioden, Sessionen, Sitzungen, Protokolle, Abstimmungen, Wahlen, Anwesenheiten, Wortmeldungen und Resolutionen.
      description_fr: |
        Conteneur pour les données de l'activité publique des conseils : législatures, sessions, séances, procès-verbaux, votes, élections, présences, interventions et décisions.
    mixins:
      - HasIdentification
    slots:
      - legislatures
      - sessions
        # ist_schon_erfasst
      - meetings
      - protocols
      - votings
      - elections
      - individual_votes
      - attendances
      - individual_attendances
      - speeches
      - resolutions

  Legislature:
    description: |
      Term of office of a parliament as a legislative assembly. Usually lasts four years.
    annotations:
      description_de: |
        Amtsdauer eines Parlaments als gesetzgebender Versammlung. Dauert in der Regel vier Jahre.
      description_fr: |
        Durée du mandat d'un parlement en tant qu'assemblée législative. Elle est en règle générale de quatre ans.
    mixins:
      - HasIdentification
      - IsEventWithDuration
      - HasCreationModificationDates
    slots:
      - spatial
      - administrative_id
      - name
      - description
      - landing_page
      - actor_id
      - documents
    slot_usage:
      actor_id:
        range: GroupReference
        inlined: true
        description: |
          Reference to the acting body/organ (lightweight snapshot at time of linking).
        annotations:
          description_de: |
            Referenz auf das handelnde Organ/Gremium (Momentaufnahme zum Zeitpunkt der Verknüpfung).
          description_fr: |
            Référence à l'organe agissant (instantané au moment de la mise en relation).

  Session:
    description: |
      A session: a contiguous period of sittings within a legislature. It groups its meetings (meetings) and may also carry agenda items directly (agenda_items). The session is the only one of the three temporal levels that may be omitted: federal units without formal sessions leave it out and attach their meetings directly to the legislature (parent_legislature). Session and meeting may also coincide — a one-day sitting of a cantonal parliament or a Landsgemeinde is represented as a session with a single meeting, or as a session that carries its agenda items directly without any meeting.
    annotations:
      description_de: |
        Eine Session: eine zusammenhängende Sitzungsperiode innerhalb einer Legislaturperiode. Sie fasst ihre Sitzungen zusammen (meetings) und kann auch direkt Traktanden führen (agenda_items). Die Session ist die einzige der drei zeitlichen Ebenen, auf die verzichtet werden kann: Föderaleinheiten ohne formale Sessionen lassen sie weg und hängen ihre Sitzungen direkt an die Legislaturperiode (parent_legislature). Session und Sitzung können auch zusammenfallen — eine eintägige Sitzung eines Kantonsparlaments oder eine Landsgemeinde wird als Session mit einer einzigen Sitzung abgebildet oder als Session, die ihre Traktanden direkt und ohne Sitzung führt.
      description_fr: |
        Une session : une période de séances continue au sein d'une législature. Elle regroupe ses séances (meetings) et peut aussi porter directement des points de l'ordre du jour (agenda_items). La session est le seul des trois niveaux temporels auquel il est possible de renoncer : les unités fédérales sans sessions formelles l'omettent et rattachent leurs séances directement à la législature (parent_legislature). Session et séance peuvent aussi coïncider — une séance d'un jour d'un parlement cantonal ou une Landsgemeinde est représentée comme une session comprenant une seule séance, ou comme une session qui porte directement ses points de l'ordre du jour, sans séance.
    mixins:
      - HasIdentification
      - IsEventWithDuration
      - HasCreationModificationDates
    slots:
      - spatial
      - name
      - number
      - sequential_number
      - position
      - meeting_abbreviation
      - url
      - parent_legislature
      - meetings
      - agenda_items
      - joint_debates
      - documents

  Meeting:
    description: |
      The individual sitting of a body — the level at which agenda items are deliberated, decisions taken and speeches recorded. The meeting is the node to which the other classes of this standard attach: its agenda items (AgendaItem) are embedded in it (agenda_items), while votings and elections (Voting, Election), speeches (Speech) and the attendance list (Attendance) reference it via `parent_meeting`. At this level, scheduled and actual times regularly diverge — a sitting scheduled for 14:00 only begins at 14:25 because of delays and ends at 17:30 instead of 18:00 — which is why both the planned and the actual begin and end are recorded.
    annotations:
      description_de: |
        Die einzelne Sitzung eines Organs — die Ebene, auf der Traktanden beraten, Beschlüsse gefasst und Wortmeldungen festgehalten werden. Die Sitzung ist der Knoten, an dem die übrigen Klassen dieses Standards hängen: Ihre Traktanden (AgendaItem) sind in sie eingebettet (agenda_items), während Abstimmungen und Wahlen (Voting, Election), Wortmeldungen (Speech) sowie die Anwesenheitsliste (Attendance) über `parent_meeting` auf sie verweisen. Auf dieser Ebene fallen geplante und tatsächliche Zeiten regelmässig auseinander — eine für 14:00 angesetzte Sitzung beginnt wegen Verzögerungen erst um 14:25 und endet statt um 18:00 bereits um 17:30 —, weshalb Beginn und Ende sowohl geplant als auch tatsächlich erfasst werden.
      description_fr: |
        La séance individuelle d'un organe — le niveau auquel les points de l'ordre du jour sont délibérés, les décisions prises et les interventions consignées. La séance est le nœud auquel se rattachent les autres classes de la présente norme : ses points de l'ordre du jour (AgendaItem) y sont imbriqués (agenda_items), tandis que les votes et élections (Voting, Election), les interventions (Speech) ainsi que la liste de présence (Attendance) y renvoient via `parent_meeting`. À ce niveau, les heures prévues et les heures effectives divergent régulièrement — une séance fixée à 14h00 ne commence, en raison de retards, qu'à 14h25 et se termine à 17h30 au lieu de 18h00 —, raison pour laquelle le début et la fin sont consignés tant prévus qu'effectifs.
    mixins:
      - HasIdentification
      - IsEventWithDuration
      - HasCreationModificationDates
    slots:
      - spatial
      - administrative_id
      - name
      - url
      - group_name
      - group_id
      - number
      - landing_page
      - sequential_number
      - position
      - meeting_abbreviation
      - actor_name
      - actor_id
      - state
      - state_name
      - description
      - location
      - parent_meeting
      - parent_legislature
      - parent_session
      - documents
      - agenda_items
      - has_protocol
      - joint_debates
    slot_usage:
      actor_id:
        range: GroupReference
        inlined: true
        description: |
          Reference to the acting body/organ (lightweight snapshot at time of linking).
        annotations:
          description_de: |
            Referenz auf das handelnde Organ/Gremium (Momentaufnahme zum Zeitpunkt der Verknüpfung).
          description_fr: |
            Référence à l'organe agissant (instantané au moment de la mise en relation).
      state_name:
        description: |
          Diverging, free-text status designation of the meeting, where the values of `state` do not suffice.
        annotations:
          description_de: |
            Abweichende, freitextliche Statusbezeichnung der Sitzung, wo die Werte von `state` nicht genügen.
          description_fr: |
            Désignation de statut divergente, en texte libre, de la séance, là où les valeurs de `state` ne suffisent pas.
      documents:
        description: |
          Sitting documents such as the bulletin (Tagblatt) or annexes, as FRBR Works. The protocol is not linked here but via `has_protocol`.
        annotations:
          description_de: |
            Sitzungsunterlagen wie Tagblatt oder Beilagen, als FRBR-Works. Das Protokoll wird nicht hier, sondern über `has_protocol` verknüpft.
          description_fr: |
            Documents de séance tels que le bulletin (Tagblatt) ou les annexes, sous forme de FRBR Works. Le procès-verbal n'est pas lié ici, mais via `has_protocol`.

  IsAgendaItem:
    mixin: true
    description: |
      A mixin class that provides the elements of an agenda item: designation, type, actors, the link to the affair, state, resolution and attached texts and documents. It is used by the planned agenda item (AgendaItem) and by the recorded one (ProtocolItem), so that both carry the same elements without one depending on the other.
    annotations:
      description_de: |
        Eine Mixin-Klasse, welche die Elemente eines Traktandums bereitstellt: Bezeichnung, Art, Akteure, Bezug zum Geschäft, Status, Beschluss sowie angehängte Texte und Dokumente. Sie wird vom geplanten Traktandum (AgendaItem) und vom protokollierten (ProtocolItem) verwendet, damit beide dieselben Elemente führen, ohne dass das eine vom anderen abhängt.
      description_fr: |
        Une classe mixin qui fournit les éléments d'un point de l'ordre du jour : désignation, type, acteurs, lien avec l'affaire, état, décision ainsi que les textes et documents rattachés. Elle est utilisée par le point planifié (AgendaItem) et par le point consigné (ProtocolItem), de sorte que les deux portent les mêmes éléments sans que l'un dépende de l'autre.
    slots:
      - agenda_item_type
      - agenda_item_number
      - agenda_item_position
      - leading_actor_id
      - speaking_actor_id
      - agenda_item_title
      - affair_id
      - agenda_item_description
      - state_id
      - state_name
      - landing_page
      - url
      - agenda_item_category
      - parent_agenda_item
      - has_resolution
      - joint_debates
      - text_segments
      - documents
    slot_usage:
      documents:
        description: |
          Documents on the agenda item as FRBR Works, e.g. dispatches and reports, motions and amendments.
        annotations:
          description_de: |
            Unterlagen zum Traktandum als FRBR-Works, z.B. Botschaften und Berichte, Anträge und Änderungsanträge.
          description_fr: |
            Documents relatifs au point de l'ordre du jour, sous forme de FRBR Works, p. ex. messages et rapports, propositions et propositions d'amendement.

  AgendaItem:
    description: |
      An agenda item of a meeting as planned beforehand. It structures the agenda and connects the temporal organisation (Meeting) with the substantive affairs (eCH-0295). It is embedded in its meeting (Meeting.agenda_items) or directly in its session (Session.agenda_items). Agenda items represent the planning of a meeting and are no longer changed in the data once the meeting has started: deviations during the meeting — items brought forward, postponed or added — are recorded in the protocol (ProtocolItem) and feed into the agenda of the next meeting. For the same reason, planned and actual times are kept separately.
    annotations:
      description_de: |
        Ein vorgängig geplantes Traktandum einer Sitzung. Es gliedert die Tagesordnung und verbindet die zeitliche Organisation (Meeting) mit den inhaltlichen Geschäften (eCH-0295). Es ist in seine Sitzung eingebettet (Meeting.agenda_items) oder direkt in seine Session (Session.agenda_items). Traktanden bilden die Planung einer Sitzung ab und werden nach Sitzungsbeginn in den Daten nicht mehr geändert: Abweichungen während der Sitzung — vorgezogene, verschobene oder zusätzliche Traktanden — werden im Protokoll (ProtocolItem) erfasst und fliessen in die Traktandenliste der nächsten Sitzung ein. Aus demselben Grund werden geplante und tatsächliche Zeiten getrennt geführt.
      description_fr: |
        Un point de l'ordre du jour d'une séance, tel que planifié à l'avance. Il structure l'ordre du jour et relie l'organisation temporelle (Meeting) aux affaires matérielles (eCH-0295). Il est imbriqué dans sa séance (Meeting.agenda_items) ou directement dans sa session (Session.agenda_items). Les points de l'ordre du jour représentent la planification d'une séance et ne sont plus modifiés dans les données une fois la séance ouverte : les écarts survenus durant la séance — points avancés, reportés ou ajoutés — sont consignés au procès-verbal (ProtocolItem) et se répercutent sur l'ordre du jour de la séance suivante. Pour la même raison, les heures prévues et effectives sont tenues séparément.
    mixins:
      - HasIdentification
      - IsEventWithDuration
      - HasCreationModificationDates
      - IsAgendaItem

  Protocol:
    description: |
      The minutes of a meeting, recorded after the meeting and kept exactly once per meeting. A wrapper container bundling the agenda items actually dealt with (protocol_items), votings, elections, speeches, verbatim text segments and linked documents. The protocol has its own identifier, can be cited on its own and is usually published later than the meeting; the meeting therefore only references it (Meeting.has_protocol), and the protocol itself is delivered in Container.protocols, so that it can be delivered later without delivering the meeting again. Within the protocol the collections are embedded, because they arise and are delivered together with it. Whoever publishes votings or speeches independently of the protocol delivers them flat in Container.votings or Container.speeches and links them via parent_meeting and the respective agenda item reference.
    annotations:
      description_de: |
        Das Protokoll einer Sitzung, nach der Sitzung erstellt und pro Sitzung genau einmal geführt. Ein Wrapper-Container, der die effektiv behandelten Traktanden (protocol_items), Abstimmungen, Wahlen, Wortmeldungen, Wortlaut-Textsegmente und verknüpfte Dokumente bündelt. Das Protokoll hat einen eigenen Identifikator, ist eigenständig zitierbar und wird in der Regel später veröffentlicht als die Sitzung; die Sitzung referenziert es deshalb nur (Meeting.has_protocol), und das Protokoll selbst wird in Container.protocols geliefert, sodass es nachgeliefert werden kann, ohne die Sitzung erneut zu liefern. Innerhalb des Protokolls sind die Sammlungen eingebettet, weil sie zusammen mit ihm entstehen und geliefert werden. Wer Abstimmungen oder Wortmeldungen unabhängig vom Protokoll publiziert, liefert sie flach in Container.votings bzw. Container.speeches und verknüpft sie über parent_meeting und die jeweilige Traktandenreferenz.
      description_fr: |
        Le procès-verbal d'une séance, établi après celle-ci et tenu exactement une fois par séance. Un conteneur qui regroupe les points effectivement traités (protocol_items), les votes, les élections, les interventions, les segments de texte in extenso et les documents liés. Le procès-verbal possède son propre identifiant, peut être cité de manière autonome et est en règle générale publié après la séance ; la séance ne fait donc que le référencer (Meeting.has_protocol), et le procès-verbal lui-même est livré dans Container.protocols, de sorte qu'il puisse être livré ultérieurement sans relivrer la séance. À l'intérieur du procès-verbal, les collections sont imbriquées, car elles naissent et sont livrées avec lui. Qui publie des votes ou des interventions indépendamment du procès-verbal les livre à plat dans Container.votings ou Container.speeches et les relie par parent_meeting et la référence au point de l'ordre du jour correspondante.
    mixins:
      - HasIdentification
      - HasCreationModificationDates
    slots:
      - parent_meeting
      - protocol_items
      - votings
      - elections
      - speeches
      - text_segments
      - documents

  ProtocolItem:
    description: |
      An agenda item as actually recorded in the protocol. It carries the same elements as AgendaItem through the IsAgendaItem mixin, but is a class in its own right: the record is not a special case of the plan. It arises independently and may contain items that were never put on the agenda, just as the agenda may contain items that were never dealt with.
    annotations:
      description_de: |
        Ein Traktandum, wie es im Protokoll tatsächlich festgehalten wurde. Es führt über das Mixin IsAgendaItem dieselben Elemente wie AgendaItem, ist aber eine eigenständige Klasse: Das Protokollierte ist kein Sonderfall des Geplanten. Es entsteht unabhängig und kann Traktanden enthalten, die nie traktandiert waren, so wie die Traktandenliste Punkte enthalten kann, die nie behandelt wurden.
      description_fr: |
        Un point de l'ordre du jour tel qu'il a effectivement été consigné au procès-verbal. Il porte les mêmes éléments qu'AgendaItem par le mixin IsAgendaItem, mais constitue une classe à part entière : le point consigné n'est pas un cas particulier du point planifié. Il naît indépendamment et peut comprendre des points jamais mis à l'ordre du jour, de même que l'ordre du jour peut comprendre des points jamais traités.
    mixins:
      - HasIdentification
      - IsEventWithDuration
      - HasCreationModificationDates
      - IsAgendaItem

  JointDebate:
    description: |
      A joint debate: several agenda items are deliberated together, for instance substantively related affairs dealt with in a single debate. The joint debate hangs on an agenda item (AgendaItem), a protocol item (ProtocolItem), a meeting (Meeting) or a session (Session) and references the items debated jointly by their identifiers. Attached to a meeting or a session, it can also bring together agenda items that are distributed over several agenda positions or meetings.
    annotations:
      description_de: |
        Eine gemeinsame Beratung: Mehrere Traktanden werden zusammen behandelt, etwa inhaltlich zusammenhängende Geschäfte, die in einer einzigen Debatte beraten werden. Die gemeinsame Beratung hängt an einem Traktandum (AgendaItem), einem Protokoll-Traktandum (ProtocolItem), einer Sitzung (Meeting) oder einer Session (Session) und verweist über deren Identifikatoren auf die gemeinsam behandelten Traktanden. An einer Sitzung oder Session angehängt, kann sie auch Traktanden zusammenfassen, die auf mehrere Traktandenpositionen oder Sitzungen verteilt sind.
      description_fr: |
        Une délibération commune : plusieurs points de l'ordre du jour sont traités ensemble, par exemple des affaires connexes délibérées dans un seul et même débat. La délibération commune est rattachée à un point de l'ordre du jour (AgendaItem), à un point du procès-verbal (ProtocolItem), à une séance (Meeting) ou à une session (Session) et renvoie, par leurs identifiants, aux points traités conjointement. Rattachée à une séance ou à une session, elle peut aussi réunir des points répartis sur plusieurs positions de l'ordre du jour ou sur plusieurs séances.
    slots:
      - joint_agenda_item_ids

  Resolution:
    description: |
      The formal decision taken on an agenda item, including the voting procedures applied. It records what was decided, whereas Voting records how it was decided (procedure and vote ratio). Not every decision rests on a formal vote: noting a report, tacit acceptance or administrative decisions come about without one.
    annotations:
      description_de: |
        Der formale Beschluss zu einem Traktandum, einschliesslich der angewandten Abstimmungsverfahren. Er hält fest, was entschieden wurde, während Voting festhält, wie entschieden wurde (Verfahren und Stimmenverhältnis). Nicht jeder Beschluss beruht auf einer formalen Abstimmung: Kenntnisnahmen, stille Annahmen oder Administrativbeschlüsse kommen ohne eine solche zustande.
      description_fr: |
        La décision formelle prise sur un point de l'ordre du jour, y compris les procédures de vote appliquées. Elle retient ce qui a été décidé, tandis que Voting retient comment il a été décidé (procédure et rapport de voix). Toute décision ne repose pas sur un vote formel : les prises de connaissance, les adoptions tacites ou les décisions administratives interviennent sans vote.
    slots:
      - resolution_type
      - type_label
      - vote_procedures
      - documents

  Voting: # Abstimmung
    description: |
      A voting on a substantive question: the subject (question), the procedure, the result with its vote ratio and — for open votings — the individual votes of the members. A voting is held in the course of the sitting and is therefore anchored in the protocol (parent_protocol, parent_protocol_item); it is also linked to the meeting (parent_meeting) and to the affair (affair_id). The presiding member does not take part in votings but casts the deciding vote in case of a tie (tie_breaker). The categorical decision (accepted, rejected, noted …) is not held on the voting but in the Resolution of the agenda item.
    annotations:
      description_de: |
        Eine Abstimmung über eine Sachfrage: der Abstimmungsgegenstand (Frage), das Verfahren, das Ergebnis mit dem Stimmenverhältnis und — bei offenen Abstimmungen — die Einzelstimmen der Mitglieder. Abgestimmt wird im Verlauf der Sitzung, weshalb die Abstimmung im Protokoll verankert ist (parent_protocol, parent_protocol_item); zudem ist sie mit der Sitzung (parent_meeting) und dem Geschäft (affair_id) verknüpft. Die Präsidentin oder der Präsident nimmt an Abstimmungen nicht teil, fällt bei Stimmengleichheit aber den Stichentscheid (tie_breaker). Der kategorische Entscheid (angenommen, abgelehnt, Kenntnisnahme …) wird nicht auf der Abstimmung, sondern in der Resolution des Traktandums festgehalten.
      description_fr: |
        Un vote sur une question matérielle : l'objet du vote (la question), la procédure, le résultat avec le rapport de voix et — pour les votes ouverts — les voix individuelles des membres. Le vote a lieu au cours de la séance et est donc rattaché au procès-verbal (parent_protocol, parent_protocol_item) ; il est en outre lié à la séance (parent_meeting) et à l'affaire (affair_id). La présidente ou le président ne participe pas aux votes, mais départage en cas d'égalité des voix (tie_breaker). La décision catégorielle (adopté, rejeté, pris acte …) n'est pas retenue sur le vote, mais dans la Resolution du point de l'ordre du jour.
    mixins:
      - HasIdentification
      - HasCreationModificationDates
    slots:
      - datetime_begin
      - datetime_end
      - voting_type
      - type_label
      - voting_title
      - optional
      - landing_page
      - label_yes
      - label_no
      - label_abstention
      - tie_breaker
      - total_count_yes
      - total_count_no
      - total_count_abstention
      - total_other
      - total_absent
      - total
      - majority_type
      - majority_count
      - result_text
      - parent_meeting
      - parent_protocol
      - parent_protocol_item
      - affair_id
      - actor_id
      - documents
    slot_usage:
      actor_id:
        range: GroupReference
        inlined: true
        description: |
          Reference to the acting body/organ (lightweight snapshot at time of linking).
        annotations:
          description_de: |
            Referenz auf das handelnde Organ/Gremium (Momentaufnahme zum Zeitpunkt der Verknüpfung).
          description_fr: |
            Référence à l'organe agissant (instantané au moment de la mise en relation).

# Handling Präsidiums-Votum wird als eigenes voting aufgenommen


  IndividualVote: # Einzelstimme  / vote individuel
    description: |
      The vote cast by an individual member in a voting. Individual votes are only recorded for open votings; for secret votings only the overall result is published. An individual vote concerns one specific voting and differs from attendance (Attendance), which records presence at the meeting as a whole: a member present at the meeting may be recorded as not_voted in a single voting, for instance because they briefly left the room.
    annotations:
      description_de: |
        Die Stimme, die ein einzelnes Mitglied in einer Abstimmung abgibt. Einzelstimmen werden nur bei offenen Abstimmungen erfasst; bei geheimen Abstimmungen wird nur das Gesamtergebnis publiziert. Eine Einzelstimme betrifft eine bestimmte Abstimmung und unterscheidet sich von der Anwesenheit (Attendance), welche die Präsenz an der Sitzung als Ganzes festhält: Ein an der Sitzung anwesendes Mitglied kann bei einer einzelnen Abstimmung mit not_voted erfasst werden, etwa weil es kurz den Saal verlassen hat.
      description_fr: |
        La voix exprimée par un membre lors d'un vote. Les voix individuelles ne sont saisies que pour les votes ouverts ; pour les votes secrets, seul le résultat global est publié. Une voix individuelle concerne un vote déterminé et se distingue de la présence (Attendance), qui retient la présence à la séance dans son ensemble : un membre présent à la séance peut être saisi avec not_voted lors d'un vote particulier, par exemple parce qu'il a brièvement quitté la salle.
    mixins:
      - HasIdentification
      - HasCreationModificationDates
    slots:
      - parent_voting
      - actor_id
      - seat_nr
      - weight
      - individual_vote_type
      - type_label
    slot_usage:
      actor_id:
        description: |
          The member who cast the vote, as a reference to a person according to eCH-0294.
        annotations:
          description_de: |
            Das Mitglied, das die Stimme abgegeben hat, als Referenz auf eine Person gemäss eCH-0294.
          description_fr: |
            Le membre qui a exprimé la voix, sous forme de référence à une personne selon eCH-0294.

  Election: # Wahl
    description: |
      An election in which a parliamentary body appoints one or several persons to an office or function. Unlike a voting (Voting), which decides substantive questions, an election is a decision on persons: it is often held by secret ballot and usually requires an absolute majority, whereas votings are mostly open. The presiding member, who does not take part in votings, does vote in elections. Each ballot is recorded as a separate election; the ballots of one election are linked through the common agenda item — for instance a first ballot requiring an absolute majority that remains without result, followed by a second ballot in which the relative majority suffices.
    annotations:
      description_de: |
        Eine Wahl, mit der ein parlamentarisches Organ eine oder mehrere Personen für ein Amt oder eine Funktion bestimmt. Im Unterschied zur Abstimmung (Voting), die über Sachfragen entscheidet, ist die Wahl ein Personenentscheid: Sie erfolgt oft geheim und erfordert meist das absolute Mehr, während Abstimmungen meist offen sind. Die Präsidentin oder der Präsident, die an Abstimmungen nicht teilnehmen, stimmen bei Wahlen mit. Jeder Wahlgang wird als eigene Wahl erfasst; die Wahlgänge einer Wahl sind über das gemeinsame Traktandum verbunden — etwa ein erster Wahlgang mit absolutem Mehr, der ohne Ergebnis bleibt, und ein zweiter Wahlgang, in dem das relative Mehr genügt.
      description_fr: |
        Une élection par laquelle un organe parlementaire désigne une ou plusieurs personnes à une charge ou à une fonction. Contrairement au vote (Voting), qui tranche des questions matérielles, l'élection est une décision portant sur des personnes : elle a souvent lieu au scrutin secret et requiert en général la majorité absolue, alors que les votes sont le plus souvent ouverts. La présidente ou le président, qui ne participe pas aux votes, prend part aux élections. Chaque tour de scrutin est saisi comme une élection distincte ; les tours d'une même élection sont reliés par le point de l'ordre du jour commun — par exemple un premier tour à la majorité absolue resté sans résultat, suivi d'un second tour où la majorité relative suffit.
    mixins:
      - HasIdentification
      - HasCreationModificationDates
    slots:
      - datetime_begin
      - datetime_end
      - election_type
      - type_label
      - title
      - landing_page
      - total_absent
      - total
      - majority_type
      - majority_count
      - result_text
      - parent_meeting
      - parent_protocol
      - parent_protocol_item
      - affair_id
      - actor_id
      - documents
    slot_usage:
      actor_id:
        range: GroupReference
        inlined: true
        description: |
          Reference to the acting body/organ (lightweight snapshot at time of linking).
        annotations:
          description_de: |
            Referenz auf das handelnde Organ/Gremium (Momentaufnahme zum Zeitpunkt der Verknüpfung).
          description_fr: |
            Référence à l'organe agissant (instantané au moment de la mise en relation).
      title:
        description: |
          Title of the election, e.g. "Wahl Kommissionspräsidium WAK".
        annotations:
          description_de: |
            Titel der Wahl, z.B. „Wahl Kommissionspräsidium WAK“.
          description_fr: |
            Titre de l'élection, p. ex. « Élection à la présidence de la CER ».

  Attendance:
    description: |
      Aggregated attendance record for a meeting (number of members present, absent, excused).
    annotations:
      description_de: |
        Aggregierte Anwesenheitsliste für eine Sitzung (Anzahl Anwesende, Abwesende, Entschuldigte).
      description_fr: |
        Liste de présence agrégée pour une séance (nombre de membres présents, absents, excusés).
    mixins:
      - HasIdentification
      - HasCreationModificationDates
    slots:
      - parent_meeting
      - datetime_begin
      - actor_id
      - total_count
      - total_present
      - total_absent
      - total_excused
    slot_usage:
      actor_id:
        range: GroupReference
        inlined: true
        description: |
          Reference to the acting body/organ (lightweight snapshot at time of linking).
        annotations:
          description_de: |
            Referenz auf das handelnde Organ/Gremium (Momentaufnahme zum Zeitpunkt der Verknüpfung).
          description_fr: |
            Référence à l'organe agissant (instantané au moment de la mise en relation).

  IndividualAttendance:
    description: |
      Individual attendance record for a specific person at a meeting (linked via the parent Attendance aggregate).
    annotations:
      description_de: |
        Einzelne Anwesenheitsfeststellung einer Person an einer Sitzung (verknüpft über das übergeordnete Attendance-Aggregat).
      description_fr: |
        Constatation individuelle de la présence d'une personne à une séance (rattachée à l'agrégat Attendance parent).
    mixins:
      - HasIdentification
      - HasCreationModificationDates
    slots:
      - parent_attendance
      - actor_id
      - attendance_type
      - reason

  Speech:
    description: |
      A speech or statement made during a meeting (also called Votum or speaker segment).
    annotations:
      description_de: |
        Eine Wortmeldung während einer Sitzung (auch Votum oder Redebeitrag genannt).
      description_fr: |
        Une intervention prononcée au cours d'une séance (également appelée prise de parole).
    mixins:
      - HasIdentification
      - HasCreationModificationDates
    slots:
      - parent_meeting
      - parent_agenda_item
      - language
      - start
      - datetime_begin
      - datetime_end
      - actor_fullname
      - actor_id
      - role
      - text
      - text_format
      - text_type
      - landing_page
      - media_url
      - media_type
      - media_format
      - documents

  TextSegment:
    description: |
      A text segment such as cross-references or subtitles. Text segments are carried by the protocol, by a speech or by an agenda item (planned AgendaItem or recorded ProtocolItem).
    annotations:
      description_de: |
        Ein Textsegment wie Querverweise oder Zwischentitel. Textsegmente werden am Protokoll, an einer Wortmeldung oder an einem Traktandum geführt (geplantes AgendaItem oder protokolliertes ProtocolItem).
      description_fr: |
        Un segment de texte tel qu'un renvoi ou un intertitre. Les segments de texte sont portés par le procès-verbal, par une intervention ou par un point de l'ordre du jour (AgendaItem planifié ou ProtocolItem consigné).
    mixins:
      - HasIdentification
    slots:
      - text

  Motion:
    description: |
      A formal proposal submitted during the proceedings, such as an amendment to a legal text, a procedural motion (e.g. closure of the debate) or a motion to refer back. It is an entity in its own right because an agenda item may contain several motions, each with its own course (submitted, supported, voted on) and possibly a vote of its own.
    annotations:
      description_de: |
        Ein formaler Antrag, der während der Beratung gestellt wird, etwa ein Änderungsantrag zu einem Gesetzestext, ein Ordnungsantrag (z.B. Schluss der Debatte) oder ein Rückweisungsantrag. Er ist eine eigene Entität, weil ein Traktandum mehrere Anträge enthalten kann, die je einen eigenen Verlauf haben (gestellt, unterstützt, abgestimmt) und gegebenenfalls einzeln abgestimmt werden.
      description_fr: |
        Une proposition formelle déposée au cours des délibérations, par exemple une proposition d'amendement à un texte légal, une motion d'ordre (p. ex. clôture du débat) ou une proposition de renvoi. Elle constitue une entité propre, car un point de l'ordre du jour peut comprendre plusieurs propositions, chacune ayant son propre déroulement (déposée, soutenue, mise aux voix) et, le cas échéant, son propre vote.
    mixins:
      - HasIdentification
    slots:
      - title
      - description
      - documents
    slot_usage:
      title:
        description: |
          Short title of the motion.
        annotations:
          description_de: |
            Kurztitel des Antrags.
          description_fr: |
            Titre abrégé de la proposition.
      description:
        description: |
          Full text of the motion.
        annotations:
          description_de: |
            Vollständiger Antragstext.
          description_fr: |
            Texte intégral de la proposition.

  Media:
    description: |
      Media files or documents (including protocols in PDF/HTML/WORD or links to audio/video).
    annotations:
      description_de: |
        Mediendateien oder Dokumente (einschliesslich Protokolle in PDF/HTML/WORD oder Links zu Audio/Video).
      description_fr: |
        Fichiers médias ou documents (y compris les procès-verbaux en PDF/HTML/WORD ou les liens vers des contenus audio/vidéo).
    mixins:
      - HasIdentification
    slots:
      - title
      - media_type
      - url
      - version
      - parent_type

  TotalOther:
    description: |
      Vote count for one option of a multiple-choice voting. If several proposals pointing in the same direction are put to the vote at the same time, the members vote on more than two variants and the variant with most votes prevails (in Zurich colloquially a „Cup-Abstimmung“, cast via several voting buttons). Such a voting is represented with voting_type other and a descriptive type_label; total_count_yes, total_count_no and total_count_abstention remain empty, and each option receives an entry with count and label. Example: Gemeinderat of the City of Zurich, sitting of 28 February 2024, affair 2023/361, four options with 75, 25, 12 and 0 votes.
    annotations:
      description_de: |
        Stimmenzahl für eine Option einer Auswahlabstimmung. Liegen zu derselben Sachfrage mehrere gleichgerichtete Anträge vor, stimmen die Mitglieder über mehr als zwei Varianten gleichzeitig ab, und es obsiegt die Variante mit den meisten Stimmen (in Zürich umgangssprachlich „Cup-Abstimmung“, technisch über mehrere Abstimmungsknöpfe). Eine solche Abstimmung wird mit voting_type other und einem sprechenden type_label abgebildet; total_count_yes, total_count_no und total_count_abstention bleiben leer, und jede Option erhält einen Eintrag mit count und label. Beispiel: Gemeinderat der Stadt Zürich, Sitzung vom 28. Februar 2024, Geschäft 2023/361, vier Optionen mit 75, 25, 12 und 0 Stimmen.
      description_fr: |
        Nombre de voix pour une option d'un vote à choix multiple. Lorsque plusieurs propositions de même sens portent sur la même question, les membres votent simultanément sur plus de deux variantes, et la variante qui obtient le plus de voix l'emporte (à Zurich, familièrement « Cup-Abstimmung », au moyen de plusieurs boutons de vote). Un tel vote est représenté avec voting_type other et un type_label explicite ; total_count_yes, total_count_no et total_count_abstention restent vides, et chaque option reçoit une entrée avec count et label. Exemple : Gemeinderat de la Ville de Zurich, séance du 28 février 2024, affaire 2023/361, quatre options avec 75, 25, 12 et 0 voix.
    slots:
      - count
      - label

  MultilingualString:
    description: |
      A string that can contain text in multiple languages.
    annotations:
      description_de: |
        Ein String, der Text in mehreren Sprachen enthalten kann.
      description_fr: |
        Une chaîne de caractères pouvant contenir du texte en plusieurs langues.
    slots:
      - text
      - language
    slot_usage:
      language:
        required: true

slots:

  administrative_id:
    description: |
      Administrative ID of the legislative body, such as a municipality, canton, or country.
    annotations:
      description_de: |
        Verwaltungs-ID des gesetzgebenden Körpers, wie z.B. Gemeinde, Kanton oder Land.
      description_fr: |
        Identifiant administratif du corps législatif, p. ex. commune, canton ou pays.

  actor_id:
    description: |
      Reference to the acting person (lightweight snapshot at time of linking).
    annotations:
      description_de: |
        Referenz auf die handelnde Person (Momentaufnahme zum Zeitpunkt der Verknüpfung).
      description_fr: |
        Référence à la personne agissante (instantané au moment de la mise en relation).
    range: PersonReference
    inlined: true

  spatial:
    description: |
      Spatial reference to a LINDAS resource (fos-municipality number, fos-canton number, district, or country). Formats: municipality: https://ld.admin.ch/municipality/1234, district: https://ld.admin.ch/district/2301, canton: https://ld.admin.ch/canton/23, country: https://ld.admin.ch/country/CHE.
    annotations:
      description_de: |
        Räumliche Referenz auf eine LINDAS-Ressource (BFS-Gemeindenummer, BFS-Kantonsnummer, Bezirk oder Land). Formate: Gemeinde: https://ld.admin.ch/municipality/1234, Bezirk: https://ld.admin.ch/district/2301, Kanton: https://ld.admin.ch/canton/23, Bund: https://ld.admin.ch/country/CHE.
      description_fr: |
        Référence spatiale à une ressource LINDAS (numéro OFS de commune, numéro OFS de canton, district ou pays). Formats : commune : https://ld.admin.ch/municipality/1234, district : https://ld.admin.ch/district/2301, canton : https://ld.admin.ch/canton/23, pays : https://ld.admin.ch/country/CHE.
    # Wortgleich mit `spatial` in eCH-0294: dieselbe Raumeinheit, damit ein
    # Ratsbetrieb und die Akteure, die ihn tragen, auf dieselbe LINDAS-Ressource
    # zeigen. Festgehalten wird der Namensraum, nicht die Stellenzahl der Nummer.
    pattern: ^https://ld\.admin\.ch/(country/[A-Z]{3}|canton/[0-9]+|district/[0-9]+|municipality/[0-9]+)$

  type_label:
    description: |
      Custom type label when standard type values don't apply.
    annotations:
      description_de: |
        Benutzerdefinierte Typbezeichnung, wenn Standardtypwerte nicht zutreffen.
      description_fr: |
        Libellé de type personnalisé lorsque les valeurs de type standard ne s'appliquent pas.

  voting_type:
    description: |
      Type of voting procedure (preliminary, final, secret, etc.).
    annotations:
      description_de: |
        Art des Abstimmungsverfahrens (Zwischen-, Schlussabstimmung, geheim, etc.).
      description_fr: |
        Type de procédure de vote (vote intermédiaire, vote final, vote secret, etc.).
    range: VotingTypeEnum

  voting_title:
    description: |
      Title or question being voted on. If no specific subject exists, do not use the business item title.
    annotations:
      description_de: |
        Abstimmungstitel bzw. Gegenstand oder Frage. Wenn kein Gegenstand vorhanden ist, sollte nicht der Geschäftstitel verwendet werden.
      description_fr: |
        Titre du vote, objet ou question soumise au vote. En l'absence d'objet propre, il ne faut pas reprendre le titre de l'affaire.
    range: MultilingualString
    multivalued: true
    inlined_as_list: true

  resolution_type:
    description: |
      Type of resolution taken on the agenda item.
    annotations:
      description_de: |
        Art der Resolution zum Traktandum.
      description_fr: |
        Type de décision prise sur le point de l'ordre du jour.
    range: ResolutionTypeEnum

  individual_vote_type:
    description: |
      Type of vote cast (yes, no, abstention, no vote, etc.).
    annotations:
      description_de: |
        Art der abgegebenen Stimme (Ja, Nein, Enthaltung, nicht abgestimmt, etc.).
      description_fr: |
        Type de voix exprimée (oui, non, abstention, n'a pas voté, etc.).
    range: IndividualVoteTypeEnum

  agenda_item_type:
    description: |
      Type of agenda item, distinguishing individual items from groups.
    annotations:
      description_de: |
        Art des Traktandums, unterscheidet Einzeltraktanden von Traktandengruppen.
      description_fr: |
        Type de point de l'ordre du jour, distinguant les points isolés des groupes de points.
    range: AgendaItemTypeEnum

  agenda_item_number:
    description: |
      Number of the agenda item on the agenda, e.g. "2.1" or "3" (string type to also support roman numerals).
    annotations:
      description_de: |
        Nummer des Traktandums auf der Traktandenliste, z.B. „2.1“ oder „3“ (Zeichenkette, damit auch römische Ziffern möglich sind).
      description_fr: |
        Numéro du point sur l'ordre du jour, p. ex. « 2.1 » ou « 3 » (chaîne de caractères, afin de permettre aussi les chiffres romains).
    range: string

  agenda_item_position:
    description: |
      Integer position of the agenda item in the meeting sequence, used for sorting and display.
    annotations:
      description_de: |
        Ganzzahlige Position des Traktandums im Sitzungsablauf, massgebend für Sortierung und Darstellung.
      description_fr: |
        Position entière du point dans le déroulement de la séance, déterminante pour le tri et l'affichage.
    range: integer

  agenda_item_title:
    description: |
      Title of the agenda item.
    annotations:
      description_de: |
        Titel des Traktandums.
      description_fr: |
        Titre du point de l'ordre du jour.
    range: MultilingualString
    multivalued: true
    inlined_as_list: true

  agenda_item_description:
    description: |
      Subtitle or detailed description of the agenda item.
    annotations:
      description_de: |
        Untertitel oder ausführliche Beschreibung des Traktandums.
      description_fr: |
        Sous-titre ou description détaillée du point de l'ordre du jour.
    range: MultilingualString
    multivalued: true
    inlined_as_list: true

  agenda_item_category:
    description: |
      Free categorisation of the agenda item by content or grouping, e.g. "Gesetzgebung", "Budget und Finanzen", "Interpellationen und Anfragen", "Wahlen", by department, or introductory and technical items. The categorisation is not standardised and may vary between federal units.
    annotations:
      description_de: |
        Freie Kategorisierung des Traktandums nach Inhalt oder Gruppierung, z.B. „Gesetzgebung“, „Budget und Finanzen“, „Interpellationen und Anfragen“, „Wahlen“, nach Departement oder einleitende und technische Traktanden. Die Kategorisierung ist nicht standardisiert und kann je nach Föderaleinheit variieren.
      description_fr: |
        Catégorisation libre du point selon son contenu ou son regroupement, p. ex. « Législation », « Budget et finances », « Interpellations et questions », « Élections », par département, ou points introductifs et techniques. La catégorisation n'est pas standardisée et peut varier selon l'unité fédérale.
    range: string

  sequential_number:
    description: |
      Sequential number of the session or meeting as an integer, used for ordering.
    annotations:
      description_de: |
        Laufende Nummer der Session oder Sitzung als Ganzzahl, die zur Sortierung verwendet wird.
      description_fr: |
        Numéro d'ordre de la session ou de la séance sous forme de nombre entier, utilisé pour le tri.
    range: integer

  actor_name:
    description: |
      Name of the political body in plain text (e.g., Nationalrat), in addition to the reference `actor_id`.
    annotations:
      description_de: |
        Name des politischen Organs im Klartext (z.B. Nationalrat), zusätzlich zur Referenz `actor_id`.
      description_fr: |
        Nom de l'organe politique en clair (p. ex. Conseil national), en complément de la référence `actor_id`.
    range: string

  state_name:
    description: |
      Diverging, free-text status designation, where the status enumeration does not suffice.
    annotations:
      description_de: |
        Abweichende, freitextliche Statusbezeichnung, wo die Status-Aufzählung nicht genügt.
      description_fr: |
        Désignation de statut divergente, en texte libre, là où l'énumération des statuts ne suffit pas.
    range: string

  parent_meeting:
    description: |
      Identifier of the meeting this record belongs to. On a meeting it names the superordinate meeting; on a voting, election, speech, attendance list or protocol it names the meeting in which the record arose. Agenda items do not carry it: they are embedded in their meeting.
    annotations:
      description_de: |
        Identifikator der Sitzung, zu der dieser Eintrag gehört. Bei einer Sitzung bezeichnet er die übergeordnete Sitzung, bei Abstimmung, Wahl, Wortmeldung, Anwesenheitsliste oder Protokoll die Sitzung, in der der Eintrag entstanden ist. Traktanden führen ihn nicht: Sie sind in ihre Sitzung eingebettet.
      description_fr: |
        Identifiant de la séance à laquelle cet enregistrement se rattache. Pour une séance, il désigne la séance supérieure ; pour un vote, une élection, une intervention, une liste de présence ou un procès-verbal, la séance au cours de laquelle l'enregistrement est né. Les points de l'ordre du jour ne le portent pas : ils sont imbriqués dans leur séance.
    range: string

  parent_legislature:
    description: |
      Identifier of the legislature to which the session or meeting belongs. A meeting that belongs to a session is assigned to the legislature through the session (parent_session); a meeting without a session — for instance a committee sitting or a sitting in a federal unit without formal sessions — refers to the legislature directly.
    annotations:
      description_de: |
        Identifikator der Legislaturperiode, zu der die Session oder Sitzung gehört. Eine Sitzung, die zu einer Session gehört, ist über die Session (parent_session) der Legislaturperiode zugeordnet; eine Sitzung ohne Session — etwa eine Kommissionssitzung oder eine Sitzung in einer Föderaleinheit ohne formale Sessionen — verweist direkt auf die Legislaturperiode.
      description_fr: |
        Identifiant de la législature à laquelle la session ou la séance appartient. Une séance qui fait partie d'une session est rattachée à la législature par la session (parent_session) ; une séance sans session — par exemple une séance de commission ou une séance dans une unité fédérale sans sessions formelles — renvoie directement à la législature.

  parent_session:
    description: |
      Identifier of the session to which the meeting belongs.
    annotations:
      description_de: |
        Identifikator der Session, zu der die Sitzung gehört.
      description_fr: |
        Identifiant de la session à laquelle la séance appartient.
    range: string

  leading_actor_id:
    description: |
      The leading department for the agenda item.
    annotations:
      description_de: |
        Das federführende Departement für das Traktandum.
      description_fr: |
        Le département responsable du point de l'ordre du jour.
    range: string

  speaking_actor_id:
    description: |
      The speaker or head of the department for the agenda item.
    annotations:
      description_de: |
        Der Sprecher oder die Sprecherin bzw. die Departementsvorsteherin oder der Departementsvorsteher für das Traktandum.
      description_fr: |
        La ou le porte-parole ou la cheffe ou le chef du département pour le point de l'ordre du jour.

  name:
    description: |
      Multilingual full designation.
    annotations:
      description_de: |
        Mehrsprachige vollständige Bezeichnung.
      description_fr: |
        Désignation complète multilingue.
    range: MultilingualString
    multivalued: true
    inlined_as_list: true

  vote_procedures:
    description: |
      Procedures by which the vote was taken. Open procedures: show of hands, standing, electronic voting, roll call, and in crisis situations remote voting (votes communicated to the presidency beforehand and recorded together with the vote in the chamber), circulation procedure or voting in virtual sittings. Secret procedures: secret ballot with ballot papers, electronic secret voting. The procedure determines whether individual votes can be recorded.
    annotations:
      description_de: |
        Verfahren, in denen abgestimmt wurde. Offene Verfahren: Handzeichen, Aufstehen, elektronische Abstimmung, Namensaufruf, in Krisenlagen zudem externe Stimmabgabe (vorgängig dem Präsidium mitgeteilte Stimmen, die zusammen mit der Abstimmung im Rat erfasst werden), Zirkulationsverfahren oder Stimmabgabe an virtuellen Sitzungen. Geheime Verfahren: Stimmzettel, elektronische geheime Abstimmung. Das Verfahren bestimmt, ob Einzelstimmen erfasst werden können.
      description_fr: |
        Procédures selon lesquelles le vote a eu lieu. Procédures ouvertes : main levée, assis-debout, vote électronique, appel nominal et, en situation de crise, vote à distance (voix communiquées à l'avance à la présidence et saisies en même temps que le vote au conseil), procédure par voie de circulation ou vote lors de séances virtuelles. Procédures secrètes : bulletin de vote, vote électronique secret. La procédure détermine si les voix individuelles peuvent être saisies.
    range: string
    multivalued: true
    inlined_as_list: true

  affair_id:
    description: |
      Identifier of the affair (eCH-0295) the record refers to. Administrative agenda items (e.g. approval of the minutes) have no affair. An affair usually runs through several agenda items — in legislation, for instance, the debate on entering into the matter, the detailed deliberation, the final vote and, where applicable, the procedure for resolving differences between the chambers.
    annotations:
      description_de: |
        Identifikator des Geschäfts (eCH-0295), auf das sich der Eintrag bezieht. Administrative Traktanden (z.B. Genehmigung des Protokolls) haben kein Geschäft. Ein Geschäft durchläuft in der Regel mehrere Traktanden — in der Gesetzgebung etwa Eintretensdebatte, Detailberatung, Schlussabstimmung und gegebenenfalls die Differenzbereinigung zwischen den Räten.
      description_fr: |
        Identifiant de l'affaire (eCH-0295) à laquelle se rapporte l'enregistrement. Les points administratifs (p. ex. approbation du procès-verbal) n'ont pas d'affaire. Une affaire passe en règle générale par plusieurs points de l'ordre du jour — dans la législation, par exemple, le débat d'entrée en matière, la discussion par article, le vote final et, le cas échéant, la procédure d'élimination des divergences entre les conseils.
    range: string

  state_id:
    description: |
      State identifier of the agenda item (reference to a state enumeration or a custom state), e.g. pending (not yet dealt with), in_progress, completed, postponed (to a later meeting) or withdrawn.
    annotations:
      description_de: |
        Zustands-Identifikator des Traktandums (Verweis auf ein Status-Enum oder auf einen eigenen Zustand), z.B. pending (noch nicht behandelt), in_progress (in Beratung), completed (abgeschlossen), postponed (auf eine spätere Sitzung vertagt) oder withdrawn (zurückgezogen).
      description_fr: |
        Identifiant d'état du point (renvoi à une énumération des états ou à un état propre), p. ex. pending (pas encore traité), in_progress (en délibération), completed (traité), postponed (renvoyé à une séance ultérieure) ou withdrawn (retiré).
    range: string

  datetime_begin:
    range: datetime
    description: |
      The date and time when the meeting or voting begins.
    annotations:
      description_de: |
        Das Datum und die Uhrzeit, zu der die Sitzung oder Abstimmung beginnt.
      description_fr: |
        La date et l'heure auxquelles la séance ou le vote commence.

  datetime_end:
    range: datetime
    description: |
      The date and time when the meeting or voting ends.
    annotations:
      description_de: |
        Das Datum und die Uhrzeit, zu der die Sitzung oder Abstimmung endet.
      description_fr: |
        La date et l'heure auxquelles la séance ou le vote se termine.

  optional:
    range: boolean
    description: |
      Indicates if the meeting or voting is optional.
    annotations:
      description_de: |
        Gibt an, ob die Sitzung oder Abstimmung optional ist.
      description_fr: |
        Indique si la séance ou le vote est facultatif.

  agenda_item_ids:
    description: |
      The agenda items associated with the voting.
    annotations:
      description_de: |
        Die Traktanden, die mit der Abstimmung verbunden sind.
      description_fr: |
        Les points de l'ordre du jour associés au vote.
    range: string
    multivalued: true
    inlined_as_list: true

  seat_nr:
    description: |
      The seat number of the individual vote, if applicable.
    annotations:
      description_de: |
        Die Sitznummer der Einzelstimme, falls zutreffend.
      description_fr: |
        Le numéro de siège correspondant à la voix individuelle, le cas échéant.
    range: string

  weight:
    description: |
      Voting weight of the member; normally 1. Other values arise, for instance, where a member also votes for an absent member (proxy, weight 2), in communal assemblies where legal entities hold several votes, or in historical systems in which different groups of persons had different voting weights.
    annotations:
      description_de: |
        Stimmgewicht des Mitglieds; im Normalfall 1. Andere Werte kommen etwa vor, wo ein Mitglied für ein abwesendes Mitglied mitstimmt (Stellvertretung, Gewicht 2), an Gemeindeversammlungen, an denen juristische Personen mehrere Stimmen haben, oder in historischen Systemen, in denen verschiedene Personengruppen unterschiedliches Stimmgewicht hatten.
      description_fr: |
        Poids de la voix du membre ; normalement 1. D'autres valeurs se présentent par exemple lorsqu'un membre vote aussi pour un membre absent (représentation, poids 2), dans les assemblées communales où des personnes morales disposent de plusieurs voix, ou dans des systèmes historiques où différents groupes de personnes avaient un poids de voix différent.
    range: integer

  count:
    description: |
      The count of votes for the total other category.
    annotations:
      description_de: |
        Die Anzahl der Stimmen für die Kategorie „Andere“.
      description_fr: |
        Le nombre de voix pour la catégorie « autres ».
    range: integer

  parent_voting:
    slot_uri: ops:parentVoting
    description: |
      The ID of the voting associated with the individual vote.
    annotations:
      description_de: |
        Die ID der Abstimmung, die mit der Einzelstimme verbunden ist.
      description_fr: |
        L'identifiant du vote auquel se rattache la voix individuelle.
    range: Voting

  parent_attendance:
    slot_uri: ops:parentAttendance
    description: |
      The Attendance aggregate this individual attendance record belongs to.
    annotations:
      description_de: |
        Das Attendance-Aggregat, zu dem dieser einzelne Anwesenheits-Eintrag gehört.
      description_fr: |
        L'agrégat Attendance auquel appartient cette constatation individuelle de présence.
    range: Attendance

  parent_agenda_item:
    description: |
      Identifier of the agenda item this record belongs to. On an agenda item it builds a hierarchy of agenda items — e.g. an item group "Gesetzesberatungen" with the sub-items "Energiegesetz (Detailberatung)" and "Energiegesetz (Schlussabstimmung)"; on a speech it names the agenda item under which the speech was given.
    annotations:
      description_de: |
        Identifikator des Traktandums, zu dem dieser Eintrag gehört. Bei einem Traktandum bildet er eine Hierarchie von Traktanden — z.B. eine Traktandengruppe „Gesetzesberatungen“ mit den Untertraktanden „Energiegesetz (Detailberatung)“ und „Energiegesetz (Schlussabstimmung)“; bei einer Wortmeldung bezeichnet er das Traktandum, unter dem sie erfolgte.
      description_fr: |
        Identifiant du point de l'ordre du jour auquel cet enregistrement se rattache. Pour un point de l'ordre du jour, il forme une hiérarchie de points — p. ex. un groupe « Délibérations législatives » avec les sous-points « Loi sur l'énergie (discussion par article) » et « Loi sur l'énergie (vote final) » ; pour une intervention, il désigne le point sous lequel elle a été faite.
    range: string

  parent_protocol:
    slot_uri: ops:parentProtocol
    description: |
      The protocol in which the voting or election is recorded. A vote is held during the sitting and is therefore anchored in the minutes, not in the agenda planned beforehand: what was put on the agenda does not yet say what was actually voted on. Conversely, the protocol lists its votings and elections (votings, elections).
    annotations:
      description_de: |
        Das Protokoll, in dem die Abstimmung oder Wahl festgehalten ist. Abgestimmt wird im Verlauf der Sitzung, weshalb die Abstimmung im Protokoll und nicht in der vorgängig geplanten Traktandenliste verankert ist: Was traktandiert wurde, sagt noch nicht, worüber tatsächlich abgestimmt wurde. Umgekehrt führt das Protokoll seine Abstimmungen und Wahlen als Listen (votings, elections).
      description_fr: |
        Le procès-verbal dans lequel le vote ou l'élection est consigné. Le vote a lieu au cours de la séance et se rattache donc au procès-verbal, et non à l'ordre du jour planifié à l'avance : ce qui a été mis à l'ordre du jour ne dit pas encore sur quoi il a effectivement été voté. Inversement, le procès-verbal reprend ses votes et élections sous forme de listes (votings, elections).
    range: Protocol

  parent_protocol_item:
    slot_uri: ops:parentProtocolItem
    description: |
      The recorded agenda item (ProtocolItem) under which the voting or election took place. Omitted when the vote was taken without an agenda item; the link to the sitting is then given by parent_protocol and parent_meeting alone.
    annotations:
      description_de: |
        Das protokollierte Traktandum (ProtocolItem), unter dem abgestimmt oder gewählt wurde. Entfällt, wenn ohne Traktandierung abgestimmt wurde; die Zuordnung zur Sitzung ergibt sich dann allein aus parent_protocol und parent_meeting.
      description_fr: |
        Le point consigné au procès-verbal (ProtocolItem) sous lequel le vote ou l'élection a eu lieu. Absent lorsque le vote a eu lieu sans point de l'ordre du jour ; le rattachement à la séance découle alors uniquement de parent_protocol et parent_meeting.
    range: ProtocolItem

  has_resolution:
    description: |
      The formal decision taken on this agenda item, e.g. the adoption of the energy law. The underlying voting with its vote ratio is recorded separately as a Voting.
    annotations:
      description_de: |
        Der formale Beschluss zu diesem Traktandum, z.B. die Annahme des Energiegesetzes. Die zugrunde liegende Abstimmung mit dem Stimmenverhältnis wird separat als Voting erfasst.
      description_fr: |
        La décision formelle prise sur ce point de l'ordre du jour, p. ex. l'adoption de la loi sur l'énergie. Le vote sous-jacent avec son rapport de voix est saisi séparément comme Voting.
    range: Resolution

  joint_debates:
    slot_uri: ops:jointDebate
    description: |
      Joint debates attached to this record: on an agenda item, the debates in which it is deliberated together with other agenda items; on a meeting or a session, the joint debates held within it.
    annotations:
      description_de: |
        An diesem Eintrag angehängte gemeinsame Beratungen: bei einem Traktandum die Beratungen, in denen es zusammen mit anderen Traktanden behandelt wird; bei einer Sitzung oder Session die darin geführten gemeinsamen Beratungen.
      description_fr: |
        Délibérations communes rattachées à cet enregistrement : pour un point de l'ordre du jour, les délibérations dans lesquelles il est traité conjointement avec d'autres points ; pour une séance ou une session, les délibérations communes qui s'y tiennent.
    range: JointDebate
    multivalued: true
    inlined_as_list: true

  joint_agenda_item_ids:
    slot_uri: ops:jointAgendaItem
    description: |
      Identifiers of the agenda items (AgendaItem or ProtocolItem) debated jointly.
    annotations:
      description_de: |
        Identifikatoren der gemeinsam behandelten Traktanden (AgendaItem oder ProtocolItem).
      description_fr: |
        Identifiants des points de l'ordre du jour traités conjointement (AgendaItem ou ProtocolItem).
    range: string
    multivalued: true

  url:
    description: |
      Landing page or further web address, multilingual.
    annotations:
      description_de: |
        Landing Page oder weiterführende Webadresse, mehrsprachig.
      description_fr: |
        Page d'accueil ou adresse web complémentaire, multilingue.
    range: MultilingualString
    multivalued: true
    inlined_as_list: true

  number:
    description: |
      Number of the session or meeting as designated by the body, e.g. within the legislature, the session or the year. As a string it also allows roman numerals. Numbering practices vary widely, which is why number, sequential_number, position and meeting_abbreviation are available side by side.
    annotations:
      description_de: |
        Nummer der Session oder Sitzung, wie sie das Organ vergibt, z.B. innerhalb der Legislatur, der Session oder des Jahres. Als Zeichenkette erlaubt sie auch römische Ziffern. Nummeriert wird sehr unterschiedlich, weshalb number, sequential_number, position und meeting_abbreviation nebeneinander zur Verfügung stehen.
      description_fr: |
        Numéro de la session ou de la séance tel qu'attribué par l'organe, p. ex. au sein de la législature, de la session ou de l'année. En tant que chaîne de caractères, il admet aussi les chiffres romains. Les pratiques de numérotation variant fortement, number, sequential_number, position et meeting_abbreviation sont disponibles côte à côte.

  meeting_abbreviation:
    description: |
      Short designation of the session or meeting (e.g. "FS24" for the 2024 spring session).
    annotations:
      description_de: |
        Kurzbezeichnung der Session oder Sitzung (z.B. „FS24“ für die Frühjahrssession 2024).
      description_fr: |
        Désignation abrégée de la session ou de la séance (p. ex. « FS24 » pour la session de printemps 2024).

  group_name:
    description: |
      Name of the group or body in plain text, in addition to the reference `group_id`.
    annotations:
      description_de: |
        Name der Gruppe oder des Gremiums im Klartext, zusätzlich zur Referenz `group_id`.
      description_fr: |
        Nom du groupe ou de l'organe en clair, en complément de la référence `group_id`.
    range: string

  group_id:
    description: |
      Reference to the group or body (lightweight snapshot at time of linking).
    annotations:
      description_de: |
        Referenz auf die Gruppe oder das Gremium (Momentaufnahme zum Zeitpunkt der Verknüpfung).
      description_fr: |
        Référence au groupe ou à l'organe (instantané au moment de la mise en relation).
    range: GroupReference
    inlined: true

  landing_page:
    slot_uri: ops:landingPage
    description: |
      URL providing further information.
    annotations:
      description_de: |
        URL mit weiteren Informationen.
      description_fr: |
        URL fournissant des informations complémentaires.

  tie_breaker:
    range: boolean
    description: |
      Indicates whether the result was decided by the casting vote of the presiding member in case of a tie.
    annotations:
      description_de: |
        Gibt an, ob das Ergebnis bei Stimmengleichheit durch den Stichentscheid der Präsidentin oder des Präsidenten zustande kam.
      description_fr: |
        Indique si le résultat a été obtenu, en cas d'égalité des voix, par la voix prépondérante de la présidente ou du président.

  label_yes:
    range: string
    description: |
      Meaning of a 'yes' vote.
    annotations:
      description_de: |
        Bedeutung einer „Ja“-Stimme.
      description_fr: |
        Signification d'une voix « oui ».

  label_no:
    range: string
    description: |
      Meaning of a 'no' vote.
    annotations:
      description_de: |
        Bedeutung einer „Nein“-Stimme.
      description_fr: |
        Signification d'une voix « non ».

  label_abstention:
    range: string
    description: |
      Meaning of an 'abstention' vote.
    annotations:
      description_de: |
        Bedeutung einer Enthaltungsstimme.
      description_fr: |
        Signification d'une abstention.

  total_count_yes:
    range: integer
    description: |
      Total number of 'yes' votes.
    annotations:
      description_de: |
        Gesamtzahl der „Ja“-Stimmen.
      description_fr: |
        Nombre total de voix « oui ».

  total_count_no:
    range: integer
    description: |
      Total number of 'no' votes.
    annotations:
      description_de: |
        Gesamtzahl der „Nein“-Stimmen.
      description_fr: |
        Nombre total de voix « non ».

  total_count_abstention:
    range: integer
    description: |
      Total number of abstentions.
    annotations:
      description_de: |
        Gesamtzahl der Enthaltungen.
      description_fr: |
        Nombre total d'abstentions.

  total_other:
    range: TotalOther
    multivalued: true
    inlined_as_list: true
    description: |
      Vote counts for the options of a multiple-choice voting, one entry per option; used instead of total_count_yes, total_count_no and total_count_abstention (see TotalOther).
    annotations:
      description_de: |
        Stimmenzahlen für die Optionen einer Auswahlabstimmung, ein Eintrag pro Option; tritt an die Stelle von total_count_yes, total_count_no und total_count_abstention (siehe TotalOther).
      description_fr: |
        Nombres de voix pour les options d'un vote à choix multiple, une entrée par option ; remplace total_count_yes, total_count_no et total_count_abstention (voir TotalOther).

  total_absent:
    range: integer
    description: |
      Number of absent members who could not take part. Whether an absence was excused is tracked on the attendance list (Attendance).
    annotations:
      description_de: |
        Anzahl abwesender Mitglieder, die nicht teilnehmen konnten. Ob eine Abwesenheit entschuldigt war, hält die Anwesenheitsliste (Attendance) fest.
      description_fr: |
        Nombre de membres absents qui n'ont pas pu participer. La liste de présence (Attendance) indique si une absence était excusée.

  total:
    range: integer
    description: |
      Total number of votes, excluding absent and president's vote.
    annotations:
      description_de: |
        Gesamtzahl der Stimmen, ohne abwesende und Präsidiumsstimmen.
      description_fr: |
        Nombre total de voix, sans les absents ni la voix de la présidence.

  majority_type:
    range: MajorityTypeEnum
    description: |
      Type of majority required for the vote (absolute, two-thirds, etc.).
    annotations:
      description_de: |
        Art der für die Abstimmung erforderlichen Mehrheit (absolut, Zweidrittel usw.).
      description_fr: |
        Type de majorité requise pour le vote (absolue, deux tiers, etc.).

  majority_count:
    range: integer
    description: |
      Number of votes required for the relevant majority threshold.
    annotations:
      description_de: |
        Anzahl der Stimmen, die für die relevante Mehrheitsschwelle erforderlich sind.
      description_fr: |
        Nombre de voix requis pour atteindre le seuil de majorité déterminant.

  result_text:
    range: string
    description: |
      Free text describing the outcome, e.g. "Accepted with 120 to 75 votes with 5 abstentions". For votings, the categorical decision (accepted, rejected, noted …) is not recorded here but in the Resolution (resolution_type) of the agenda item.
    annotations:
      description_de: |
        Freitext, der das Ergebnis beschreibt, z.B. „Mit 120 zu 75 Stimmen bei 5 Enthaltungen angenommen“. Bei Abstimmungen wird der kategorische Entscheid (angenommen, abgelehnt, Kenntnisnahme …) nicht hier, sondern in der Resolution (resolution_type) des Traktandums festgehalten.
      description_fr: |
        Texte libre décrivant le résultat, p. ex. « Adopté par 120 voix contre 75 et 5 abstentions ». Pour les votes, la décision catégorielle (adopté, rejeté, pris acte …) n'est pas retenue ici, mais dans la Resolution (resolution_type) du point de l'ordre du jour.


  state:
    description: |
      Whether the meeting takes place as planned at all (planned, canceled, postponed). A diverging, free-text designation goes into `state_name`.
    annotations:
      description_de: |
        Ob die Sitzung überhaupt wie vorgesehen stattfindet (geplant, abgesagt, verschoben). Eine abweichende, freitextliche Bezeichnung nimmt `state_name` auf.
      description_fr: |
        Indique si la séance a lieu comme prévu (planifiée, annulée, reportée). Une désignation divergente, en texte libre, est reprise dans `state_name`.
    range: StateEnum

  status:
    description: |
      Free status designation, used where the state enumeration does not apply.
    annotations:
      description_de: |
        Freie Statusbezeichnung, dort verwendet, wo das Status-Enum nicht zutrifft.
      description_fr: |
        Désignation libre de l'état, utilisée là où l'énumération des états ne s'applique pas.

  type:
    description: |
      Generic type designation.
    annotations:
      description_de: |
        Generische Typbezeichnung.
      description_fr: |
        Désignation générique du type.

  description:
    description: |
      Descriptive text of the element.
    annotations:
      description_de: |
        Beschreibender Text zum Element.
      description_fr: |
        Texte descriptif de l'élément.

  location:
    description: |
      Place where the meeting is held — the physical room ("Federal Palace, National Council chamber"), a video conference or a hybrid format.
    annotations:
      description_de: |
        Ort, an dem die Sitzung stattfindet — der physische Raum („Bundeshaus, Nationalratssaal“), eine Videokonferenz oder ein hybrides Format.
      description_fr: |
        Lieu où se tient la séance — la salle physique (« Palais fédéral, salle du Conseil national »), une visioconférence ou un format hybride.

  position:
    description: |
      Integer position within the superordinate sequence, e.g. of a session within the legislature.
    annotations:
      description_de: |
        Ganzzahlige Position innerhalb der übergeordneten Reihenfolge, z.B. einer Session innerhalb der Legislaturperiode.
      description_fr: |
        Position entière au sein de la séquence supérieure, p. ex. d'une session au sein de la législature.

  result:
    description: |
      Result of the procedure.
    annotations:
      description_de: |
        Ergebnis des Verfahrens.
      description_fr: |
        Résultat de la procédure.

  title:
    description: |
      Title of the element.
    annotations:
      description_de: |
        Titel des Elements.
      description_fr: |
        Titre de l'élément.

  category:
    description: |
      Category of the element.
    annotations:
      description_de: |
        Kategorie des Elements.
      description_fr: |
        Catégorie de l'élément.

  legislatures:
    slot_uri: ops:legislature
    description: |
      Collection of legislature records.
    annotations:
      description_de: |
        Sammlung der Legislaturperioden.
      description_fr: |
        Ensemble des législatures.
    range: Legislature
    multivalued: true
    inlined_as_list: true

  sessions:
    slot_uri: ops:session
    description: |
      Collection of session records.
    annotations:
      description_de: |
        Sammlung der Sessionen.
      description_fr: |
        Ensemble des sessions.
    range: Session
    multivalued: true
    inlined_as_list: true

  meetings:
    slot_uri: ops:meeting
    description: |
      Collection of meeting records.
    annotations:
      description_de: |
        Sammlung der Sitzungen.
      description_fr: |
        Ensemble des séances.
    range: Meeting
    multivalued: true
    inlined_as_list: true

  agenda_items:
    slot_uri: ops:agendaItem
    description: |
      Agenda items planned for this meeting or session, embedded as a list. On a meeting they form the agenda of the sitting. On a session they hold agenda items planned directly at the level of the session — where a federal unit does not break the session down into individual meetings (e.g. a Landsgemeinde or a one-day sitting of a cantonal parliament), or for items not (yet) assigned to a specific meeting, as in a session programme. The counterpart after the sitting are the items recorded in the protocol (Protocol.protocol_items).
    annotations:
      description_de: |
        Für diese Sitzung oder Session geplante Traktanden, eingebettet als Liste. Bei einer Sitzung bilden sie deren Traktandenliste. Bei einer Session enthalten sie Traktanden, die direkt auf Ebene der Session geplant sind — wo eine Föderaleinheit die Session nicht in einzelne Sitzungen gliedert (z.B. eine Landsgemeinde oder eine eintägige Sitzung eines Kantonsparlaments) oder für Traktanden, die (noch) keiner bestimmten Sitzung zugeordnet sind, wie in einem Sessionsprogramm. Das Gegenstück nach der Sitzung sind die im Protokoll festgehaltenen Traktanden (Protocol.protocol_items).
      description_fr: |
        Points de l'ordre du jour planifiés pour cette séance ou cette session, imbriqués sous forme de liste. Pour une séance, ils forment son ordre du jour. Pour une session, ils contiennent les points planifiés directement au niveau de la session — lorsqu'une unité fédérale ne subdivise pas la session en séances (p. ex. une Landsgemeinde ou une séance d'un jour d'un parlement cantonal), ou pour des points qui ne sont pas (encore) attribués à une séance déterminée, comme dans un programme de session. Leur pendant après la séance sont les points consignés au procès-verbal (Protocol.protocol_items).
    range: AgendaItem
    multivalued: true
    inlined_as_list: true

  protocols:
    slot_uri: ops:protocol
    description: |
      Collection of protocol records.
    annotations:
      description_de: |
        Sammlung der Protokolle.
      description_fr: |
        Ensemble des procès-verbaux.
    range: Protocol
    multivalued: true
    inlined_as_list: true

  has_protocol:
    slot_uri: ops:hasProtocol
    description: |
      Reference to the protocol (minutes) of this meeting, recorded after the meeting. Only the identifier of the protocol is given; the protocol itself is delivered in the container's `protocols` list. It is an entity in its own right with its own identifier and is usually published later than the meeting, so it is referenced rather than embedded.
    annotations:
      description_de: |
        Referenz auf das nach der Sitzung erstellte Protokoll dieser Sitzung. Angegeben wird nur der Identifikator des Protokolls; das Protokoll selbst wird in der Liste `protocols` des Containers geliefert. Es ist eine eigenständige Entität mit eigenem Identifikator und wird in der Regel später veröffentlicht als die Sitzung, weshalb es referenziert und nicht eingebettet wird.
      description_fr: |
        Référence au procès-verbal de cette séance, établi après celle-ci. Seul l'identifiant du procès-verbal est indiqué ; le procès-verbal lui-même est livré dans la liste `protocols` du conteneur. Il constitue une entité à part entière dotée de son propre identifiant et est en règle générale publié après la séance, raison pour laquelle il est référencé et non imbriqué.
    range: Protocol

  protocol_items:
    slot_uri: ops:protocolItem
    description: |
      Agenda items as actually recorded in the protocol.
    annotations:
      description_de: |
        Traktanden, wie sie im Protokoll tatsächlich festgehalten wurden.
      description_fr: |
        Points de l'ordre du jour tels qu'ils ont effectivement été consignés au procès-verbal.
    range: ProtocolItem
    multivalued: true
    inlined_as_list: true

  text_segments:
    slot_uri: ops:textSegment
    description: |
      Collection of text segments (e.g. verbatim protocol).
    annotations:
      description_de: |
        Sammlung von Textsegmenten (z.B. Wortprotokoll).
      description_fr: |
        Ensemble de segments de texte (p. ex. procès-verbal in extenso).
    range: TextSegment
    multivalued: true
    inlined_as_list: true

  votings:
    slot_uri: ops:voting
    description: |
      Collection of voting records.
    annotations:
      description_de: |
        Sammlung der Abstimmungen.
      description_fr: |
        Ensemble des votes.
    range: Voting
    multivalued: true
    inlined_as_list: true

  elections:
    slot_uri: ops:election
    description: |
      Collection of election records.
    annotations:
      description_de: |
        Sammlung der Wahlen.
      description_fr: |
        Ensemble des élections.
    range: Election
    multivalued: true
    inlined_as_list: true

  individual_votes:
