#
# Syntaktisch korrekte Version
# bitte in schema_working.yaml arbeiten!
#
# Mehrsprachigkeit: Englisch in `description:`, Deutsch in
# `annotations.description_de:`, Franzoesisch in `annotations.description_fr:`.
# Alle drei Sprachen sind synchron zu halten -- localize_schema.py erzeugt
# daraus die sprachspezifischen Schemata fuer gen-doc.
#

id: https://ch.paf.link/schema/operations
name: operations
description: |
  Meeting Schema for various legislative bodies
annotations:
  description_de: |
    Sitzungs-Schema für verschiedene gesetzgebende Körperschaften
  description_fr: |
    Schéma des séances pour différents corps législatifs
prefixes:
  linkml: https://w3id.org/linkml/
  ops: https://ch.paf.link/schema/operations/
  dcterms: http://purl.org/dc/terms/
  # Cross-references to instance data of the sibling eCH standards.
  actors: https://ld.ech.ch/schema/0294/actors/
  affairs: https://ld.ech.ch/schema/0295/affairs/
  parl: https://ld.ech.ch/schema/0293/operations/
imports:
  - linkml:types
  - ../../ech-0292_meta/input/schema_common
  - ../../ech-0292_meta/input/schema
default_prefix: ops
default_range: string

classes:

  Container:
    tree_root: true
    description: |
      Container for the records of public council operations: legislatures, sessions, meetings, agenda items, protocols, votings, elections, attendances, speeches and resolutions.
    annotations:
      description_de: |
        Container für die Daten des öffentlichen Ratsbetriebs: Legislaturperioden, Sessionen, Sitzungen, Traktanden, Protokolle, Abstimmungen, Wahlen, Anwesenheiten, Wortmeldungen und Resolutionen.
      description_fr: |
        Conteneur pour les données de l'activité publique des conseils : législatures, sessions, séances, points de l'ordre du jour, procès-verbaux, votes, élections, présences, interventions et décisions.
    mixins:
      - HasIdentification
    slots:
      - legislatures
      - sessions
        # ist_schon_erfasst
      - meetings
      - agenda_items
      - protocols
      - votings
      - elections
      - individual_votes
      - attendances
      - individual_attendances
      - speeches
      - resolutions

  Legislature:
    description: |
      Term of office of a parliament as a legislative assembly. Usually lasts four years.
    annotations:
      description_de: |
        Amtsdauer eines Parlaments als gesetzgebender Versammlung. Dauert in der Regel vier Jahre.
      description_fr: |
        Durée du mandat d'un parlement en tant qu'assemblée législative. Elle est en règle générale de quatre ans.
    mixins:
      - HasIdentification
      - IsEventWithDuration
      - HasCreationModificationDates
    slots:
      - spatial
      - administrative_id
      - name
      - description
      - landing_page
      - actor_id
      - documents
    slot_usage:
      actor_id:
        range: GroupReference
        inlined: true
        description: |
          Reference to the acting body/organ (lightweight snapshot at time of linking).
        annotations:
          description_de: |
            Referenz auf das handelnde Organ/Gremium (Momentaufnahme zum Zeitpunkt der Verknüpfung).
          description_fr: |
            Référence à l'organe agissant (instantané au moment de la mise en relation).

  Session:
    description: |
      A parliamentary session that groups multiple meetings and spans a specific time period.
    annotations:
      description_de: |
        Eine Parlamentssession, die mehrere Sitzungen gruppiert und sich über einen bestimmten Zeitraum erstreckt.
      description_fr: |
        Une session parlementaire qui regroupe plusieurs séances et s'étend sur une période déterminée.
    mixins:
      - HasIdentification
      - IsEventWithDuration
      - HasCreationModificationDates
    slots:
      - spatial
      - name
      - number
      - sequential_number
      - position
      - meeting_abbreviation
      - url
      - parent_legislature
      - meetings
      - documents

  Meeting:
    description: |
      The individual sitting of a body — the level at which agenda items are deliberated, decisions taken and speeches recorded. The meeting is the node to which the other classes of this standard attach via `parent_meeting`: agenda items (AgendaItem), votings and elections (Voting, Election), speeches (Speech) and the attendance list (Attendance). At this level, scheduled and actual times regularly diverge — a sitting scheduled for 14:00 only begins at 14:25 because of delays and ends at 17:30 instead of 18:00 — which is why both the planned and the actual begin and end are recorded.
    annotations:
      description_de: |
        Die einzelne Sitzung eines Organs — die Ebene, auf der Traktanden beraten, Beschlüsse gefasst und Wortmeldungen festgehalten werden. Die Sitzung ist der Knoten, an dem die übrigen Klassen dieses Standards über `parent_meeting` hängen: Traktanden (AgendaItem), Abstimmungen und Wahlen (Voting, Election), Wortmeldungen (Speech) sowie die Anwesenheitsliste (Attendance). Auf dieser Ebene fallen geplante und tatsächliche Zeiten regelmässig auseinander — eine für 14:00 angesetzte Sitzung beginnt wegen Verzögerungen erst um 14:25 und endet statt um 18:00 bereits um 17:30 —, weshalb Beginn und Ende sowohl geplant als auch tatsächlich erfasst werden.
      description_fr: |
        La séance individuelle d'un organe — le niveau auquel les points de l'ordre du jour sont délibérés, les décisions prises et les interventions consignées. La séance est le nœud auquel les autres classes de la présente norme se rattachent via `parent_meeting` : les points de l'ordre du jour (AgendaItem), les votes et élections (Voting, Election), les interventions (Speech) ainsi que la liste de présence (Attendance). À ce niveau, les heures prévues et les heures effectives divergent régulièrement — une séance fixée à 14h00 ne commence, en raison de retards, qu'à 14h25 et se termine à 17h30 au lieu de 18h00 —, raison pour laquelle le début et la fin sont consignés tant prévus qu'effectifs.
    mixins:
      - HasIdentification
      - IsEventWithDuration
      - HasCreationModificationDates
    slots:
      - spatial
      - administrative_id
      - name
      - url
      - group_name
      - group_id
      - number
      - landing_page
      - sequential_number
      - position
      - meeting_abbreviation
      - actor_name
      - actor_id
      - state
      - state_name
      - description
      - location
      - parent_meeting
      - parent_session
      - documents
      - has_protocol
    slot_usage:
      actor_id:
        range: GroupReference
        inlined: true
        description: |
          Reference to the acting body/organ (lightweight snapshot at time of linking).
        annotations:
          description_de: |
            Referenz auf das handelnde Organ/Gremium (Momentaufnahme zum Zeitpunkt der Verknüpfung).
          description_fr: |
            Référence à l'organe agissant (instantané au moment de la mise en relation).
      state_name:
        description: |
          Diverging, free-text status designation of the meeting, where the values of `state` do not suffice.
        annotations:
          description_de: |
            Abweichende, freitextliche Statusbezeichnung der Sitzung, wo die Werte von `state` nicht genügen.
          description_fr: |
            Désignation de statut divergente, en texte libre, de la séance, là où les valeurs de `state` ne suffisent pas.
      documents:
        description: |
          Sitting documents such as the bulletin (Tagblatt) or annexes, as FRBR Works. The protocol is not linked here but via `has_protocol`.
        annotations:
          description_de: |
            Sitzungsunterlagen wie Tagblatt oder Beilagen, als FRBR-Works. Das Protokoll wird nicht hier, sondern über `has_protocol` verknüpft.
          description_fr: |
            Documents de séance tels que le bulletin (Tagblatt) ou les annexes, sous forme de FRBR Works. Le procès-verbal n'est pas lié ici, mais via `has_protocol`.

  IsAgendaItem:
    mixin: true
    description: |
      A mixin class that provides the elements of an agenda item: designation, type, actors, the link to the affair, state, resolution and attached texts and documents. It is used by the planned agenda item (AgendaItem) and by the recorded one (ProtocolItem), so that both carry the same elements without one depending on the other.
    annotations:
      description_de: |
        Eine Mixin-Klasse, welche die Elemente eines Traktandums bereitstellt: Bezeichnung, Art, Akteure, Bezug zum Geschäft, Status, Beschluss sowie angehängte Texte und Dokumente. Sie wird vom geplanten Traktandum (AgendaItem) und vom protokollierten (ProtocolItem) verwendet, damit beide dieselben Elemente führen, ohne dass das eine vom anderen abhängt.
      description_fr: |
        Une classe mixin qui fournit les éléments d'un point de l'ordre du jour : désignation, type, acteurs, lien avec l'affaire, état, décision ainsi que les textes et documents rattachés. Elle est utilisée par le point planifié (AgendaItem) et par le point consigné (ProtocolItem), de sorte que les deux portent les mêmes éléments sans que l'un dépende de l'autre.
    slots:
      - parent_meeting
      - agenda_item_type
      - agenda_item_number
      - agenda_item_position
      - leading_actor_id
      - speaking_actor_id
      - agenda_item_title
      - affair_id
      - agenda_item_description
      - state_id
      - state_name
      - landing_page
      - url
      - agenda_item_category
      - parent_agenda_item
      - has_resolution
      - joint_debates
      - text_segments
      - documents

  AgendaItem:
    description: |
      An agenda item of a meeting.
    annotations:
      description_de: |
        Ein Traktandum einer Sitzung.
      description_fr: |
        Un point de l'ordre du jour d'une séance.
    mixins:
      - HasIdentification
      - IsEventWithDuration
      - HasCreationModificationDates
      - IsAgendaItem

  Protocol:
    description: |
      The minutes of a meeting, recorded after the meeting. A wrapper container bundling the actually handled agenda items (protocol_items), votings, speeches, verbatim text segments and linked documents.
    annotations:
      description_de: |
        Das nach der Sitzung erstellte Protokoll. Ein Wrapper-Container, der die tatsächlich behandelten Traktanden (protocol_items), Abstimmungen, Wortmeldungen, Wortlaut-Textsegmente und verknüpfte Dokumente bündelt.
      description_fr: |
        Le procès-verbal établi après la séance. Un conteneur qui regroupe les points effectivement traités (protocol_items), les votes, les interventions, les segments de texte in extenso et les documents liés.
    mixins:
      - HasIdentification
      - HasCreationModificationDates
    slots:
      - parent_meeting
      - protocol_items
      - votings
      - elections
      - speeches
      - text_segments
      - documents

  ProtocolItem:
    description: |
      An agenda item as actually recorded in the protocol. It carries the same elements as AgendaItem through the IsAgendaItem mixin, but is a class in its own right: the record is not a special case of the plan.
    annotations:
      description_de: |
        Ein Traktandum, wie es im Protokoll tatsächlich festgehalten wurde. Es führt über den Mixin IsAgendaItem dieselben Elemente wie AgendaItem, ist aber eine eigenständige Klasse: Das Protokollierte ist kein Sonderfall des Geplanten.
      description_fr: |
        Un point de l'ordre du jour tel qu'il a effectivement été consigné au procès-verbal. Il porte, via le mixin IsAgendaItem, les mêmes éléments qu'AgendaItem, tout en restant une classe à part entière : le point consigné n'est pas un cas particulier du point planifié.
    mixins:
      - HasIdentification
      - IsEventWithDuration
      - HasCreationModificationDates
      - IsAgendaItem

  JointDebate:
    description: |
      A joint debate: several agenda items are deliberated together. The joint debate hangs on an agenda item (AgendaItem) or a protocol item (ProtocolItem) and references the items debated jointly with it by their identifiers.
    annotations:
      description_de: |
        Eine gemeinsame Beratung: Mehrere Traktanden werden zusammen behandelt. Die gemeinsame Beratung hängt an einem Traktandum (AgendaItem) oder einem Protokoll-Traktandum (ProtocolItem) und verweist über deren Identifikatoren auf die gemeinsam behandelten Traktanden.
      description_fr: |
        Une délibération commune : plusieurs points de l'ordre du jour sont traités ensemble. La délibération commune est rattachée à un point de l'ordre du jour (AgendaItem) ou à un point du procès-verbal (ProtocolItem) et renvoie, par leurs identifiants, aux points traités conjointement.
    slots:
      - joint_agenda_item_ids

  Resolution:
    description: |
      A resolution or decision taken on an agenda item, including voting procedures.
    annotations:
      description_de: |
        Eine Resolution oder Entscheidung zu einem Traktandum, einschliesslich Abstimmungsverfahren.
      description_fr: |
        Une décision prise sur un point de l'ordre du jour, y compris les procédures de vote.
    slots:
      - resolution_type
      - type_label
      - vote_procedures
      - documents

  Voting: # Abstimmung
    description: |
      A voting procedure with individual votes and results.
    annotations:
      description_de: |
        Ein Abstimmungsverfahren mit Einzelstimmen und Ergebnissen.
      description_fr: |
        Une procédure de vote avec les voix individuelles et les résultats.
    mixins:
      - HasIdentification
      - HasCreationModificationDates
    slots:
      - datetime_begin
      - datetime_end
      - voting_type
      - type_label
      - voting_title
      - optional
      - landing_page
      - label_yes
      - label_no
      - label_abstention
      - tie_breaker
      - total_count_yes
      - total_count_no
      - total_count_abstention
      - total_other
      - total_absent
      - total
      - majority_type
      - majority_count
      - result_text
      - parent_meeting
      - parent_protocol
      - parent_protocol_item
      - affair_id
      - actor_id
      - documents
    slot_usage:
      actor_id:
        range: GroupReference
        inlined: true
        description: |
          Reference to the acting body/organ (lightweight snapshot at time of linking).
        annotations:
          description_de: |
            Referenz auf das handelnde Organ/Gremium (Momentaufnahme zum Zeitpunkt der Verknüpfung).
          description_fr: |
            Référence à l'organe agissant (instantané au moment de la mise en relation).

# Handling Präsidiums-Votum wird als eigenes voting aufgenommen


  IndividualVote: # Einzelstimme  / vote individuel
    description: |
      An individual vote cast by a member during a voting procedure.
    annotations:
      description_de: |
        Eine Einzelstimme eines Mitglieds während eines Abstimmungsverfahrens.
      description_fr: |
        Une voix individuelle exprimée par un membre lors d'une procédure de vote.
    mixins:
      - HasIdentification
      - HasCreationModificationDates
    slots:
      - parent_voting
      - actor_id
      - seat_nr
      - weight
      - individual_vote_type
      - type_label

  Election: # Wahl
    description: |
      An election procedure for selecting persons to positions.
    annotations:
      description_de: |
        Ein Wahlverfahren zur Wahl von Personen in Positionen.
      description_fr: |
        Une procédure d'élection visant à pourvoir des fonctions par des personnes.
    mixins:
      - HasIdentification
      - HasCreationModificationDates
    slots:
      - datetime_begin
      - datetime_end
      - election_type
      - type_label
      - title
      - landing_page
      - total_absent
      - total
      - majority_type
      - majority_count
      - result_text
      - parent_meeting
      - parent_protocol
      - parent_protocol_item
      - affair_id
      - actor_id
      - documents
    slot_usage:
      actor_id:
        range: GroupReference
        inlined: true
        description: |
          Reference to the acting body/organ (lightweight snapshot at time of linking).
        annotations:
          description_de: |
            Referenz auf das handelnde Organ/Gremium (Momentaufnahme zum Zeitpunkt der Verknüpfung).
          description_fr: |
            Référence à l'organe agissant (instantané au moment de la mise en relation).

  Attendance:
    description: |
      Aggregated attendance record for a meeting (number of members present, absent, excused).
    annotations:
      description_de: |
        Aggregierte Anwesenheitsliste für eine Sitzung (Anzahl Anwesende, Abwesende, Entschuldigte).
      description_fr: |
        Liste de présence agrégée pour une séance (nombre de membres présents, absents, excusés).
    mixins:
      - HasIdentification
      - HasCreationModificationDates
    slots:
      - parent_meeting
      - datetime_begin
      - actor_id
      - total_count
      - total_present
      - total_absent
      - total_excused
    slot_usage:
      actor_id:
        range: GroupReference
        inlined: true
        description: |
          Reference to the acting body/organ (lightweight snapshot at time of linking).
        annotations:
          description_de: |
            Referenz auf das handelnde Organ/Gremium (Momentaufnahme zum Zeitpunkt der Verknüpfung).
          description_fr: |
            Référence à l'organe agissant (instantané au moment de la mise en relation).

  IndividualAttendance:
    description: |
      Individual attendance record for a specific person at a meeting (linked via the parent Attendance aggregate).
    annotations:
      description_de: |
        Einzelne Anwesenheitsfeststellung einer Person an einer Sitzung (verknüpft über das übergeordnete Attendance-Aggregat).
      description_fr: |
        Constatation individuelle de la présence d'une personne à une séance (rattachée à l'agrégat Attendance parent).
    mixins:
      - HasIdentification
      - HasCreationModificationDates
    slots:
      - parent_attendance
      - actor_id
      - attendance_type
      - reason

  Speech:
    description: |
      A speech or statement made during a meeting (also called Votum or speaker segment).
    annotations:
      description_de: |
        Eine Wortmeldung während einer Sitzung (auch Votum oder Redebeitrag genannt).
      description_fr: |
        Une intervention prononcée au cours d'une séance (également appelée prise de parole).
    mixins:
      - HasIdentification
      - HasCreationModificationDates
    slots:
      - parent_meeting
      - parent_agenda_item
      - language
      - start
      - datetime_begin
      - datetime_end
      - actor_fullname
      - actor_id
      - role
      - text
      - text_format
      - text_type
      - landing_page
      - media_url
      - media_type
      - media_format
      - documents

  TextSegment:
    description: |
      A text segment such as cross-references or subtitles. Text segments are carried by the protocol, by a speech or by an agenda item (planned AgendaItem or recorded ProtocolItem).
    annotations:
      description_de: |
        Ein Textsegment wie Querverweise oder Zwischentitel. Textsegmente werden am Protokoll, an einer Wortmeldung oder an einem Traktandum geführt (geplantes AgendaItem oder protokolliertes ProtocolItem).
      description_fr: |
        Un segment de texte tel qu'un renvoi ou un intertitre. Les segments de texte sont portés par le procès-verbal, par une intervention ou par un point de l'ordre du jour (AgendaItem planifié ou ProtocolItem consigné).
    mixins:
      - HasIdentification
    slots:
      - text

  Motion:
    description: |
      A formal proposal or motion submitted during proceedings.
    annotations:
      description_de: |
        Ein formeller Antrag, der während der Verhandlungen eingereicht wird.
      description_fr: |
        Une proposition formelle déposée au cours des délibérations.
    mixins:
      - HasIdentification
    slots:
      - title
      - description
      - documents

  Media:
    description: |
      Media files or documents (including protocols in PDF/HTML/WORD or links to audio/video).
    annotations:
      description_de: |
        Mediendateien oder Dokumente (einschliesslich Protokolle in PDF/HTML/WORD oder Links zu Audio/Video).
      description_fr: |
        Fichiers médias ou documents (y compris les procès-verbaux en PDF/HTML/WORD ou les liens vers des contenus audio/vidéo).
    mixins:
      - HasIdentification
    slots:
      - title
      - media_type
      - url
      - version
      - parent_type

  TotalOther:
    description: |
      Additional vote counts when multiple options are presented (e.g., Zurich uses 5 buttons).
    annotations:
      description_de: |
        Zusätzliche Stimmzahlen, wenn mehrere Optionen zur Abstimmung gestellt werden (z.B. Zürich verwendet 5 Knöpfe).
      description_fr: |
        Décomptes de voix supplémentaires lorsque plusieurs options sont soumises au vote (p. ex. Zurich utilise 5 boutons).
    slots:
      - count
      - label

  MultilingualString:
    description: |
      A string that can contain text in multiple languages.
    annotations:
      description_de: |
        Ein String, der Text in mehreren Sprachen enthalten kann.
      description_fr: |
        Une chaîne de caractères pouvant contenir du texte en plusieurs langues.
    slots:
      - text
      - language
    slot_usage:
      language:
        required: true

slots:

  administrative_id:
    description: |
      Administrative ID of the legislative body, such as a municipality, canton, or country.
    annotations:
      description_de: |
        Verwaltungs-ID des gesetzgebenden Körpers, wie z.B. Gemeinde, Kanton oder Land.
      description_fr: |
        Identifiant administratif du corps législatif, p. ex. commune, canton ou pays.

  actor_id:
    description: |
      Reference to the acting person (lightweight snapshot at time of linking).
    annotations:
      description_de: |
        Referenz auf die handelnde Person (Momentaufnahme zum Zeitpunkt der Verknüpfung).
      description_fr: |
        Référence à la personne agissante (instantané au moment de la mise en relation).
    range: PersonReference
    inlined: true

  spatial:
    description: |
      Spatial reference to a LINDAS resource (fos-municipality number, fos-canton number, district, or country). Formats: municipality: https://ld.admin.ch/municipality/1234, district: https://ld.admin.ch/district/2301, canton: https://ld.admin.ch/canton/23, country: https://ld.admin.ch/country/CHE.
    annotations:
      description_de: |
        Räumliche Referenz auf eine LINDAS-Ressource (BFS-Gemeindenummer, BFS-Kantonsnummer, Bezirk oder Land). Formate: Gemeinde: https://ld.admin.ch/municipality/1234, Bezirk: https://ld.admin.ch/district/2301, Kanton: https://ld.admin.ch/canton/23, Bund: https://ld.admin.ch/country/CHE.
      description_fr: |
        Référence spatiale à une ressource LINDAS (numéro OFS de commune, numéro OFS de canton, district ou pays). Formats : commune : https://ld.admin.ch/municipality/1234, district : https://ld.admin.ch/district/2301, canton : https://ld.admin.ch/canton/23, pays : https://ld.admin.ch/country/CHE.
    # Wortgleich mit `spatial` in eCH-0294: dieselbe Raumeinheit, damit ein
    # Ratsbetrieb und die Akteure, die ihn tragen, auf dieselbe LINDAS-Ressource
    # zeigen. Festgehalten wird der Namensraum, nicht die Stellenzahl der Nummer.
    pattern: ^https://ld\.admin\.ch/(country/[A-Z]{3}|canton/[0-9]+|district/[0-9]+|municipality/[0-9]+)$

  type_label:
    description: |
      Custom type label when standard type values don't apply.
    annotations:
      description_de: |
        Benutzerdefinierte Typbezeichnung, wenn Standardtypwerte nicht zutreffen.
      description_fr: |
        Libellé de type personnalisé lorsque les valeurs de type standard ne s'appliquent pas.

  voting_type:
    description: |
      Type of voting procedure (preliminary, final, secret, etc.).
    annotations:
      description_de: |
        Art des Abstimmungsverfahrens (Zwischen-, Schlussabstimmung, geheim, etc.).
      description_fr: |
        Type de procédure de vote (vote intermédiaire, vote final, vote secret, etc.).
    range: VotingTypeEnum

  voting_title:
    description: |
      Title or question being voted on. If no specific subject exists, do not use the business item title.
    annotations:
      description_de: |
        Abstimmungstitel bzw. Gegenstand oder Frage. Wenn kein Gegenstand vorhanden ist, sollte nicht der Geschäftstitel verwendet werden.
      description_fr: |
        Titre du vote, objet ou question soumise au vote. En l'absence d'objet propre, il ne faut pas reprendre le titre de l'affaire.
    range: MultilingualString
    multivalued: true
    inlined_as_list: true

  resolution_type:
    description: |
      Type of resolution taken on the agenda item.
    annotations:
      description_de: |
        Art der Resolution zum Traktandum.
      description_fr: |
        Type de décision prise sur le point de l'ordre du jour.
    range: ResolutionTypeEnum

  individual_vote_type:
    description: |
      Type of vote cast (yes, no, abstention, no vote, etc.).
    annotations:
      description_de: |
        Art der abgegebenen Stimme (Ja, Nein, Enthaltung, nicht abgestimmt, etc.).
      description_fr: |
        Type de voix exprimée (oui, non, abstention, n'a pas voté, etc.).
    range: IndividualVoteTypeEnum

  agenda_item_type:
    description: |
      Type of agenda item, distinguishing individual items from groups.
    annotations:
      description_de: |
        Art des Traktandums, unterscheidet Einzeltraktanden von Traktandengruppen.
      description_fr: |
        Type de point de l'ordre du jour, distinguant les points isolés des groupes de points.
    range: AgendaItemTypeEnum

  agenda_item_number:
    description: |
      Sequential number of the agenda item (string type to support roman numerals).
    annotations:
      description_de: |
        Laufnummer des Traktandums (String-Typ zur Unterstützung römischer Ziffern).
      description_fr: |
        Numéro d'ordre du point de l'ordre du jour (type chaîne, afin de permettre les chiffres romains).
    range: string

  agenda_item_position:
    description: |
      Integer position of the agenda item in the meeting sequence.
    annotations:
      description_de: |
        Ganzzahlige Position des Traktandums in der Sitzungsreihenfolge.
      description_fr: |
        Position (nombre entier) du point de l'ordre du jour dans le déroulement de la séance.
    range: integer

  agenda_item_title:
    description: |
      Title of the agenda item.
    annotations:
      description_de: |
        Titel des Traktandums.
      description_fr: |
        Titre du point de l'ordre du jour.
    range: MultilingualString
    multivalued: true
    inlined_as_list: true

  agenda_item_description:
    description: |
      Subtitle or detailed description of the agenda item.
    annotations:
      description_de: |
        Untertitel oder ausführliche Beschreibung des Traktandums.
      description_fr: |
        Sous-titre ou description détaillée du point de l'ordre du jour.
    range: MultilingualString
    multivalued: true
    inlined_as_list: true

  agenda_item_category:
    description: |
      Category for grouped agenda items (e.g., introduction, by department, technical agenda items).
    annotations:
      description_de: |
        Kategorie für gruppierte Traktanden (z.B. Einführung, nach Departement, technische Traktanden).
      description_fr: |
        Catégorie pour les points de l'ordre du jour regroupés (p. ex. introduction, par département, points techniques).
    range: string

  sequential_number:
    description: |
      Sequential number of the meeting, used for ordering.
    annotations:
      description_de: |
        Laufende Nummer der Sitzung, die zur Sortierung verwendet wird.
      description_fr: |
        Numéro séquentiel de la séance, utilisé pour le tri.
    range: integer

  actor_name:
    description: |
      Name of the political body in plain text (e.g., Nationalrat), in addition to the reference `actor_id`.
    annotations:
      description_de: |
        Name des politischen Organs im Klartext (z.B. Nationalrat), zusätzlich zur Referenz `actor_id`.
      description_fr: |
        Nom de l'organe politique en clair (p. ex. Conseil national), en complément de la référence `actor_id`.
    range: string

  state_name:
    description: |
      Diverging, free-text status designation, where the status enumeration does not suffice.
    annotations:
      description_de: |
        Abweichende, freitextliche Statusbezeichnung, wo die Status-Aufzählung nicht genügt.
      description_fr: |
        Désignation de statut divergente, en texte libre, là où l'énumération des statuts ne suffit pas.
    range: string

  parent_meeting:
    description: |
      Identifier of the meeting this record belongs to. On a meeting it names the superordinate meeting; on an agenda item, voting, election, speech or protocol it names the meeting in which the record arose.
    annotations:
      description_de: |
        Identifikator der Sitzung, zu der dieser Eintrag gehört. Bei einer Sitzung bezeichnet er die übergeordnete Sitzung, bei Traktandum, Abstimmung, Wahl, Wortmeldung oder Protokoll die Sitzung, in der der Eintrag entstanden ist.
      description_fr: |
        Identifiant de la séance à laquelle cet enregistrement se rattache. Pour une séance, il désigne la séance supérieure ; pour un point de l'ordre du jour, un vote, une élection, une intervention ou un procès-verbal, la séance au cours de laquelle l'enregistrement est né.
    range: string

  parent_legislature:
    description: |
      Identifier of the legislature to which the session belongs.
    annotations:
      description_de: |
        Identifikator der Legislaturperiode, zu der die Session gehört.
      description_fr: |
        Identifiant de la législature à laquelle la session appartient.

  parent_session:
    description: |
      Identifier of the session to which the meeting belongs.
    annotations:
      description_de: |
        Identifikator der Session, zu der die Sitzung gehört.
      description_fr: |
        Identifiant de la session à laquelle la séance appartient.
    range: string

  leading_actor_id:
    description: |
      The leading department for the agenda item.
    annotations:
      description_de: |
        Das federführende Departement für das Traktandum.
      description_fr: |
        Le département responsable du point de l'ordre du jour.
    range: string

  speaking_actor_id:
    description: |
      The speaker or head of the department for the agenda item.
    annotations:
      description_de: |
        Der Sprecher oder die Sprecherin bzw. die Departementsvorsteherin oder der Departementsvorsteher für das Traktandum.
      description_fr: |
        La ou le porte-parole ou la cheffe ou le chef du département pour le point de l'ordre du jour.

  name:
    description: |
      Multilingual full designation.
    annotations:
      description_de: |
        Mehrsprachige vollständige Bezeichnung.
      description_fr: |
        Désignation complète multilingue.
    range: MultilingualString
    multivalued: true
    inlined_as_list: true

  vote_procedures:
    description: |
      Procedures for voting, such as secret ballot or open vote.
    annotations:
      description_de: |
        Verfahren für die Abstimmung, wie geheime Abstimmung oder offene Abstimmung.
      description_fr: |
        Modalités du vote, p. ex. vote secret ou vote ouvert.
    range: string
    multivalued: true
    inlined_as_list: true

  affair_id:
    description: |
      The connection to the affairs (business items) of the agenda item.
    annotations:
      description_de: |
        Die Verbindung zu den Geschäften des Traktandums.
      description_fr: |
        Le lien vers les affaires rattachées au point de l'ordre du jour.
    range: string

  state_id:
    description: |
      State identifier (reference to state enum or custom state).
    annotations:
      description_de: |
        Zustands-Identifikator (Verweis auf das Status-Enum oder auf einen eigenen Zustand).
      description_fr: |
        Identifiant d'état (renvoi à l'énumération des états ou à un état propre).
    range: string

  datetime_begin:
    range: datetime
    description: |
      The date and time when the meeting or voting begins.
    annotations:
      description_de: |
        Das Datum und die Uhrzeit, zu der die Sitzung oder Abstimmung beginnt.
      description_fr: |
        La date et l'heure auxquelles la séance ou le vote commence.

  datetime_end:
    range: datetime
    description: |
      The date and time when the meeting or voting ends.
    annotations:
      description_de: |
        Das Datum und die Uhrzeit, zu der die Sitzung oder Abstimmung endet.
      description_fr: |
        La date et l'heure auxquelles la séance ou le vote se termine.

  optional:
    range: boolean
    description: |
      Indicates if the meeting or voting is optional.
    annotations:
      description_de: |
        Gibt an, ob die Sitzung oder Abstimmung optional ist.
      description_fr: |
        Indique si la séance ou le vote est facultatif.

  agenda_item_ids:
    description: |
      The agenda items associated with the voting.
    annotations:
      description_de: |
        Die Traktanden, die mit der Abstimmung verbunden sind.
      description_fr: |
        Les points de l'ordre du jour associés au vote.
    range: string
    multivalued: true
    inlined_as_list: true

  seat_nr:
    description: |
      The seat number of the individual vote, if applicable.
    annotations:
      description_de: |
        Die Sitznummer der Einzelstimme, falls zutreffend.
      description_fr: |
        Le numéro de siège correspondant à la voix individuelle, le cas échéant.
    range: string

  weight:
    description: |
      The number of votes held by the individual, if applicable (e.g., in cases where a person has multiple votes).
    annotations:
      description_de: |
        Die Anzahl der Stimmen, die die Einzelperson hat, falls zutreffend (z.B. in Fällen, in denen eine Person mehrere Stimmen hat).
      description_fr: |
        Le nombre de voix dont dispose la personne, le cas échéant (p. ex. lorsqu'une personne détient plusieurs voix).
    range: integer

  count:
    description: |
      The count of votes for the total other category.
    annotations:
      description_de: |
        Die Anzahl der Stimmen für die Kategorie „Andere“.
      description_fr: |
        Le nombre de voix pour la catégorie « autres ».
    range: integer

  parent_voting:
    slot_uri: ops:parentVoting
    description: |
      The ID of the voting associated with the individual vote.
    annotations:
      description_de: |
        Die ID der Abstimmung, die mit der Einzelstimme verbunden ist.
      description_fr: |
        L'identifiant du vote auquel se rattache la voix individuelle.
    range: Voting

  parent_attendance:
    slot_uri: ops:parentAttendance
    description: |
      The Attendance aggregate this individual attendance record belongs to.
    annotations:
      description_de: |
        Das Attendance-Aggregat, zu dem dieser einzelne Anwesenheits-Eintrag gehört.
      description_fr: |
        L'agrégat Attendance auquel appartient cette constatation individuelle de présence.
    range: Attendance

  parent_agenda_item:
    description: |
      Identifier of the agenda item this record belongs to. On an agenda item it builds a hierarchy of agenda items; on a voting, election or speech it names the agenda item under which the record was handled.
    annotations:
      description_de: |
        Identifikator des Traktandums, zu dem dieser Eintrag gehört. Bei einem Traktandum baut er eine Hierarchie von Traktanden auf, bei Abstimmung, Wahl oder Wortmeldung bezeichnet er das Traktandum, unter dem der Eintrag behandelt wurde.
      description_fr: |
        Identifiant du point de l'ordre du jour auquel cet enregistrement se rattache. Pour un point de l'ordre du jour, il construit une hiérarchie de points ; pour un vote, une élection ou une intervention, il désigne le point sous lequel l'enregistrement a été traité.
    range: string

  parent_protocol:
    slot_uri: ops:parentProtocol
    description: |
      The protocol in which the voting or election is recorded. A vote is held during the sitting and is therefore anchored in the minutes, not in the agenda planned beforehand.
    annotations:
      description_de: |
        Das Protokoll, in dem die Abstimmung oder Wahl festgehalten ist. Abgestimmt wird im Verlauf der Sitzung; die Abstimmung hängt deshalb am Protokoll und nicht an der vorgängig geplanten Traktandenliste.
      description_fr: |
        Le procès-verbal dans lequel le vote ou l'élection est consigné. Un vote a lieu au cours de la séance et se rattache donc au procès-verbal et non à l'ordre du jour planifié à l'avance.
    range: Protocol

  parent_protocol_item:
    slot_uri: ops:parentProtocolItem
    description: |
      The recorded agenda item (ProtocolItem) under which the voting or election took place. Omitted when the vote was taken without an agenda item; the link to the sitting is then given by parent_protocol and parent_meeting alone.
    annotations:
      description_de: |
        Das protokollierte Traktandum (ProtocolItem), unter dem abgestimmt oder gewählt wurde. Entfällt, wenn ohne Traktandierung abgestimmt wurde; die Zuordnung zur Sitzung ergibt sich dann allein aus parent_protocol und parent_meeting.
      description_fr: |
        Le point consigné au procès-verbal (ProtocolItem) sous lequel le vote ou l'élection a eu lieu. Absent lorsque le vote a eu lieu sans point de l'ordre du jour ; le rattachement à la séance découle alors uniquement de parent_protocol et parent_meeting.
    range: ProtocolItem

  has_resolution:
    description: |
      The resolution or decision taken on this agenda item.
    annotations:
      description_de: |
        Die Resolution oder Entscheidung zu diesem Traktandum.
      description_fr: |
        La décision prise sur ce point de l'ordre du jour.
    range: Resolution

  joint_debates:
    slot_uri: ops:jointDebate
    description: |
      Joint debates in which this agenda item is deliberated together with other agenda items.
    annotations:
      description_de: |
        Gemeinsame Beratungen, in denen dieses Traktandum zusammen mit anderen Traktanden behandelt wird.
      description_fr: |
        Délibérations communes dans lesquelles ce point de l'ordre du jour est traité conjointement avec d'autres points.
    range: JointDebate
    multivalued: true
    inlined_as_list: true

  joint_agenda_item_ids:
    slot_uri: ops:jointAgendaItem
    description: |
      Identifiers of the agenda items (AgendaItem or ProtocolItem) debated jointly.
    annotations:
      description_de: |
        Identifikatoren der gemeinsam behandelten Traktanden (AgendaItem oder ProtocolItem).
      description_fr: |
        Identifiants des points de l'ordre du jour traités conjointement (AgendaItem ou ProtocolItem).
    range: string
    multivalued: true

  url:
    description: |
      Landing page or further web address, multilingual.
    annotations:
      description_de: |
        Landing Page oder weiterführende Webadresse, mehrsprachig.
      description_fr: |
        Page d'accueil ou adresse web complémentaire, multilingue.
    range: MultilingualString
    multivalued: true
    inlined_as_list: true

  number:
    description: |
      Sequential number, e.g. within the legislature, the session or the year.
    annotations:
      description_de: |
        Laufende Nummer, z.B. innerhalb der Legislatur, der Session oder des Jahres.
      description_fr: |
        Numéro courant, p. ex. au sein de la législature, de la session ou de l'année.

  meeting_abbreviation:
    description: |
      Short designation of the session or meeting (e.g. "FS24" for the 2024 spring session).
    annotations:
      description_de: |
        Kurzbezeichnung der Session oder Sitzung (z.B. „FS24“ für die Frühjahrssession 2024).
      description_fr: |
        Désignation abrégée de la session ou de la séance (p. ex. « FS24 » pour la session de printemps 2024).

  group_name:
    description: |
      Name of the group or body in plain text, in addition to the reference `group_id`.
    annotations:
      description_de: |
        Name der Gruppe oder des Gremiums im Klartext, zusätzlich zur Referenz `group_id`.
      description_fr: |
        Nom du groupe ou de l'organe en clair, en complément de la référence `group_id`.
    range: string

  group_id:
    description: |
      Reference to the group or body (lightweight snapshot at time of linking).
    annotations:
      description_de: |
        Referenz auf die Gruppe oder das Gremium (Momentaufnahme zum Zeitpunkt der Verknüpfung).
      description_fr: |
        Référence au groupe ou à l'organe (instantané au moment de la mise en relation).
    range: GroupReference
    inlined: true

  landing_page:
    slot_uri: ops:landingPage
    description: |
      URL providing further information.
    annotations:
      description_de: |
        URL mit weiteren Informationen.
      description_fr: |
        URL fournissant des informations complémentaires.

  tie_breaker:
    range: boolean
    description: |
      Indicates if a tie-breaker was used in the voting.
    annotations:
      description_de: |
        Gibt an, ob ein Stichentscheid bei der Abstimmung verwendet wurde.
      description_fr: |
        Indique si une voix prépondérante a été utilisée lors du vote.

  label_yes:
    range: string
    description: |
      Meaning of a 'yes' vote.
    annotations:
      description_de: |
        Bedeutung einer „Ja“-Stimme.
      description_fr: |
        Signification d'une voix « oui ».

  label_no:
    range: string
    description: |
      Meaning of a 'no' vote.
    annotations:
      description_de: |
        Bedeutung einer „Nein“-Stimme.
      description_fr: |
        Signification d'une voix « non ».

  label_abstention:
    range: string
    description: |
      Meaning of an 'abstention' vote.
    annotations:
      description_de: |
        Bedeutung einer Enthaltungsstimme.
      description_fr: |
        Signification d'une abstention.

  total_count_yes:
    range: integer
    description: |
      Total number of 'yes' votes.
    annotations:
      description_de: |
        Gesamtzahl der „Ja“-Stimmen.
      description_fr: |
        Nombre total de voix « oui ».

  total_count_no:
    range: integer
    description: |
      Total number of 'no' votes.
    annotations:
      description_de: |
        Gesamtzahl der „Nein“-Stimmen.
      description_fr: |
        Nombre total de voix « non ».

  total_count_abstention:
    range: integer
    description: |
      Total number of abstentions.
    annotations:
      description_de: |
        Gesamtzahl der Enthaltungen.
      description_fr: |
        Nombre total d'abstentions.

  total_other:
    range: TotalOther
    multivalued: true
    inlined_as_list: true
    description: |
      Used when multiple options are presented for voting (e.g., 5 buttons in Zurich).
    annotations:
      description_de: |
        Wird verwendet, wenn mehrere Optionen zur Abstimmung gestellt werden (z.B. 5 Knöpfe in Zürich).
      description_fr: |
        Utilisé lorsque plusieurs options sont soumises au vote (p. ex. 5 boutons à Zurich).

  total_absent:
    range: integer
    description: |
      Total number of absent members. Distinction between absent/excused absent - presence is tracked on attendance list.
    annotations:
      description_de: |
        Gesamtzahl abwesender Mitglieder. Unterscheidung zwischen abwesend/entschuldigt abwesend - Anwesenheit wird auf Anwesenheitsliste verfolgt.
      description_fr: |
        Nombre total de membres absents. La distinction entre absent et absent excusé se fait dans la liste de présence.

  total:
    range: integer
    description: |
      Total number of votes, excluding absent and president's vote.
    annotations:
      description_de: |
        Gesamtzahl der Stimmen, ohne abwesende und Präsidiumsstimmen.
      description_fr: |
        Nombre total de voix, sans les absents ni la voix de la présidence.

  majority_type:
    range: MajorityTypeEnum
    description: |
      Type of majority required for the vote (absolute, two-thirds, etc.).
    annotations:
      description_de: |
        Art der für die Abstimmung erforderlichen Mehrheit (absolut, Zweidrittel usw.).
      description_fr: |
        Type de majorité requise pour le vote (absolue, deux tiers, etc.).

  majority_count:
    range: integer
    description: |
      Number of votes required for the relevant majority threshold.
    annotations:
      description_de: |
        Anzahl der Stimmen, die für die relevante Mehrheitsschwelle erforderlich sind.
      description_fr: |
        Nombre de voix requis pour atteindre le seuil de majorité déterminant.

  result_text:
    range: string
    description: |
      Free text describing the outcome of the vote, e.g., "Accepted with 78 votes".
    annotations:
      description_de: |
        Freitext zur Beschreibung des Ergebnisses der Abstimmung, z.B. „Mit 78 Stimmen angenommen“.
      description_fr: |
        Texte libre décrivant le résultat du vote, p. ex. « Accepté par 78 voix ».


  state:
    description: |
      Whether the meeting takes place as planned at all (planned, canceled, postponed). A diverging, free-text designation goes into `state_name`.
    annotations:
      description_de: |
        Ob die Sitzung überhaupt wie vorgesehen stattfindet (geplant, abgesagt, verschoben). Eine abweichende, freitextliche Bezeichnung nimmt `state_name` auf.
      description_fr: |
        Indique si la séance a lieu comme prévu (planifiée, annulée, reportée). Une désignation divergente, en texte libre, est reprise dans `state_name`.
    range: StateEnum

  status:
    description: |
      Free status designation, used where the state enumeration does not apply.
    annotations:
      description_de: |
        Freie Statusbezeichnung, dort verwendet, wo das Status-Enum nicht zutrifft.
      description_fr: |
        Désignation libre de l'état, utilisée là où l'énumération des états ne s'applique pas.

  type:
    description: |
      Generic type designation.
    annotations:
      description_de: |
        Generische Typbezeichnung.
      description_fr: |
        Désignation générique du type.

  description:
    description: |
      Descriptive text of the element.
    annotations:
      description_de: |
        Beschreibender Text zum Element.
      description_fr: |
        Texte descriptif de l'élément.

  location:
    description: |
      Place where the meeting is held — the physical room ("Federal Palace, National Council chamber"), a video conference or a hybrid format.
    annotations:
      description_de: |
        Ort, an dem die Sitzung stattfindet — der physische Raum („Bundeshaus, Nationalratssaal“), eine Videokonferenz oder ein hybrides Format.
      description_fr: |
        Lieu où se tient la séance — la salle physique (« Palais fédéral, salle du Conseil national »), une visioconférence ou un format hybride.

  position:
    description: |
      Integer position within the superordinate sequence.
    annotations:
      description_de: |
        Ganzzahlige Position innerhalb der übergeordneten Reihenfolge.
      description_fr: |
        Position (nombre entier) au sein de la séquence supérieure.

  result:
    description: |
      Result of the procedure.
    annotations:
      description_de: |
        Ergebnis des Verfahrens.
      description_fr: |
        Résultat de la procédure.

  title:
    description: |
      Title of the element.
    annotations:
      description_de: |
        Titel des Elements.
      description_fr: |
        Titre de l'élément.

  category:
    description: |
      Category of the element.
    annotations:
      description_de: |
        Kategorie des Elements.
      description_fr: |
        Catégorie de l'élément.

  legislatures:
    slot_uri: ops:legislature
    description: |
      Collection of legislature records.
    annotations:
      description_de: |
        Sammlung der Legislaturperioden.
      description_fr: |
        Ensemble des législatures.
    range: Legislature
    multivalued: true
    inlined_as_list: true

  sessions:
    slot_uri: ops:session
    description: |
      Collection of session records.
    annotations:
      description_de: |
        Sammlung der Sessionen.
      description_fr: |
        Ensemble des sessions.
    range: Session
    multivalued: true
    inlined_as_list: true

  meetings:
    slot_uri: ops:meeting
    description: |
      Collection of meeting records.
    annotations:
      description_de: |
        Sammlung der Sitzungen.
      description_fr: |
        Ensemble des séances.
    range: Meeting
    multivalued: true
    inlined_as_list: true

  agenda_items:
    slot_uri: ops:agendaItem
    description: |
      Collection of agenda item records.
    annotations:
      description_de: |
        Sammlung der Traktanden.
      description_fr: |
        Ensemble des points de l'ordre du jour.
    range: AgendaItem
    multivalued: true
    inlined_as_list: true

  protocols:
    slot_uri: ops:protocol
    description: |
      Collection of protocol records.
    annotations:
      description_de: |
        Sammlung der Protokolle.
      description_fr: |
        Ensemble des procès-verbaux.
    range: Protocol
    multivalued: true
    inlined_as_list: true

  has_protocol:
    slot_uri: ops:hasProtocol
    description: |
      Reference to the protocol (minutes) of this meeting, recorded after the meeting. Only the identifier of the protocol is given; the protocol itself is delivered in the container's `protocols` list. It is an entity in its own right with its own identifier and is usually published later than the meeting, so it is referenced rather than embedded.
    annotations:
      description_de: |
        Referenz auf das nach der Sitzung erstellte Protokoll dieser Sitzung. Angegeben wird nur der Identifikator des Protokolls; das Protokoll selbst wird in der Liste `protocols` des Containers geliefert. Es ist eine eigenständige Entität mit eigenem Identifikator und wird in der Regel später veröffentlicht als die Sitzung, weshalb es referenziert und nicht eingebettet wird.
      description_fr: |
        Référence au procès-verbal de cette séance, établi après celle-ci. Seul l'identifiant du procès-verbal est indiqué ; le procès-verbal lui-même est livré dans la liste `protocols` du conteneur. Il constitue une entité à part entière dotée de son propre identifiant et est en règle générale publié après la séance, raison pour laquelle il est référencé et non imbriqué.
    range: Protocol

  protocol_items:
    slot_uri: ops:protocolItem
    description: |
      Agenda items as actually recorded in the protocol.
    annotations:
      description_de: |
        Traktanden, wie sie im Protokoll tatsächlich festgehalten wurden.
      description_fr: |
        Points de l'ordre du jour tels qu'ils ont effectivement été consignés au procès-verbal.
    range: ProtocolItem
    multivalued: true
    inlined_as_list: true

  text_segments:
    slot_uri: ops:textSegment
    description: |
      Collection of text segments (e.g. verbatim protocol).
    annotations:
      description_de: |
