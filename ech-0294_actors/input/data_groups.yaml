# Beispiele für Gruppen und Organe unterschiedlicher Typen. Alle Einträge sind
# echte Fälle aus der Plattform openparldata.ch; `global_uri` verweist auf den
# jeweiligen API-Datensatz, `local_id` ist die dortige Kennung.
#
# `group_type` zeigt das Zusammenspiel von kontrolliertem Vokabular
# (`group_type_enum`) und der herkunftsspezifischen Bezeichnung (`label`):
# Der Enum-Wert macht Gruppen über Kantone und Ebenen hinweg vergleichbar,
# das Label bewahrt die Benennung der publizierenden Stelle.
global_uri: act:groups_example
groups:
  # Interessengruppe der Bundesversammlung
  - local_id: 9136
    global_uri: https://api.openparldata.ch/v1/groups/9136
    label: Frauen
    group_type:
      group_type_enum: interest_group
      label: Interessengruppe
    spatial: https://ld.admin.ch/country/CHE
    valid_from: 2020-01-01

  # Gemeindeparlament — `spatial` verweist auf die BFS-Gemeindenummer
  - local_id: 700
    global_uri: https://api.openparldata.ch/v1/groups/700
    label: Stadtparlament St. Gallen
    group_type:
      group_type_enum: parliament
      label: Parlament (Legislativrat)
    spatial: https://ld.admin.ch/municipality/3203

  # Fraktion im Grossen Rat Basel-Stadt
  - local_id: 20
    global_uri: https://api.openparldata.ch/v1/groups/20
    label: Evangelische Volkspartei
    group_type:
      group_type_enum: faction
      label: Fraktion
    spatial: https://ld.admin.ch/canton/12

  # Ständige Kommission mit gebräuchlicher Abkürzung
  - local_id: 3
    global_uri: https://api.openparldata.ch/v1/groups/3
    label: Geschäftsprüfungskommission
    abbreviation:
      - value: GPK
        language: de
    group_type:
      group_type_enum: commission
      label: Kommission
    spatial: https://ld.admin.ch/canton/15

  # Ratsbüro
  - local_id: 50
    global_uri: https://api.openparldata.ch/v1/groups/50
    label: Büro des Grossen Rates
    group_type:
      group_type_enum: parliamentary_bureau
      label: Ratsbüro
    spatial: https://ld.admin.ch/canton/12

  # Delegation in ein interkantonales Gremium
  - local_id: 5000
    global_uri: https://api.openparldata.ch/v1/groups/5000
    label: Freiburger Delegation IPK strafrechtliche Einschliessung
    group_type:
      group_type_enum: delegation
      label: Delegation
    spatial: https://ld.admin.ch/canton/10
    valid_from: 2007-12-12
