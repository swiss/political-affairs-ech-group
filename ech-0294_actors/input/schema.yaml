# HEADER 
# ----------------------------------------------------------------

id: https://ld.ech.ch/schema/0294/actors
name: actors-schema
title: "eCH-0294 – Political Actors: Persons, Groups and Bodies"
description: |
  A schema describing political actors including persons, groups, memberships, and interest links.
annotations:
  description_de: |
    Ein Schema zur Beschreibung politischer Akteure einschliesslich Personen, Gruppen, Mitgliedschaften und Interessenbindungen.
  description_fr: |
    Un schéma décrivant les acteurs politiques, y compris les personnes, les groupes, les affiliations et les liens d'intérêts.
license: CC-BY
prefixes:
  linkml: https://w3id.org/linkml/
  act: https://ld.ech.ch/schema/0294/actors/
  ch: https://ld.admin.ch/
  dcterms: http://purl.org/dc/terms/
default_prefix: act
default_range: string
imports:
  - linkml:types
  - ../../ech-0292_meta/input/schema_common

# CLASSES
# ----------------------------------------------------------------

classes:
  Container:
    tree_root: true
    description: |
      Container for political actors, groups, and relationships.
    annotations:
      description_de: |
        Container für politische Akteure, Gruppen und Beziehungen.
      description_fr: |
        Conteneur pour les acteurs politiques, les groupes et les relations.
    mixins:
      - HasIdentification
    slots:
      - persons
      - groups
      - memberships
      - interest_links

  Person:
    description: |
      A person with identifiers, names, addresses, citizenships, and occupations.
    annotations:
      description_de: |
        Eine Person mit Identifikatoren, Namen, Adressen, Staatsbürgerschaften und Berufen.
      description_fr: |
        Une personne avec des identifiants, des noms, des adresses, des nationalités et des professions.
    mixins:
      - HasIdentification
      - HasCreationModificationDates
    slots:
      - label # Mandatory short display name to identify the person within the organisation (e.g. added birthyear).
      - label_long # Display name with academic titles.
      - birth_year
      - birth_date
      - death_date
      - picture
      - names
      - addresses
      - language_proficiencies
      - citizenships
      - genders
      - occupations
      - trainings
      - contacts
      - interest_links
    slot_usage:
      label:
        description: |
          Mandatory short display name to identify the person within the organisation (e.g. with added birth year to distinguish persons with the same name). Preferred: PersonOfficialName combined with PersonCallFirstName.
        annotations:
          description_de: |
            Obligatorischer Kurzname zur Identifikation der Person innerhalb der Organisation (z.B. mit Geburtsjahr zur Unterscheidung von Personen mit gleichem Namen). Bevorzugt: PersonOfficialName (amtlicher Name) kombiniert mit PersonCallFirstName (Rufname).
          description_fr: |
            Nom d'affichage court et obligatoire permettant d'identifier la personne au sein de l'organisation (p. ex. avec l'ajout de l'année de naissance afin de distinguer des personnes portant le même nom). Recommandé : PersonOfficialName combiné avec PersonCallFirstName.
        required: true
      label_long:
        description: |
          Optional long display name including academic titles and full official name (e.g. "Dr. Maria Muster-Beispiel").
        annotations:
          description_de: |
            Optionaler langer Anzeigename mit akademischen Titeln und vollständigem amtlichem Namen (z.B. "Dr. Maria Muster-Beispiel").

          description_fr: |
            Nom d'affichage long et facultatif comprenant les titres académiques et le nom officiel complet (p. ex. « Dr. Maria Muster-Beispiel »).
  Group:
    description: |
      A political group, organization, or body (e.g., party, committee, parliament, department).
    annotations:
      description_de: |
        Eine politische Gruppe, Organisation oder Körperschaft (z.B. Partei, Kommission, Parlament, Departement).
      description_fr: |
        Un groupe, une organisation ou une collectivité politique (p. ex. parti, commission, parlement, département).
    mixins:
      - HasIdentification
      - HasCreationModificationDates
      - HasTemporalValidity
    slots:
      - group_type
      - label
      - abbreviation
      - description
      - organization_uid
      - legal_form
      - landing_page
      - parent_groups
      - spatial
      - contacts
      - addresses
      - statutes_url
      - party_color
    slot_usage:
      group_type:
        required: true
      label:
        # Unlike a person, whose display name is the same in every language, a
        # group is often published officially in several languages (e.g. "Frauen"
        # / "Femmes"). The label therefore carries the text together with its
        # language code, one entry per language.
        description: |
          Name of the group, with the language it is published in. Where a group is officially named in several languages, one entry per language is recorded.
        annotations:
          description_de: |
            Bezeichnung der Gruppe mit der Sprache, in der sie publiziert wird. Ist eine Gruppe amtlich in mehreren Sprachen benannt, wird pro Sprache ein Eintrag erfasst.
          description_fr: |
            Désignation du groupe avec la langue dans laquelle elle est publiée. Lorsqu'un groupe porte officiellement un nom dans plusieurs langues, une entrée est saisie par langue.
        required: true
        range: MultilingualValue
        multivalued: true
        inlined_as_list: true

  # PersonReference and GroupReference moved to ech-0292_meta/schema_common
  # (shared lightweight references, imported here and by ech-0293_operations).

  Membership:
    description: |
      A membership relationship between a person and a group, representing formal affiliation (e.g., party member, commission member, parliamentarian). Distinct from InterestLink, which covers external interest bindings and conflicts of interest to organizations outside the actor schema.
    annotations:
      description_de: |
        Eine Mitgliedschaftsbeziehung zwischen einer Person und einer Gruppe, die eine formale Zugehörigkeit darstellt (z.B. Parteimitglied, Kommissionsmitglied, Parlamentarier/in). Im Unterschied zu InterestLink, der externe Interessenbindungen und Interessenkonflikte zu Organisationen ausserhalb des Akteur-Schemas abbildet.
      description_fr: |
        Une relation d'affiliation entre une personne et un groupe, représentant une appartenance formelle (p. ex. membre d'un parti, membre d'une commission, parlementaire). À distinguer de InterestLink, qui recouvre les liens d'intérêts externes et les conflits d'intérêts avec des organisations situées en dehors du schéma des acteurs.
    mixins:
      - HasIdentification
      - HasCreationModificationDates
      - HasTemporalValidity
    slots:
      - person_reference
      - group_reference
      - electoral_district
      - role_type
      - authorized_to_vote
      - is_active
    slot_usage:
      person_reference:
        required: true
      group_reference:
        required: true
      is_active:
        description: |
          Indicates if the membership is currently active. Can complement or replace `valid_from`/`valid_through`. If not set, activity is derived from the temporal validity fields.
        annotations:
          description_de: |
            Gibt an, ob die Mitgliedschaft derzeit aktiv ist. Kann `valid_from`/`valid_through` ergänzen oder ersetzen. Wenn nicht gesetzt, wird die Aktivität aus den zeitlichen Gültigkeitsfeldern abgeleitet.

          description_fr: |
            Indique si l'affiliation est actuellement active. Peut compléter ou remplacer `valid_from`/`valid_through`. Si cette valeur n'est pas renseignée, l'activité est déduite des champs de validité temporelle.
  InterestLink:
    description: |
      An interest link (conflict of interest, political financing) of a person to an organization outside the actor schema.
    annotations:
      description_de: |
        Eine Interessenbindung (Interessenkonflikt, Politikfinanzierung) einer Person zu einer Organisation ausserhalb des Akteur-Schemas.
      description_fr: |
        Un lien d'intérêts (conflit d'intérêts, financement politique) d'une personne avec une organisation située en dehors du schéma des acteurs.
    mixins:
      - HasIdentification
      - HasCreationModificationDates
      - HasTemporalValidity
    slots:
      - person_reference
      - interest_type
      - organization_name
      - organization_uid
      - organization_address
      - legal_form
      - is_paid
      - committee
      - function_role
    slot_usage:
      person_reference:
        required: true
    any_of:
      - slot_conditions:
          organization_uid:
            required: true
      - slot_conditions:
          organization_name:
            required: true

  Name:
    description: |
      A name with a type (e.g., call name, official name), a value, and a temporal validity.
    annotations:
      description_de: |
        Ein Name mit einem Typ (z.B. Rufname, amtlicher Name) und einem Wert und einer zeitlichen Gültigkeit.
      description_fr: |
        Un nom avec un type (p. ex. nom d'usage, nom officiel), une valeur et une validité temporelle.
    mixins:
      - HasTemporalValidity
    slots:
      - name_type
      - value
    slot_usage:
      name_type:
        required: true
      value:
        required: true

  Address:
    description: |
      An address with a type (e.g., private address, business address) and a value.
    annotations:
      description_de: |
        Eine Adresse mit einem Typ (z.B. Privatadresse, Geschäftsadresse) und einem Wert.
      description_fr: |
        Une adresse avec un type (p. ex. adresse privée, adresse professionnelle) et une valeur.
    slots:
      - address_type
      - address_uri
      - street_address
      - postal_code
      - postal_locality
      - country
    any_of:
      - slot_conditions:
          postal_locality:
            required: true
      - slot_conditions:
          address_uri:
            required: true

  LanguageProficiency:
    description: |
      Language proficiency of a person indicating the language and whether it is the preferred language or native language.
    annotations:
      description_de: |
        Sprachkenntnisse einer Person mit Angabe der Sprache und ob es sich um die bevorzugte Sprache oder die Muttersprache handelt.
      description_fr: |
        Compétences linguistiques d'une personne indiquant la langue et le fait qu'il s'agisse ou non de la langue préférée ou de la langue maternelle.
    slots:
      - language
      - is_correspondence
      - is_native
    slot_usage:
      language:
        required: true

  Citizenship:
    description: |
      Citizenship (also used for Nationality) of a person indicating the country and temporal validity. If there is no `valid_from` provided, the information is not known. If it is known that the citizenship is valid from birth, the birthdate is to be repeated here. If there is no `valid_through`, the citizenship is still active.
    annotations:
      description_de: |
        Staatsangehörigkeit (wird auch für Nationalität verwendet) einer Person unter Angabe des Landes und der zeitlichen Gültigkeit. Wenn kein `valid_from` angegeben ist, ist diese Information nicht bekannt. Ist bekannt, dass die Staatsangehörigkeit seit der Geburt gültig ist, ist das Geburtsdatum hier anzugeben. Wenn kein `valid_through` angegeben ist, ist die Staatsangehörigkeit weiterhin gültig.
      description_fr: |
        Nationalité (également utilisée pour la citoyenneté) d'une personne indiquant le pays et la validité temporelle. Si aucun `valid_from` n'est fourni, cette information n'est pas connue. S'il est établi que la nationalité est valable depuis la naissance, la date de naissance doit être répétée ici. En l'absence de `valid_through`, la nationalité est toujours en vigueur.
    mixins:
      - HasTemporalValidity
    slots:
      - country
    slot_usage:
      country:
        required: true

  Gender:
    description: |
      Gender of a person indicating a gender code and temporal validity.
    annotations:
      description_de: |
        Geschlecht einer Person mit Angabe eines Geschlechtscodes und der zeitlichen Gültigkeit.
      description_fr: |
        Sexe d'une personne indiquant un code de sexe et la validité temporelle.
    mixins:
      - HasTemporalValidity
    slots:
      - gender_code
      - label
      - pronouns
    slot_usage:
      gender_code:
        required: true

  Occupation:
    description: |
      Occupation or profession of a person indicating a label, an ISCO-19 code, whether the activity is paid, and temporal validity.
    annotations:
      description_de: |
        Beruf oder Tätigkeit einer Person mit Angabe eines Labels, eines ISCO-19 Codes, ob die Tätigkeit bezahlt ist, und der zeitlichen Gültigkeit.
      description_fr: |
        Métier ou profession d'une personne indiquant un libellé, un code ISCO-19, si l'activité est rémunérée, ainsi que la validité temporelle.
    mixins:
      - HasTemporalValidity
    slots:
      - is_paid
      - occupation_code
      - label
      - organization_uid
      - organization_name
    any_of:
      - slot_conditions:
          occupation_code:
            required: true
      - slot_conditions:
          label:
            required: true

  Training:
    description: |
      Training or education of a person indicating a type (e.g., school diploma, university degree, military service), a label, an ISCO-19 code, and temporal validity.
    annotations:
      description_de: |
        Ausbildung oder Bildung einer Person mit Angabe eines Typs (z.B. Schulabschluss, Universitätsabschluss, Militärdienst), eines Labels, eines ISCO-19 Codes und der zeitlichen Gültigkeit.
      description_fr: |
        Formation ou éducation d'une personne indiquant un type (p. ex. diplôme scolaire, diplôme universitaire, service militaire), un libellé, un code ISCO-19 et la validité temporelle.
    mixins:
      - HasTemporalValidity
    slots:
      - training_type
      - training_code
      - value
    any_of:
      - slot_conditions:
          training_type:
            required: true
      - slot_conditions:
          training_code:
            required: true
      - slot_conditions:
          value:
            required: true

  Contact:
    description: |
      Contact information of a person indicating a type (e.g., email, LinkedIn) and a value.
    annotations:
      description_de: |
        Kontaktinformation einer Person mit Angabe eines Typs (z.B. E-Mail, LinkedIn) und eines Werts.
      description_fr: |
        Informations de contact d'une personne indiquant un type (p. ex. e-mail, LinkedIn) et une valeur.
    slots:
      - contact_type
      - value
      - label
    slot_usage:
      contact_type:
        required: true
      value:
        required: true

  ElectoralDistrict:
    description: |
      Electoral district or region associated with a membership. The temporal validity is inherited from the enclosing membership.
    annotations:
      description_de: |
        Wahlkreis oder Wahlregion, die einer Mitgliedschaft zugeordnet ist. Die zeitliche Gültigkeit wird von der umschliessenden Mitgliedschaft übernommen.
      description_fr: |
        Circonscription ou région électorale associée à une affiliation. La validité temporelle est héritée de l'affiliation englobante.
    mixins:
      - HasIdentification
    slots:
      - label
    slot_usage:
      global_uri:
        description: |
          For IRI references, LINDAS resources should be used.
          The IRIs for the different administrative levels of Swiss spatial units are available at: https://ld.admin.ch/country/CHE.
          Under links in the schema:containsPlace section, the desired level can be selected.
          Examples for each administrative level:
          - Country - Switzerland: https://ld.admin.ch/country/CHE
          - Canton - Aargau: https://ld.admin.ch/canton/19
          - District - Brig: https://ld.admin.ch/district/2301
          - Municipality - Versoix: https://ld.admin.ch/municipality/6644
        annotations:
          description_de: |
            Für IRI-Referenzen sollen die LINDAS-Ressourcen verwendet werden.
            Die IRI für die verschiedenen Verwaltungsebenen der Schweizer Raumeinheiten sind bei LINDAS zu finden: https://ld.admin.ch/country/CHE.
            Unter den Links im Abschnitt schema:containsPlace kann die gewünschte Ebene gefunden werden.
            Beispiele für die einzelnen Verwaltungsebenen:
            - Land - Schweiz: https://ld.admin.ch/country/CHE
            - Kanton - Aargau: https://ld.admin.ch/canton/19
            - Bezirk - Brig: https://ld.admin.ch/district/2301
            - Gemeinde - Versoix: https://ld.admin.ch/municipality/6644
          description_fr: |
            Pour les références IRI, les ressources LINDAS doivent être utilisées.
            Les IRI des différents niveaux administratifs des unités spatiales suisses sont disponibles à l'adresse : https://ld.admin.ch/country/CHE.
            Sous les liens de la section schema:containsPlace, le niveau souhaité peut être sélectionné.
            Exemples pour chaque niveau administratif :
            - Pays - Suisse : https://ld.admin.ch/country/CHE
            - Canton - Argovie : https://ld.admin.ch/canton/19
            - District - Brigue : https://ld.admin.ch/district/2301
            - Commune - Versoix : https://ld.admin.ch/municipality/6644

  GroupType:
    description: |
      Type of group (e.g., party, committee, parliament, department).
    annotations:
      description_de: |
        Art der Gruppe (z.B. Partei, Kommission, Parlament, Departement).
      description_fr: |
        Type de groupe (p. ex. parti, commission, parlement, département).
    slots:
      - group_type_enum
      - label
    slot_usage:
      # The type designation follows the group's name: a body published in
      # several languages also carries its type designation in each of them.
      label:
        description: |
          Designation of the type as used by the publishing body, with the language it is published in. Where a body publishes the designation in several languages, one entry per language is recorded.
        annotations:
          description_de: |
            Bezeichnung des Typs, wie ihn die publizierende Stelle verwendet, mit der Sprache, in der sie publiziert wird. Publiziert eine Stelle die Bezeichnung in mehreren Sprachen, wird pro Sprache ein Eintrag erfasst.
          description_fr: |
            Désignation du type telle que l'emploie l'organe qui la publie, avec la langue dans laquelle elle est publiée. Lorsqu'un organe publie la désignation en plusieurs langues, une entrée est saisie par langue.
        range: MultilingualValue
        multivalued: true
        inlined_as_list: true

  RoleType:
    description: |
      Role of a person in a membership or function (e.g., member, president, deputy). If a role is not listed in the proposed RoleEnum vocabulary, the value 'other' can be used, and a descriptive label should be provided in the `role_label` slot. The label can also be used when a specific name is needed, even if a fitting semantic value exists in `role_type_enum`; it should be provided when `role_type_enum` is set to 'other'.
    annotations:
      description_de: |
        Rolle einer Person in einer Mitgliedschaft oder Funktion (z.B. Mitglied, Präsident/in, Stellvertreter/in). Wenn eine Rolle im vorgeschlagenen RoleEnum-Vokabular nicht enthalten ist, kann der Wert 'other' verwendet werden; in diesem Fall soll im Slot `role_label` eine beschreibende Bezeichnung angegeben werden. Die Bezeichnung kann auch verwendet werden, wenn eine spezifische Rollenbezeichnung nötig ist, selbst wenn in `role_type_enum` bereits ein passender semantischer Wert vorhanden ist; bei `role_type_enum = other` soll sie angegeben werden.
      description_fr: |
        Rôle d'une personne dans une affiliation ou une fonction (p. ex. membre, président, suppléant). Si un rôle ne figure pas dans le vocabulaire RoleEnum proposé, la valeur « other » peut être utilisée, et un libellé descriptif doit être fourni dans le slot `role_label`. Le libellé peut également être utilisé lorsqu'une désignation spécifique est nécessaire, même s'il existe une valeur sémantique appropriée dans `role_type_enum` ; il doit être fourni lorsque `role_type_enum` est réglé sur « other ».
    slots:
      - role_type_enum
      - role_label
    any_of:
      - slot_conditions:
          role_type_enum:
            required: true
      - slot_conditions:
          role_label:
            required: true
    rules:
      - description: If the role type is 'other', a descriptive label must be provided.
        annotations:
          description_de: Wenn der Rollentyp 'other' ist, muss eine beschreibende Bezeichnung angegeben werden.
          description_fr: Si le type de rôle est « other », un libellé descriptif doit être fourni.
        preconditions:
          slot_conditions:
            role_type_enum:
              equals_string: other
        postconditions:
          slot_conditions:
            role_label:
              required: true

# SLOTS
# ----------------------------------------------------------------

slots:
  name_type:
    slot_uri: act:nameType
    description: |
      Type of name according to eCH-0011 (personNameData).
    annotations:
      description_de: |
        Typ des Namens gemäss eCH-0011 (personNameData).
      description_fr: |
        Type de nom selon eCH-0011 (personNameData).
    range: NameTypeEnum

  address_type:
    slot_uri: act:addressType
    description: |
      Type of address.
    annotations:
      description_de: |
        Typ der Adresse.
      description_fr: |
        Type d'adresse.
    range: AddressTypeEnum

  address_uri:
    slot_uri: act:addressURI
    description: |
      URI of the address from the Swiss federal building address register (Amtliches Gebäudeadressverzeichnis, swisstopo). The final segment of the URI is the EGAID, the federal building address identifier of that register. Example of a valid URI: https://geo.ld.admin.ch/location/address/101904050 — the same register can be browsed as a map layer at https://map.geo.admin.ch/#/map?topic=ech&layers=ch.swisstopo.amtliches-gebaeudeadressverzeichnis
    annotations:
      description_de: |
        URI der Adresse aus dem Amtlichen Gebäudeadressverzeichnis (swisstopo). Der letzte Abschnitt der URI ist die EGAID, der eidgenössische Gebäudeadressidentifikator dieses Verzeichnisses. Beispiel einer gültigen URI: https://geo.ld.admin.ch/location/address/101904050 — dasselbe Verzeichnis ist als Kartenlayer einsehbar unter https://map.geo.admin.ch/#/map?topic=ech&layers=ch.swisstopo.amtliches-gebaeudeadressverzeichnis
      description_fr: |
        URI de l'adresse issue du Répertoire officiel des adresses de bâtiments (swisstopo). Le dernier segment de l'URI est l'EGAID, l'identifiant fédéral d'adresse de bâtiment de ce répertoire. Exemple d'URI valide : https://geo.ld.admin.ch/location/address/101904050 — le même répertoire est consultable comme couche cartographique à l'adresse https://map.geo.admin.ch/#/map?topic=ech&layers=ch.swisstopo.amtliches-gebaeudeadressverzeichnis
    range: uriorcurie
    # Der Wert besteht darin, in genau diesem Namensraum zu liegen; `uriorcurie`
    # allein liesse einen map.geo.admin.ch-Permalink oder eine beliebige
    # Kartenadresse durch. Festgehalten wird deshalb der Namensraum, nicht die
    # Stellenzahl: swisstopo führt ADR_EGAID als DOUBLE ohne festgelegte Länge.
    pattern: ^https://geo\.ld\.admin\.ch/location/address/[0-9]+$

  street_address:
    slot_uri: act:streetAddress
    description: |
      Street address.
    annotations:
      description_de: |
        Strassenadresse.

      description_fr: |
        Adresse (rue).
  postal_code:
    slot_uri: act:postalCode
    description: |
      Postal code.
    annotations:
      description_de: |
        Postleitzahl.
      description_fr: |
        Code postal.
    range: integer

  postal_locality:
    slot_uri: act:postalLocality
    description: |
      Locality.
    annotations:
      description_de: |
        Ort.

      description_fr: |
        Localité.
  is_correspondence:
    slot_uri: act:isCorrespondence
    description: |
      Indicates if this is the preferred language.
    annotations:
      description_de: |
        Gibt an, ob es sich um die bevorzugte Sprache handelt.
      description_fr: |
        Indique s'il s'agit de la langue préférée.
    range: boolean

  is_native:
    slot_uri: act:isNative
    description: |
      Indicates if this is the native language.
    annotations:
      description_de: |
        Gibt an, ob es sich um die Muttersprache handelt.
      description_fr: |
        Indique s'il s'agit de la langue maternelle.
    range: boolean

  country:
    slot_uri: act:country
    description: |
      ISO 3166-1 alpha-2 country code.
    annotations:
      description_de: |
        ISO 3166-1 alpha-2 Ländercode.
      description_fr: |
        Code de pays ISO 3166-1 alpha-2.
    pattern: ^[A-Z]{2}$

  gender_code:
    slot_uri: act:genderCode
    description: |
      Gender code. Recommended values: male, female, non_binary.
    annotations:
      description_de: |
        Geschlechtscode. Empfohlene Werte: male, female, non_binary.
      description_fr: |
        Code de sexe. Valeurs recommandées : male, female, non_binary.
    range: GenderCodeEnum

  pronouns:
    slot_uri: act:pronouns
    description: |
      Pronouns used by the person.
    annotations:
      description_de: |
        Von der Person verwendete Pronomen.
      description_fr: |
        Pronoms utilisés par la personne.
    multivalued: true
    inlined_as_list: true

  is_paid:
    slot_uri: act:isPaid
    description: |
      Indicates whether the activity is paid.
    annotations:
      description_de: |
        Gibt an, ob die Tätigkeit bezahlt ist.
      description_fr: |
        Indique si l'activité est rémunérée.
    range: boolean

  occupation_code:
    slot_uri: act:occupationCode
    description: |
      ISCO-19 code of the occupation.
    annotations:
      description_de: |
        ISCO-19 Code der Tätigkeit.

      description_fr: |
        Code ISCO-19 du métier.
  training_type:
    slot_uri: act:trainingType
    description: |
      Type of training or education.
    annotations:
      description_de: |
        Typ der Ausbildung oder Bildung.
      description_fr: |
        Type de formation ou d'éducation.
    range: TrainingTypeEnum

  training_code:
    slot_uri: act:trainingCode
    description: |
      ISCO-19 code of the training or education.
    annotations:
      description_de: |
        ISCO-19 Code der Ausbildung oder Bildung.

      description_fr: |
        Code ISCO-19 de la formation ou de l'éducation.
  contact_type:
    slot_uri: act:contactType
    description: |
      Type of contact information.
    annotations:
      description_de: |
        Typ der Kontaktinformation.
      description_fr: |
        Type d'informations de contact.
    range: ContactTypeEnum

  birth_year:
    slot_uri: act:birthYear
    description: |
      Year of birth. Only to be used, if there is no full `birthDate` available.
    annotations:
      description_de: |
        Geburtsjahr. Nur zu verwenden, wenn kein vollständiges `birthDate` vorhanden ist.
      description_fr: |
        Année de naissance. À utiliser uniquement lorsqu'aucune `birthDate` complète n'est disponible.
    range: integer

  birth_date:
    slot_uri: schema:birthDate
    description: |
      Exact date of birth if available and public. This field has precedence over the field `birthYear`.
    annotations:
      description_de: |
        Genaues Geburtsdatum, sofern verfügbar und öffentlich. Dieses Feld hat Vorrang vor dem Feld `birthYear`.
      description_fr: |
        Date de naissance exacte si disponible et publique. Ce champ prime sur le champ `birthYear`.
    range: date

  death_date:
    slot_uri: schema:deathDate
    description: |
      Exact date of death.
    annotations:
      description_de: |
        Genaues Todesdatum.
      description_fr: |
        Date de décès exacte.
    range: date

  picture:
    range: uri
    description: |
      Link to an image (preferred: PNG, then JPG, then GIF).
    annotations:
      description_de: |
        Link zu einem Bild (bevorzugt: PNG, dann JPG, dann GIF).

      description_fr: |
        Lien vers une image (de préférence : PNG, puis JPG, puis GIF).
  group_type:
    range: GroupType
    slot_uri: act:groupType
    description: |
      Type of group (e.g., party, commission, parliament, or similar). The exact naming and description of the group is provided via `label`.
    annotations:
      description_de: |
        Klasse der Gruppierung, wie z.B. Partei, Kommission, Parlament oder ähnliches. Die genaue Benennung und Beschreibung der Gruppierung wird über `label` gemacht.

      description_fr: |
        Type de groupe (p. ex. parti, commission, parlement ou similaire). La désignation et la description exactes du groupe sont fournies via `label`.
  group_type_enum:
    slot_uri: act:groupTypeEnum
    description: |
      Link to the controlled vocabulary for group types.
    annotations:
      description_de: |
        Link zum kontrollierten Vokabular für Gruppentypen.
      description_fr: |
        Lien vers le vocabulaire contrôlé pour les types de groupes.
    range: GroupTypeEnum

  # abbreviation moved to ech-0292_meta/schema_common (imported)

  description:
    range: MultilingualValue
    multivalued: true
    inlined_as_list: true
    description: |
      Description of the entity.
    annotations:
      description_de: |
        Kurze Beschreibung der Gruppierung.

      description_fr: |
        Description de l'entité.
  landing_page:
    slot_uri: act:landingPage
    range: MultilingualUri
    multivalued: true
    inlined_as_list: true
    description: |
      Website providing further information. Where the site is published under a separate address per language, one entry per language is recorded.
    annotations:
      description_de: |
        Website mit weiteren Informationen. Wird die Website je Sprache unter einer eigenen Adresse publiziert, wird pro Sprache ein Eintrag erfasst.

      description_fr: |
        Site web fournissant de plus amples informations. Lorsque le site est publié à une adresse propre par langue, une entrée est saisie par langue.
  parent_groups:
    slot_uri: act:parentGroup
    description: |
      Reference to the parent groups as a GroupReference, i.e. stated by their local_id or their global_uri. Only genuine super-/subordination belongs here: the parent party of a cantonal party, the hierarchy within the executive, a sub-commission under its commission, or a parliamentary group under its parliament. (parentGroup is typically used within the same group_type, but cross-type links are permitted, e.g. parliamentary group → parliament.) The parties carrying a parliamentary group are not a superordinate group of it and are therefore not stated here.
    annotations:
      description_de: |
        Verweis auf die übergeordneten Gruppen als GroupReference, also angegeben über deren local_id oder deren global_uri. Hierher gehört nur eine echte Über-/Unterordnung: die Mutterpartei einer Kantonalpartei, die Hierarchie in der Exekutive, eine Subkommission unter ihrer Kommission oder eine Fraktion unter ihrem Parlament. (parentGroup wird typischerweise im selben group_type verwendet, typenübergreifende Verknüpfungen sind aber erlaubt, z.B. Fraktion → Parlament.) Die eine Fraktion tragenden Parteien sind ihr nicht übergeordnet und werden hier deshalb nicht angegeben.
      description_fr: |
        Référence aux groupes supérieurs sous forme de GroupReference, c'est-à-dire indiquée au moyen de leur local_id ou de leur global_uri. Seule une véritable relation de subordination y a sa place : le parti faîtier d'un parti cantonal, la hiérarchie au sein de l'exécutif, une sous-commission rattachée à sa commission ou un groupe parlementaire rattaché à son parlement. (parentGroup est généralement utilisé au sein d'un même group_type, mais les liens intertypes sont autorisés, p. ex. groupe parlementaire → parlement.) Les partis qui portent un groupe parlementaire ne lui sont pas supérieurs et ne sont donc pas indiqués ici.
    # The parent group is referenced in exactly the same way as a group is
    # referenced from a membership: via GroupReference. That allows a `local_id`
    # to name the parent inside the same delivery, while a `global_uri` lets the
    # hierarchy reach beyond it — and the optional label makes a list of several
    # parents readable (which parent is the parliament, which is the party).
    range: GroupReference
    multivalued: true
    inlined_as_list: true

  spatial:
    description: |
      Spatial reference to a LINDAS resource (fos-municipality number, fos-canton number, district, or country). Formats: municipality: https://ld.admin.ch/municipality/1234, district: https://ld.admin.ch/district/2301, canton: https://ld.admin.ch/canton/23, country: https://ld.admin.ch/country/CHE.
    annotations:
      description_de: |
        Räumliche Referenz auf eine LINDAS-Ressource (BFS-Gemeindenummer, BFS-Kantonsnummer, Bezirk oder Land). Formate: Gemeinde: https://ld.admin.ch/municipality/1234, Bezirk: https://ld.admin.ch/district/2301, Kanton: https://ld.admin.ch/canton/23, Bund: https://ld.admin.ch/country/CHE.

      description_fr: |
        Référence spatiale à une ressource LINDAS (numéro OFS de commune, numéro OFS de canton, district ou pays). Formats : commune : https://ld.admin.ch/municipality/1234, district : https://ld.admin.ch/district/2301, canton : https://ld.admin.ch/canton/23, pays : https://ld.admin.ch/country/CHE.
    # Wie bei `address_uri` wird der Namensraum festgehalten, nicht die
    # Stellenzahl der Nummer. Die vier Ebenen sind die, welche LINDAS fuer die
    # Schweizer Raumeinheiten fuehrt.
    pattern: ^https://ld\.admin\.ch/(country/[A-Z]{3}|canton/[0-9]+|district/[0-9]+|municipality/[0-9]+)$
  contacts:
    slot_uri: act:contact
    description: |
      Contact information (email, website, social media). Guideline: email is quasi-mandatory and should always be provided where available.
    annotations:
      description_de: |
        Kontaktinformationen (E-Mail, Website, Social Media). Richtlinie: E-Mail ist quasi-obligatorisch und sollte wenn vorhanden immer angegeben werden.
      description_fr: |
        Informations de contact (e-mail, site web, réseaux sociaux). Directive : l'e-mail est quasi obligatoire et devrait toujours être fourni lorsqu'il est disponible.
    range: Contact
    multivalued: true
    inlined_as_list: true

  addresses:
    slot_uri: act:address
    description: |
      Addresses with type (private, business, local).
    annotations:
      description_de: |
        Adressen mit Typ (privat, geschäftlich, lokal).
      description_fr: |
        Adresses avec type (privée, professionnelle, locale).
    range: Address
    multivalued: true
    inlined_as_list: true
    examples:
      value:
        - address_type: businessAddress
          address_URI: https://ld.admin.ch/address/12345
          street_address: Bundesplatz 3
          postal_code: "3003"
          postal_locality: Bern
        - address_type: privateAddress
          postal_locality: Zürich

  statutes_url:
    slot_uri: act:statutesURL
    description: |
      URL to party statutes (PDF or webpage; optional for parties).
    annotations:
      description_de: |
        URL zu Parteistatuten (PDF oder Webseite; optional für Parteien).

      description_fr: |
        URL vers les statuts du parti (PDF ou page web ; facultatif pour les partis).
  party_color:
    slot_uri: act:partyColor
    description: |
      Party color as hexadecimal value (optional for parties, e.g., "#FF0000").
    annotations:
      description_de: |
        Parteifarbe als Hexadezimalwert (optional für Parteien, z.B. "#FF0000").

      description_fr: |
        Couleur du parti sous forme de valeur hexadécimale (facultatif pour les partis, p. ex. « #FF0000 »).
  person_reference:
    slot_uri: act:personReference
    description: |
      Reference to a person with snapshot data at time of linking.
    annotations:
      description_de: |
        Referenz auf eine Person mit Snapshot-Daten zum Zeitpunkt der Verknüpfung.
      description_fr: |
        Référence à une personne avec des données instantanées au moment de la mise en relation.
    range: PersonReference
    inlined: true

  group_reference:
    slot_uri: act:groupReference
    description: |
      Reference to a group with snapshot data at time of linking.
    annotations:
      description_de: |
        Referenz auf eine Gruppe mit Snapshot-Daten zum Zeitpunkt der Verknüpfung.
      description_fr: |
        Référence à un groupe avec des données instantanées au moment de la mise en relation.
    range: GroupReference
    inlined: true

  # group_label moved to ech-0292_meta/schema_common (imported)

  role_type:
    slot_uri: act:roleType
    description: |
      Role of the person in the membership or function.
    annotations:
      description_de: |
        Rolle der Person in der Mitgliedschaft oder Funktion.
      description_fr: |
        Rôle de la personne dans l'affiliation ou la fonction.
    range: RoleType

  role_type_enum:
    slot_uri: act:roleTypeEnum
    range: RoleEnum
    description: |
      Role of the person in the membership or function.
    annotations:
      description_de: |
        Rolle der Person in der Mitgliedschaft oder Funktion.

      description_fr: |
        Rôle de la personne dans l'affiliation ou la fonction.
  authorized_to_vote:
    range: boolean
    slot_uri: act:authorizedToVote
    description: |
      Indicates if the person is authorized to vote in the group. Typically false for substitute members (when not deputizing), observers, secretaries, and guests.
    annotations:
      description_de: |
        Gibt an, ob die Person in der Gruppe stimmberechtigt ist. Typischerweise false für Ersatzmitglieder (wenn nicht im Einsatz), Beobachter/innen, Sekretär/innen und Gäste.

      description_fr: |
        Indique si la personne dispose du droit de vote au sein du groupe. Généralement false pour les membres suppléants (lorsqu'ils ne remplacent personne), les observateurs, les secrétaires et les invités.
  interest_type:
    range: InterestTypeEnum
    slot_uri: act:interestType
    required: true
    description: |
      Type of interest link (professional activity, political office, association).
    annotations:
      description_de: |
        Art der Interessenbindung (Berufliche Tätigkeit, Politische Ämter, Verein).

      description_fr: |
        Type de lien d'intérêts (activité professionnelle, mandat politique, association).
  organization_name:
    slot_uri: act:organizationName
    description: |
      Name of the organization or enterprise.
    annotations:
      description_de: |
        Name der Organisation oder des Unternehmens.

      description_fr: |
        Nom de l'organisation ou de l'entreprise.
  organization_uid:
    slot_uri: act:organizationUid
    description: |
      UID of the organization from the federal UID register (uid.admin.ch), in the exchange format of eCH-0108: CHE followed by nine digits, without separators (e.g. CHE106063525). The last digit is a check digit calculated modulo 11. The dotted form CHE-106.063.525 is the presentation used by uid.admin.ch and is not recorded here.
    annotations:
      description_de: |
        UID der Organisation aus dem eidgenössischen UID-Register (uid.admin.ch), im Austauschformat von eCH-0108: CHE gefolgt von neun Ziffern, ohne Trennzeichen (z.B. CHE106063525). Die letzte Ziffer ist eine Prüfziffer nach Modulo 11. Die punktierte Form CHE-106.063.525 ist die Darstellung von uid.admin.ch und wird hier nicht erfasst.
      description_fr: |
        IDE de l'organisation issu du registre fédéral IDE (uid.admin.ch), dans le format d'échange d'eCH-0108 : CHE suivi de neuf chiffres, sans séparateurs (p. ex. CHE106063525). Le dernier chiffre est un chiffre de contrôle calculé modulo 11. La forme pointée CHE-106.063.525 est la présentation utilisée par uid.admin.ch et n'est pas saisie ici.
    # eCH-0108 V6.0.0, Kap. 3.1.1 «UID der rechtlichen Einheit – uid»: pattern
    # ^CHE[1-9][0-9]{8}$, minLength/maxLength 12. Bewusst dieses Austauschformat
    # und nicht die punktierte Anzeigeform von uid.admin.ch: eCH-0108 ist der
    # Standard, der die UID heute definiert (eCH-0097 wurde am 20.03.2024
    # aufgehoben, die UID ist seither in eCH-0108 geführt), und eCH-0098 verweist
    # für `uid` ebenfalls auf ihn. Das Pattern schliesst zugleich eine führende
    # Null aus, welche das punktierte Muster \d{3} zugelassen hätte.
    pattern: ^CHE[1-9][0-9]{8}$

  organization_address:
    slot_uri: act:organizationAddress
    description: |
      Address of the organization.
    annotations:
      description_de: |
        Adresse der Organisation.

      description_fr: |
        Adresse de l'organisation.
  legal_form:
    slot_uri: act:legalForm
    description: |
      Legal form of the organization. See controlled vocabulary: https://register.ld.admin.ch/i14y/concept/legalForm
    annotations:
      description_de: |
        Rechtsform der Organisation. Siehe kontrolliertes Vokabular: https://register.ld.admin.ch/i14y/concept/legalForm
      description_fr: |
        Forme juridique de l'organisation. Voir le vocabulaire contrôlé : https://register.ld.admin.ch/i14y/concept/legalForm
    range: LegalFormEnum

  committee:
    slot_uri: act:committee
    description: |
      Committee or board within the organization (e.g., Verwaltungsrat, Stiftungsrat, Vorstand, Aufsichtsrat, Beirat, Geschäftsleitung).
    annotations:
      description_de: |
        Gremium innerhalb der Organisation (z.B. Verwaltungsrat, Stiftungsrat, Vorstand, Aufsichtsrat, Beirat, Geschäftsleitung).

      description_fr: |
        Comité ou organe au sein de l'organisation (p. ex. conseil d'administration, conseil de fondation, comité directeur, conseil de surveillance, comité consultatif, direction).
  function_role:
    slot_uri: act:functionRole
    description: |
      Function or role in the organization (e.g., Präsident/in, Vizepräsident/in, Mitglied, Delegierter, Geschäftsführer/in, Berater/in).
    annotations:
      description_de: |
        Funktion oder Rolle in der Organisation (z.B. Präsident/in, Vizepräsident/in, Mitglied, Delegierter, Geschäftsführer/in, Berater/in).

      description_fr: |
        Fonction ou rôle dans l'organisation (p. ex. président/e, vice-président/e, membre, délégué, directeur/directrice, conseiller/ère).
  names:
    slot_uri: act:name
    description: |
      Names of the person with type and value.
    annotations:
      description_de: |
        Namen der Person mit Typ und Wert.
      description_fr: |
        Noms de la personne avec type et valeur.
    range: Name
    multivalued: true
    inlined_as_list: true

  language_proficiencies:
    slot_uri: act:languageProficiency
    description: |
      Language proficiencies of the person.
    annotations:
      description_de: |
        Sprachkompetenzen der Person.
      description_fr: |
        Compétences linguistiques de la personne.
    range: LanguageProficiency
    multivalued: true
    inlined_as_list: true

  citizenships:
    slot_uri: act:citizenship
    description: |
      Citizenships of the person.
    annotations:
      description_de: |
        Staatsbürgerschaften der Person.
      description_fr: |
        Nationalités de la personne.
    range: Citizenship
    multivalued: true
    inlined_as_list: true

  genders:
    slot_uri: act:gender
    description: |
      Gender of the person.
    annotations:
      description_de: |
        Geschlecht der Person.
      description_fr: |
        Sexe de la personne.
    range: Gender
    multivalued: true
    inlined_as_list: true

  occupations:
    slot_uri: act:occupation
    description: |
      Occupations or professions of the person.
    annotations:
      description_de: |
        Berufe oder Tätigkeiten der Person.
      description_fr: |
        Métiers ou professions de la personne.
    range: Occupation
    multivalued: true
    inlined_as_list: true

  trainings:
    slot_uri: act:training
    description: |
      Trainings or educations of the person. Guideline: generally only provide the highest qualification obtained.
    annotations:
      description_de: |
        Ausbildungen oder Bildungen der Person. Richtlinie: Im Grundsatz nur die höchste Ausbildung angeben.
      description_fr: |
        Formations ou éducations de la personne. Directive : n'indiquer en principe que la qualification la plus élevée obtenue.
    range: Training
    multivalued: true
    inlined_as_list: true

  electoral_district:
    slot_uri: act:electoralDistrict
    description: |
      Link to the electoral district.
    annotations:
      description_de: |
        Link zum Wahlbezirk.
      description_fr: |
        Lien vers la circonscription électorale.
    range: ElectoralDistrict

  persons:
    slot_uri: act:person
    description: |
      Collection of persons.
    annotations:
      description_de: |
        Sammlung von Personen.
      description_fr: |
        Collection de personnes.
    range: Person
    multivalued: true
    inlined_as_list: true

  groups:
    slot_uri: act:group
    description: |
      Collection of groups.
    annotations:
      description_de: |
        Sammlung von Gruppen.
      description_fr: |
        Collection de groupes.
    range: Group
    multivalued: true
    inlined_as_list: true

  memberships:
    slot_uri: act:membership
    description: |
      Collection of memberships.
    annotations:
      description_de: |
        Sammlung von Mitgliedschaften.
      description_fr: |
        Collection d'affiliations.
    range: Membership
    multivalued: true
    inlined_as_list: true

  interest_links:
    slot_uri: act:interestLink
    description: |
      Collection of interest links.
    annotations:
      description_de: |
        Sammlung von Interessenbindungen.
      description_fr: |
        Collection de liens d'intérêts.
    range: InterestLink
    multivalued: true
    inlined_as_list: true

  role_label:
    description: |
      Specific role label. Use this when a specific role name is needed, even if a fitting semantic value exists in `role_type_enum`; provide this label when `role_type_enum` is set to 'other'. The designation is recorded with the language it is published in; where it is published in several languages, one entry per language is recorded.
    annotations:
      description_de: |
        Spezifische Rollenbezeichnung. Dieses Feld kann verwendet werden, wenn eine konkrete Rollenbezeichnung benötigt wird, auch wenn in `role_type_enum` bereits ein passender semantischer Wert vorhanden ist; bei `role_type_enum = other` soll diese Bezeichnung angegeben werden. Die Bezeichnung wird mit der Sprache erfasst, in der sie publiziert wird; wird sie in mehreren Sprachen publiziert, wird pro Sprache ein Eintrag erfasst.
      description_fr: |
        Libellé de rôle spécifique. À utiliser lorsqu'un nom de rôle spécifique est nécessaire, même s'il existe une valeur sémantique appropriée dans `role_type_enum` ; fournir ce libellé lorsque « role_type_enum » est réglé sur « other ». La désignation est saisie avec la langue dans laquelle elle est publiée ; lorsqu'elle est publiée en plusieurs langues, une entrée est saisie par langue.
    # As with the group name and the type designation, the role designation of
    # a body publishing in several languages exists in each of them.
    range: MultilingualValue
    multivalued: true
    inlined_as_list: true

# ENUMS
# ----------------------------------------------------------------

enums:
  NameTypeEnum:
    description: |
      Categories of name types according to eCH-0011 (personNameData) and the official catalogue of attributes of the register harmonisation (https://www.bfs.admin.ch/bfs/de/home/register/personenregister/registerharmonisierung/nomenklaturen.assetdetail.24565576.html), URI according to I14Y identifier but as class and not as attribute. Descriptions and translations according to I14Y.
    annotations:
      description_de: |
        Kategorien von Namenstypen gemäss eCH-0011 (personNameData) und dem Amtlichen Katalog der Merkmale der Registerharmonisierung (https://www.bfs.admin.ch/bfs/de/home/register/personenregister/registerharmonisierung/nomenklaturen.assetdetail.24565576.html), URI gemäss I14Y Identifier aber als Klasse und nicht als Attribut. Beschreibungen und Übersetzungen gemäss I14Y.
      description_fr: |
        Catégories de types de noms selon eCH-0011 (personNameData) et le Catalogue officiel des caractères de l'harmonisation de registres (https://www.bfs.admin.ch/bfs/fr/home/registres/registre-personnes/harmonisation-registres/nomenclatures.assetdetail.24565577.html), URI selon l'identifiant I14Y mais en tant que classe et non en tant qu'attribut. Descriptions et traductions selon I14Y.
    permissible_values:
      PersonOfficialName:
        description: |
          Name according to official documents. The official name corresponds to the name appearing in the Swiss civil register. For foreign nationals with no civil status events in Switzerland, the official name corresponds to the name appearing on the foreign passport or identity card (see ‘Name according to foreign passport’ or SEM guidelines on the determination and spelling of names of foreign nationals dated 1 January 2012. If no official documents exist, see also ‘Name according to declaration’ (e.g. in the case of asylum seekers). The official name may consist of one or more parts. According to the official catalogue of attributes (No. 211) for the harmonisation of registers.
        annotations:
          description_de: |
            Name gemäss amtlichen Unterlagen. Der amtliche Name entspricht dem Namen im schweizerischen Zivilstandsregister. Bei ausländischen Personen ohne Zivilstandsereignis in der Schweiz entspricht dieser Name dem Namen im ausländischen Pass oder auf der Identitätskarte (siehe 214 sowie Weisung des SEM über die Bestimmung und Schreibweise der Namen von ausländischen Staatsangehörigen vom 1. Januar 2012. Im Ausnahmefall siehe auch "Name nach Deklaration" (z. B. Asyl), wenn keine amtlichen Dokumente vorliegen). Der amtliche Name kann aus einem oder mehreren Teilen bestehen. Gemäss amtlichen Katalog der Merkmale (Nr. 211) Registerharmonisierung.
          description_fr: |
            Nom selon les documents officiels. Le nom officiel correspond au nom figurant dans le registre suisse de l'état civil. Pour les ressortissants étrangers n'ayant pas d'événement d'état civil en Suisse, le nom officiel correspond au nom figurant sur le passeport étranger ou la carte d'identité (voir « Nom selon le passeport étranger » ou les directives du SEM sur la détermination et l'orthographe des noms des ressortissants étrangers du 1er janvier 2012. En l'absence de documents officiels, voir également « Nom selon la déclaration » (p. ex. dans le cas de requérants d'asile). Le nom officiel peut se composer d'une ou de plusieurs parties. Selon le catalogue officiel des caractères (n° 211) pour l'harmonisation des registres.
        meaning: https://register.ld.admin.ch/i14y/concept/personOfficialName

      PersonOriginalName:
        description: |
          Name of filiation according to official documents, which corresponds to the person's name before their first marriage or registered partnership. It may also be a maiden name acquired by decision to change one's name (see Art. 24, para. 2 OEC, RS 211.112.2). According to the official catalogue of attributes (No. 212) for the harmonisation of registers.
        annotations:
          description_de: |
            Angestammter Name gemäss amtlichen Unterlagen, den eine Person unmittelbar vor ihrer ersten Eheschliessung oder Begründung einer eingetragenen Partnerschaft geführt hat oder, gestützt auf einen Namensänderungsentscheid, als neuen Ledignamen erworben hat (Art. 24 Abs. 2 ZStV, SR 211.112.2). Gemäss amtlichen Katalog der Merkmale (Nr. 212) Registerharmonisierung.
          description_fr: |
            Nom de filiation selon les documents officiels, qui correspond au nom porté par la personne avant son premier mariage ou son premier partenariat enregistré. Il peut également s'agir d'un nom de célibataire acquis par une décision de changement de nom (voir art. 24, al. 2 OEC, RS 211.112.2). Selon le catalogue officiel des caractères (n° 212) pour l'harmonisation des registres.
        meaning: https://register.ld.admin.ch/i14y/concept/personOriginalName

      PersonAllianceName:
        description: |
          The alliance name shows the connection between two people who are married or living in a registered partnership. An alliance name that has already been used may be retained after the dissolution of the marriage or partnership if the official name has not been changed upon dissolution. It is attached to the official name with a hyphen and is formed with the partner's maiden name or the person's own maiden name. Upon request, the alliance name may be entered in the passport or on the identity card. According to the official catalogue of attributes (No. 213) for the harmonisation of registers.
        annotations:
          description_de: |
            Der Allianzname zeigt die Verbindung von zwei Personen auf, die verheiratet sind oder in einer eingetragenen Partnerschaft leben. Ein bereits verwendeter Allianzname kann nach Auflösung der Ehe oder der Partnerschaft weiterverwendet werden, wenn der amtliche Name bei der Auflösung nicht geändert wurde. Dabei wird dem amtlichen Namen mittels Bindestrich der Ledigname des Partners/der Partnerin oder der eigene Ledigname angehängt. Der Allianzname kann auf Antrag im Pass oder auf der Identitätskarte eingetragen werden. Gemäss amtlichen Katalog der Merkmale (Nr. 213) Registerharmonisierung.
          description_fr: |
            Le nom d'alliance montre le lien entre deux personnes mariées ou vivant en partenariat enregistré. Un nom d'alliance déjà utilisé peut être conservé après la dissolution du mariage ou du partenariat si le nom officiel n'a pas été modifié lors de la dissolution. Il est rattaché au nom officiel par un trait d'union et est formé avec le nom de célibataire du partenaire ou son propre nom de célibataire. Sur demande, le nom d'alliance peut être inscrit dans le passeport ou sur la carte d'identité. Selon le catalogue officiel des caractères (n° 213) pour l'harmonisation des registres.
        meaning: https://register.ld.admin.ch/i14y/concept/personAllianceName

      PersonNameOnForeignPassport:
        description: |
          For persons of foreign nationality. This name corresponds to the entry marked in the machine-readable zone of the passport. If this zone includes abbreviated surnames or first names, these must, as far as possible, be recorded in full, according to the entry in the passport. According to the official catalogue of attributes (No. 214) for the harmonisation of registers.
        annotations:
          description_de: |
            Für Personen mit ausländischer Nationalität. Dieser Name entspricht dem Eintrag im Reisepass gemäss der maschinenlesbaren Zone (MRZ) des Reisepasses. Enthält die MRZ abgekürzte Namen oder Vornamen, sind diese möglichst in voller Länge gemäss visuell lesbarer Zone des Ausweispapieres zu erfassen. Gemäss amtlichen Katalog der Merkmale (Nr. 214) Registerharmonisierung.
          description_fr: |
            Pour les personnes de nationalité étrangère. Ce nom correspond à l'entrée figurant dans la zone lisible par machine du passeport. Si cette zone comporte des noms de famille ou des prénoms abrégés, ceux-ci doivent, dans la mesure du possible, être enregistrés dans leur intégralité, conformément à l'entrée figurant dans le passeport. Selon le catalogue officiel des caractères (n° 214) pour l'harmonisation des registres.
        meaning: https://register.ld.admin.ch/i14y/concept/personNameOnForeignPassport

      PersonAliasName:
        description: |
          Name (e.g. stage name, religious name) which, on the basis of an accepted application, may be used by the person. The alias name may consist of one or more parts (e.g. also the alias first name and alias surname). According to the official catalogue of attributes (No. 215) for the harmonisation of registers.
        annotations:
          description_de: |
            Name (z. B. Künstler- oder Ordensname), der aufgrund eines bewilligten Gesuchs geführt werden darf. Der Aliasname kann aus einem oder mehreren Teilen (z. B. auch aus Aliasvorname und Aliasname) bestehen. Gemäss amtlichen Katalog der Merkmale (Nr. 215) Registerharmonisierung.
          description_fr: |
            Nom (p. ex. nom de scène, nom religieux) qui, sur la base d'une demande acceptée, peut être porté par la personne. Le nom d'alias peut se composer d'une ou de plusieurs parties (p. ex. également le prénom d'alias et le nom de famille d'alias). Selon le catalogue officiel des caractères (n° 215) pour l'harmonisation des registres.
        meaning: https://register.ld.admin.ch/i14y/concept/personAliasName

      PersonOtherName:
        description: |
          Other official names according to Swiss civil status documents (Art. 24, para. 3 OEC) or according to foreign documents, which are neither surnames nor first names. According to the official catalogue of attributes (No. 216) for the harmonisation of registers.
        annotations:
          description_de: |
            Weitere amtliche Namen gemäss schweizerischen Zivilstandsdokumenten (Art. 24 Abs. 3 ZStV) oder ausländischen Dokumenten, welche weder Familiennamen noch Vornamen sind. Gemäss amtlichen Katalog der Merkmale (Nr. 216) Registerharmonisierung.
          description_fr: |
            Autres noms officiels selon les documents d'état civil suisses (art. 24, al. 3 OEC) ou selon des documents étrangers, qui ne sont ni des noms de famille ni des prénoms. Selon le catalogue officiel des caractères (n° 216) pour l'harmonisation des registres.
        meaning: https://register.ld.admin.ch/i14y/concept/personOtherName

      PersonDeclaredForeignerName:
        description: |
          For foreign nationals who do not have official documents (mainly in the field of asylum). According to the official catalogue of attributes (No. 217) for the harmonisation of registers.
        annotations:
          description_de: |
            Für Personen mit ausländischer Nationalität, die keine offiziellen Dokumente besitzen (hauptsächlich im Asylbereich). Gemäss amtlichen Katalog der Merkmale (Nr. 217) Registerharmonisierung.
          description_fr: |
            Pour les ressortissants étrangers qui ne disposent pas de documents officiels (principalement dans le domaine de l'asile). Selon le catalogue officiel des caractères (n° 217) pour l'harmonisation des registres.
        meaning: https://register.ld.admin.ch/i14y/concept/personDeclaredForeignerName


      # First Names
      # ----------------------------------------------------------------

      PersonFirstName:
        description: |
          First names taken from the birth certificate, the civil registry (Infostar) in the order in which they appear, or taken from foreign identity documents. According to the official catalogue of attributes (No. 221) for the harmonisation of registers.
        annotations:
          description_de: |
            Vornamen gemäss Geburtsurkunde oder Zivilstandsregister/Infostar in der aufgeführten Reihenfolge bzw. gemäss ausländischen Ausweispapieren. Gemäss amtlichen Katalog der Merkmale (Nr. 221) Registerharmonisierung.
          description_fr: |
            Prénoms tirés de l'acte de naissance, du registre de l'état civil (Infostar) dans l'ordre dans lequel ils apparaissent, ou tirés de documents d'identité étrangers. Selon le catalogue officiel des caractères (n° 221) pour l'harmonisation des registres.
        meaning: https://register.ld.admin.ch/i14y/concept/personFirstName

      PersonCallFirstName:
        description: |
          A person has the right to choose a common first name from the list of their official first names. The common first name may consist of one or more first names (from those listed under ‘official first names’). According to the official catalogue of attributes (No. 222) for the harmonisation of registers.
        annotations:
          description_de: |
            Eine Person hat das Recht, aus der Liste ihrer amtlichen Vornamen einen Rufnamen auszuwählen. Der Rufname kann aus einem oder mehreren Vornamen (aus den "amtlichen Vornamen") bestehen. Gemäss amtlichen Katalog der Merkmale (Nr. 222) Registerharmonisierung.
          description_fr: |
            Une personne a le droit de choisir un prénom usuel dans la liste de ses prénoms officiels. Le prénom usuel peut se composer d'un ou de plusieurs prénoms (parmi ceux figurant sous « prénoms officiels »). Selon le catalogue officiel des caractères (n° 222) pour l'harmonisation des registres.
        meaning: https://register.ld.admin.ch/i14y/concept/personCallFirstName

      PersonFirstNameOnForeignPassport:
        description: |
          For persons of foreign nationality. To be used in combination with the name as it appears on the foreign passport. According to the official catalogue of attributes (No. 223) for the harmonisation of registers.
        annotations:
          description_de: |
            Für Personen mit ausländischer Nationalität. Zu benutzen in Verbindung mit dem Namen im ausländischen Pass. Gemäss amtlichen Katalog der Merkmale (Nr. 223) Registerharmonisierung.
          description_fr: |
            Pour les personnes de nationalité étrangère. À utiliser en combinaison avec le nom tel qu'il figure sur le passeport étranger. Selon le catalogue officiel des caractères (n° 223) pour l'harmonisation des registres.
        meaning: https://register.ld.admin.ch/i14y/concept/personFirstNameOnForeignPassport

      PersonDeclaredForeignerFirstName:
        description: |
          For persons of foreign nationality who do not have official documents (mainly in the field of asylum). To be used in combination with the defined Name according to declaration. According to the official catalogue of attributes (No. 224) for the harmonisation of registers.
        annotations:
          description_de: |
            Für Personen mit ausländischer Nationalität, die keine amtlichen Dokumente besitzen (hauptsächlich im Asylbereich). Zu benutzen in Verbindung mit dem Namen gemäss Deklaration. Gemäss amtlichen Katalog der Merkmale (Nr. 224) Registerharmonisierung.
          description_fr: |
            Pour les personnes de nationalité étrangère qui ne disposent pas de documents officiels (principalement dans le domaine de l'asile). À utiliser en combinaison avec le nom défini selon la déclaration. Selon le catalogue officiel des caractères (n° 224) pour l'harmonisation des registres.
        meaning: https://register.ld.admin.ch/i14y/concept/personDeclaredForeignerFirstName


