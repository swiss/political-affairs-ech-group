  GroupTypeEnum:
    description: |
      Three rules govern the types of political groups and organizations.

      The value states the political function; the designation used locally belongs in the group's label. Büro, Ratsleitung and Ufficio presidenziale therefore all take the value `council_bureau`.

      Related values share a prefix. The `council_` family does not distinguish by council: a state chancellery and parliamentary services are both `council_secretariat`, and the affiliation follows from `parent_groups`. It divides into `council_presidency` for the presidency, `council_bureau` for the managing body extended by the parliamentary group representation, and `council_secretariat` for the administrative unit staffed by employees. The `committee_` family follows the same pattern, with `committee` as the base case.

      Legal form does not belong in this vocabulary but in `legal_form`.
    annotations:
      description_de: |
        Für Typen politischer Gruppen und Organisationen gelten drei Regeln.

        Der Wert benennt die politische Funktion; die örtliche Bezeichnung gehört ins Label der Gruppe. Büro, Ratsleitung und Ufficio presidenziale erhalten deshalb alle den Wert `council_bureau`.

        Verwandte Werte teilen ein Präfix. Die Familie `council_` unterscheidet nicht nach Rat: Staatskanzlei und Parlamentsdienste sind beide `council_secretariat`, die Zugehörigkeit ergibt sich aus `parent_groups`. Sie gliedert sich in `council_presidency` für das Präsidium, `council_bureau` für das um die Fraktionsvertretung erweiterte Leitungsorgan und `council_secretariat` für die Verwaltungseinheit mit Angestellten. Die Familie `committee_` folgt demselben Muster, mit `committee` als Grundfall.

        Die Rechtsform gehört nicht in dieses Vokabular, sondern in `legal_form`.
      description_fr: |
        Trois règles s'appliquent aux types de groupes et d'organisations politiques.

        La valeur désigne la fonction politique ; la désignation locale relève du libellé du groupe. Büro, Ratsleitung et Ufficio presidenziale reçoivent donc tous la valeur `council_bureau`.

        Les valeurs apparentées partagent un préfixe. La famille `council_` ne distingue pas selon le conseil : une chancellerie d'État et les services du parlement sont tous deux `council_secretariat`, le rattachement ressortant de `parent_groups`. Elle se subdivise en `council_presidency` pour la présidence, `council_bureau` pour l'organe de direction élargi à la représentation des groupes et `council_secretariat` pour l'unité administrative composée d'employés. La famille `committee_` suit le même modèle, avec `committee` comme cas de base.

        La forme juridique ne relève pas de ce vocabulaire, mais de `legal_form`.
    permissible_values:
      party:
        meaning: act:enum/group_type/party
        description: |
          Political party at federal, cantonal, or municipal level. Each federal level is managed as its own group (e.g., national party, cantonal party, municipal party).
        annotations:
          description_de: |
            Politische Partei auf Bundes-, Kantons- oder Gemeindeebene. Jede föderale Ebene wird als eigene Gruppe geführt (z.B. Bundespartei, Kantonspartei, Gemeindesektion).
          description_fr: |
            Parti politique au niveau fédéral, cantonal ou communal. Chaque niveau fédéral est géré comme un groupe distinct (p. ex. parti national, parti cantonal, parti communal).
      list:
        meaning: act:enum/group_type/list
        description: |
          Electoral list (can be part of a party or independent).
        annotations:
          description_de: |
            Wahlliste (kann Teil einer Partei sein oder unabhängig).
          description_fr: |
            Liste électorale (peut faire partie d'un parti ou être indépendante).
      workgroup:
        meaning: act:enum/group_type/workgroup
        description: |
          Ad-hoc working group, typically with a limited duration.
        annotations:
          description_de: |
            Ad-hoc-Arbeitsgruppe, typischerweise mit begrenzter Laufzeit.
          description_fr: |
            Groupe de travail ad hoc, généralement d'une durée limitée.
      assembly:
        meaning: act:enum/group_type/assembly
        description: |
          Assembly of the persons entitled to vote acting as the legislative body, in particular the communal assembly ("Gemeindeversammlung") and, at cantonal level, the Landsgemeinde. Unlike a council, it is not an elected body.
        annotations:
          description_de: |
            Versammlung der Stimmberechtigten als gesetzgebendes Organ, insbesondere die Gemeindeversammlung und, auf Kantonsebene, die Landsgemeinde. Anders als ein Rat ist sie kein gewähltes Gremium.
          description_fr: |
            Assemblée des personnes ayant le droit de vote en tant qu'organe législatif, en particulier l'assemblée communale et, au niveau cantonal, la Landsgemeinde. Contrairement à un conseil, elle n'est pas un organe élu.
      council_legislative:
        meaning: act:enum/group_type/council_legislative
        description: |
          Parliament at federal, cantonal, or municipal level (e.g., Federal Assembly, National Council, Council of States, Grand Council, cantonal parliament, municipal parliament).
        annotations:
          description_de: |
            Parlament auf Bundes-, Kantons- oder Gemeindeebene (z.B. Bundesversammlung, Nationalrat, Ständerat, Grosser Rat, Kantonsrat, Gemeindeparlament).
          description_fr: |
            Parlement au niveau fédéral, cantonal ou communal (p. ex. Assemblée fédérale, Conseil national, Conseil des États, Grand Conseil, parlement cantonal, parlement communal).
      delegation:
        meaning: act:enum/group_type/delegation
        description: |
          Delegation.
        annotations:
          description_de: |
            Delegation.
          description_fr: |
            Délégation.
      committee:
        meaning: act:enum/group_type/committee
        description: |
          Standing committee, including supervisory committees (e.g., CPC), subject commissions, parliamentary investigation commissions (PIC), and audit commissions.
        annotations:
          description_de: |
            Ständige Kommission, einschliesslich Aufsichtskommissionen (z.B. GPK), Sachkommissionen, Parlamentarische Untersuchungskommissionen (PUK) und Rechnungsprüfungskommissionen.
          description_fr: |
            Commission permanente, y compris les commissions de surveillance (p. ex. CdG), les commissions thématiques, les commissions d'enquête parlementaire (CEP) et les commissions de vérification des comptes.
      committee_ad_hoc:
        meaning: act:enum/group_type/committee_ad_hoc
        description: |
          Committee set up for a single task and dissolved once it is completed, in contrast to a standing committee.
        annotations:
          description_de: |
            Kommission, die für eine einzelne Aufgabe eingesetzt und nach deren Erledigung wieder aufgelöst wird, im Unterschied zur ständigen Kommission.
          description_fr: |
            Commission instituée pour une tâche unique et dissoute une fois celle-ci accomplie, par opposition à une commission permanente.
      parliamentary_group:
        meaning: act:enum/group_type/parliamentary_group
        description: |
          Parliamentary faction.
        annotations:
          description_de: |
            Parlamentsfraktion.
          description_fr: |
            Groupe parlementaire.
      council_bureau:
        meaning: act:enum/group_type/council_bureau
        description: |
          Body managing the business of a council, whatever it is called locally (bureau, council management, executive board). Used for the legislative as well as the executive council; the local designation is recorded in the label.
        annotations:
          description_de: |
            Organ, das den Geschäftsgang eines Rates leitet, unabhängig von der örtlichen Bezeichnung (Büro, Ratsleitung, Geschäftsleitung). Wird für den Legislativ- wie für den Exekutivrat verwendet; die örtliche Benennung wird im Label festgehalten.
          description_fr: |
            Organe dirigeant la marche des affaires d'un conseil, quelle que soit sa désignation locale (bureau, direction du conseil, comité de direction). S'emploie aussi bien pour le conseil législatif que pour le conseil exécutif ; la désignation locale est consignée dans le libellé.
      council_presidency:
        meaning: act:enum/group_type/council_presidency
        description: |
          Presidency of a council, for the legislative as well as the executive council.
        annotations:
          description_de: |
            Präsidium eines Rates, für den Legislativ- wie für den Exekutivrat.
          description_fr: |
            Présidence d'un conseil, pour le conseil législatif comme pour le conseil exécutif.
      council_executive:
        meaning: act:enum/group_type/council_executive
        description: |
          Government / Executive as a collective body (e.g., Federal Council, Cantonal Government, City or Municipal Council).
        annotations:
          description_de: |
            Regierung / Exekutive als Gesamtorgan (z.B. Bundesrat, Regierungsrat, Stadtrat / Gemeinderat).
          description_fr: |
            Gouvernement / exécutif en tant qu'organe collégial (p. ex. Conseil fédéral, conseil d'État, conseil municipal ou conseil communal).
      department:
        meaning: act:enum/group_type/department
        description: |
          Government department, e.g. Departement or Direktion.
        annotations:
          description_de: |
            Departement, z.B. Departement oder Direktion.
          description_fr: |
            Département gouvernemental, p. ex. Departement ou Direktion.
      office:
        meaning: act:enum/group_type/office
        description: |
          Government office ("Amt"), usually the unit below a department.
        annotations:
          description_de: |
            Amt, häufig die Einheit unterhalb des Departements.
          description_fr: |
            Office gouvernemental (« Amt »), généralement l'unité située en dessous du département.
      committee_extraparliamentary:
        meaning: act:enum/group_type/committee_extraparliamentary
        description: |
          Commission normally appointed by the government to advise the administration in its field and to give its business a first reading; some also hold decision-making powers of their own. What sets it apart from a parliamentary committee are its composition and its legal basis: its members are external experts and interest-group representatives rather than members of the council, and it rests on the law governing the organisation of the government and the administration rather than on parliament law. The type exists at federal and at cantonal level alike (e.g., the federal Competition Commission; the commissions extraparlementaires in the canton of Vaud). A committee whose members are members of the council is not covered by this value even when it is attached to the executive; it is recorded as a committee or an ad hoc committee with the executive council as its parent group.
        annotations:
          description_de: |
            Kommission, die in der Regel von der Regierung eingesetzt wird, um die Verwaltung fachlich zu beraten und deren Geschäfte vorzuberaten; einzelne verfügen darüber hinaus über eigene Entscheidbefugnisse. Sie unterscheidet sich von einer parlamentarischen Kommission durch Zusammensetzung und Rechtsgrundlage: Ihre Mitglieder sind externe Fachleute und Interessenvertreterinnen und -vertreter statt Ratsmitglieder, und sie stützt sich auf das Organisationsrecht von Regierung und Verwaltung statt auf das Parlamentsrecht. Den Typ gibt es auf Bundes- wie auf Kantonsebene (z.B. die Wettbewerbskommission des Bundes; im Kanton Waadt die commissions extraparlementaires). Eine Kommission, deren Mitglieder Ratsmitglieder sind, fällt auch dann nicht unter diesen Wert, wenn sie bei der Exekutive angesiedelt ist; sie wird als Kommission oder Ad-hoc-Kommission mit dem Exekutivrat als übergeordneter Gruppe erfasst.
          description_fr: |
            Commission généralement instituée par le gouvernement pour conseiller l'administration dans son domaine et pour examiner ses affaires au préalable ; certaines disposent en outre de compétences décisionnelles propres. Ce qui la distingue d'une commission parlementaire sont sa composition et sa base légale : ses membres sont des spécialistes externes et des représentantes et représentants d'intérêts plutôt que des membres du conseil, et elle se fonde sur le droit régissant l'organisation du gouvernement et de l'administration et non sur le droit parlementaire. Ce type existe tant au niveau fédéral qu'au niveau cantonal (p. ex. la Commission de la concurrence de la Confédération ; les commissions extraparlementaires du canton de Vaud). Une commission dont les membres sont des membres du conseil ne relève pas de cette valeur, même lorsqu'elle est rattachée à l'exécutif ; elle est saisie comme commission ou commission ad hoc avec le conseil exécutif comme groupe supérieur.
      interest_group:
        meaning: act:enum/group_type/interest_group
        description: |
          Interest group on a subject matter: both the parliamentary interest group, in which members of the council join across party lines, and the interest group from civil society.
        annotations:
          description_de: |
            Interessengruppe zu einem Sachthema: sowohl die parlamentarische Gruppe, in der sich Ratsmitglieder fraktionsübergreifend zusammenschliessen, als auch die Interessengruppe aus der Zivilgesellschaft.
          description_fr: |
            Groupe d'intérêts portant sur un thème : aussi bien l'intergroupe parlementaire, au sein duquel des membres du conseil se réunissent par-delà les groupes, que le groupe d'intérêts issu de la société civile.
      oversight_body:
        meaning: act:enum/group_type/oversight_body
        description: |
          Independent oversight or audit body that does not belong to the body overseen and does not report to it (e.g., Swiss Federal Audit Office SFAO and cantonal audit offices, Supervisory Authority for the Office of the Attorney General AS-OAG, Swiss Financial Market Supervisory Authority FINMA, ombudsman offices).
        annotations:
          description_de: |
            Unabhängiges Aufsichts- oder Prüforgan, das dem beaufsichtigten Organ nicht angehört und ihm nicht berichtet (z.B. Eidgenössische Finanzkontrolle EFK und kantonale Finanzkontrollen, Aufsichtsbehörde über die Bundesanwaltschaft AB-BA, Eidgenössische Finanzmarktaufsicht FINMA, Ombudsstellen).
          description_fr: |
            Organe indépendant de surveillance ou de contrôle qui n'appartient pas à l'organe surveillé et ne lui fait pas rapport (p. ex. Contrôle fédéral des finances CDF et contrôles cantonaux des finances, Autorité de surveillance du Ministère public de la Confédération AS-MPC, Autorité fédérale de surveillance des marchés financiers FINMA, organes de médiation).
      council_secretariat:
        meaning: act:enum/group_type/council_secretariat
        description: |
          Administrative unit serving a council, whatever it is called locally (parliamentary services, council secretariat, state, cantonal or municipal chancellery). Used for the legislative as well as the executive council: the state chancellery is the staff unit of the executive council, the parliamentary services are that of the legislative council.
        annotations:
          description_de: |
            Verwaltungseinheit, die einen Rat bedient, unabhängig von der örtlichen Bezeichnung (Parlamentsdienste, Ratssekretariat, Staats-, Kantons-, Standes-, Stadt- oder Gemeindekanzlei). Wird für den Legislativ- wie für den Exekutivrat verwendet: Die Staatskanzlei ist die Stabsstelle des Exekutivrates, die Parlamentsdienste sind jene des Legislativrates.
          description_fr: |
            Unité administrative au service d'un conseil, quelle que soit sa désignation locale (services du parlement, secrétariat du conseil, chancellerie d'État, cantonale ou communale). S'emploie aussi bien pour le conseil législatif que pour le conseil exécutif : la chancellerie d'État est l'état-major du conseil exécutif, les services du parlement celui du conseil législatif.
      court:
        meaning: act:enum/group_type/court
        description: |
          Court / Judiciary at any level (e.g., Federal Court, Cantonal Court, District Court).
        annotations:
          description_de: |
            Gericht / Judikative auf jeder Ebene (z.B. Bundesgericht, Kantonsgericht, Bezirksgericht).
          description_fr: |
            Tribunal / pouvoir judiciaire à tout niveau (p. ex. Tribunal fédéral, tribunal cantonal, tribunal de district).
      association:
        meaning: act:enum/group_type/association
        description: |
          Association.
        annotations:
          description_de: |
            Verein.
          description_fr: |
            Association.
      petition_carrier:
        meaning: act:enum/group_type/petition_carrier
        description: |
          Petition carrier.
        annotations:
          description_de: |
            Petitionsträger.
          description_fr: |
            Porteur de pétition.
      university:
        meaning: act:enum/group_type/university
        description: |
          University or educational institution as an outsourced provider of public tasks.
        annotations:
          description_de: |
            Universität oder Bildungseinrichtung als ausgelagerter Träger öffentlicher Aufgaben.
          description_fr: |
            Université ou établissement d'enseignement en tant que prestataire externalisé de tâches publiques.
      other:
        meaning: act:enum/group_type/other
        description: |
          Other group type not covered by standard categories.
        annotations:
          description_de: |
            Anderer Gruppentyp, nicht durch Standardkategorien abgedeckt.

          description_fr: |
            Autre type de groupe non couvert par les catégories standard.
  InterestTypeEnum:
    description: |
      Types of interest links (conflicts of interest, political financing).
    annotations:
      description_de: |
        Typen von Interessenbindungen (Interessenkonflikte, Politikfinanzierung).
      description_fr: |
        Types de liens d'intérêts (conflits d'intérêts, financement politique).
    permissible_values:
      professional_activity:
        meaning: act:enum/interest_type/professional_activity
        description: |
          Professional activity outside the political mandate (e.g., employment, self-employment, consulting, board mandates in private companies).
        annotations:
          description_de: |
            Berufliche Tätigkeit ausserhalb des politischen Mandats (z.B. Anstellung, selbstständige Tätigkeit, Beratungsmandate, Verwaltungsratsmandate in Privatunternehmen).
          description_fr: |
            Activité professionnelle en dehors du mandat politique (p. ex. emploi salarié, activité indépendante, conseil, mandats d'administrateur dans des entreprises privées).
      political_office:
        meaning: act:enum/interest_type/political_office
        description: |
          Political office or mandate at other federal levels or in other bodies (e.g., cantonal/municipal parliament membership, government council, extra-parliamentary commission).
        annotations:
          description_de: |
            Politisches Amt oder Mandat auf anderen föderalen Ebenen oder in anderen Körperschaften (z.B. Mitgliedschaft in kantonalen/kommunalen Parlamenten, Regierungsrat, ausserparlamentarische Kommission).
          description_fr: |
            Mandat ou fonction politique à d'autres niveaux fédéraux ou dans d'autres collectivités (p. ex. appartenance à un parlement cantonal/communal, conseil d'État, commission extraparlementaire).
      association:
        meaning: act:enum/interest_type/association
        description: |
          Membership in associations, federations, or interest organizations (e.g., industry associations, professional associations, lobby organizations, foundations, charitable associations).
        annotations:
          description_de: |
            Mitgliedschaft in Vereinen, Verbänden oder Interessenorganisationen (z.B. Branchenverbände, Berufsverbände, Lobbyorganisationen, Stiftungen, gemeinnützige Vereine).

          description_fr: |
            Appartenance à des associations, des fédérations ou des organisations d'intérêts (p. ex. associations de branche, associations professionnelles, organisations de lobbying, fondations, associations d'utilité publique).
  GenderCodeEnum:
    description: |
      Gender codes for persons. If the gender is not known, no gender entry shall be added. The `non_binary` code shall be used together with a label to provide further details about the self-identified gender.
    annotations:
      description_de: |
        Geschlechtscodes für Personen. Wenn das Geschlecht nicht bekannt ist, soll kein Geschlechtseintrag hinzugefügt werden. Der Code `non_binary` soll zusammen mit einer Bezeichnung verwendet werden, um weitere Angaben zum selbst deklarierten Geschlecht bereitzustellen.
      description_fr: |
        Codes de sexe pour les personnes. Si le sexe n'est pas connu, aucune entrée de sexe ne doit être ajoutée. Le code `non_binary` doit être utilisé avec un libellé afin de fournir de plus amples détails sur le sexe auto-déclaré.
    permissible_values:
      male:
        meaning: https://register.ld.admin.ch/i14y/concept/sex/1
        description: Male.
        annotations:
          description_de: Männlich.
          description_fr: |
            Masculin.
      female:
        meaning: https://register.ld.admin.ch/i14y/concept/sex/2
        description: Female.
        annotations:
          description_de: Weiblich.
          description_fr: |
            Féminin.
      non_binary:
        description: Diverse / non-binary.
        annotations:
          description_de: Divers / nicht-binär.
          description_fr: |
            Divers / non binaire.
  LegalFormEnum:
    description: |
      Legal forms according to the code list published by the Federal Statistical Office on the I14Y platform, conformant to eCH-0108 (business master data and business register). See https://register.ld.admin.ch/i14y/concept/legalForm
    annotations:
      description_de: |
        Rechtsformen gemäss der Codeliste des Bundesamts für Statistik auf der I14Y-Plattform, konform zu eCH-0108 (Unternehmensstammdaten und Unternehmensregister). Siehe https://register.ld.admin.ch/i14y/concept/legalForm
